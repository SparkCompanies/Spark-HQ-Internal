<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Spark TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* TV_MODE_v1 - office pit TV display. Stage is a fixed 1920x1080 canvas scaled to fit any screen. */
:root{
  --bg:#07070a; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.075); --line:rgba(255,255,255,.09);
  --tx:#f5f2ea; --mt:#a9a39a; --dm:#6f6a63;
  --y:#FBD20F; --y2:#FFC800; --gold:#CC9F00; --ember:#FF6B2B; --ok:#3ddc97; --bad:#ff5d5d; --sky:#6cc4ff;
  --silver:#c9ccd6; --bronze:#d08a4a;
  --disp:"Bebas Neue","Oswald","Arial Narrow","Roboto Condensed",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Jost,system-ui,sans-serif;overflow:hidden}
body{cursor:none}
body.admin{cursor:auto;overflow:auto}
.num,.bb{font-family:var(--disp);letter-spacing:.02em;font-weight:400}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em;flex:none}

#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:
    radial-gradient(1200px 700px at 12% -10%, rgba(251,210,15,.16), transparent 60%),
    radial-gradient(900px 600px at 105% 110%, rgba(255,107,43,.12), transparent 60%),
    radial-gradient(700px 500px at 60% 40%, rgba(108,196,255,.05), transparent 70%),
    linear-gradient(180deg,#0d0c10 0%,#060608 100%);}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 80%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,.75)}

/* header */
.top{position:absolute;left:48px;right:48px;top:30px;height:78px;display:flex;align-items:center;gap:28px;z-index:3}
.top img{height:62px;filter:drop-shadow(0 4px 18px rgba(251,210,15,.25))}
.top .ttl{display:flex;flex-direction:column;line-height:1}
.top .ttl b{font-family:var(--disp);font-size:44px;letter-spacing:.06em;font-weight:400}
.top .ttl span{font-size:17px;color:var(--mt);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.top .sp{flex:1}
.live{display:flex;align-items:center;gap:10px;font-size:18px;color:var(--mt);letter-spacing:.08em;text-transform:uppercase}
.live i{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 2s infinite}
.live.stale i{background:var(--y2);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 14px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.clock{text-align:right;line-height:1}
.clock b{font-family:var(--disp);font-size:60px;font-weight:400;letter-spacing:.03em}
.clock span{display:block;font-size:17px;color:var(--mt);letter-spacing:.12em;text-transform:uppercase}

/* KPI strip */
.kpis{position:absolute;left:48px;right:48px;top:128px;height:176px;display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr 1.35fr;gap:22px;z-index:2}
.k{position:relative;border-radius:22px;padding:20px 26px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.025) 55%);
  border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.k::before{content:"";position:absolute;left:-30%;top:-80%;width:90%;height:160%;background:radial-gradient(closest-side,rgba(251,210,15,.13),transparent);pointer-events:none}
.k .lb{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;color:var(--mt);letter-spacing:.12em;text-transform:uppercase}
.k .lb svg{color:var(--y);font-size:22px}
.k .v{display:inline-block;white-space:nowrap;font-family:var(--disp);font-size:84px;line-height:.95;margin-top:10px;font-weight:400;
  background:linear-gradient(180deg,#fff 30%,#e9dcb0);-webkit-background-clip:text;background-clip:text;color:transparent}
.k.hero .v{background:linear-gradient(180deg,#fff7c4 0%,var(--y) 55%,var(--gold));-webkit-background-clip:text;background-clip:text;text-shadow:none;filter:drop-shadow(0 6px 22px rgba(251,210,15,.28))}
.k .v + .sub{margin-top:6px} .k .sub{display:flex;gap:14px;align-items:center;font-size:17px;color:var(--mt);margin-top:6px;white-space:nowrap}
.wow{display:inline-flex;align-items:center;gap:4px;font-weight:700;padding:3px 10px;border-radius:999px;font-size:16px}
.wow.up{color:var(--ok);background:rgba(61,220,151,.12)} .wow.dn{color:var(--bad);background:rgba(255,93,93,.12)} .wow.fl{color:var(--mt);background:rgba(255,255,255,.06)}
.goalk{display:flex;gap:22px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:40px;font-weight:400}
.goalk .gx{min-width:0}
.goalk .gx .v{font-size:62px;margin-top:4px}

/* main stage */
.main{position:absolute;left:48px;right:48px;top:326px;bottom:104px;z-index:2}
.slide{position:absolute;inset:0;opacity:0;transform:translateY(18px) scale(.995);transition:opacity .9s ease,transform .9s ease;pointer-events:none}
.slide.on{opacity:1;transform:none}
.sh{display:flex;align-items:flex-end;gap:18px;margin-bottom:16px}
.sh h2{font-family:var(--disp);font-weight:400;font-size:58px;letter-spacing:.04em;line-height:1;display:flex;align-items:center;gap:14px}
.sh h2 svg{color:var(--y);font-size:46px;filter:drop-shadow(0 0 14px rgba(251,210,15,.45))}
.sh .meta{font-size:19px;color:var(--mt);letter-spacing:.08em;text-transform:uppercase;padding-bottom:8px}
.sh .sp{flex:1}
.sh .chip{font-size:18px;color:var(--tx);padding:8px 16px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);margin-bottom:6px}
.card{border-radius:22px;background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);box-shadow:0 22px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}

/* leaderboard */
.lbw{display:grid;gap:14px 26px;grid-auto-flow:column}
.row{position:relative;display:flex;align-items:center;gap:14px;height:var(--rh,40px);padding:0 16px 0 10px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);overflow:hidden}
.row .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(251,210,15,.22),rgba(251,210,15,.04));transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.row > *:not(.bar){position:relative}
.rk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:22px;color:var(--mt);border:1px solid rgba(255,255,255,.14);flex:none}
.row.p1 .rk{background:radial-gradient(circle at 35% 30%,#fff3a8,var(--y) 55%,var(--gold));color:#1a1407;border:0;box-shadow:0 0 18px rgba(251,210,15,.55)}
.row.p2 .rk{background:radial-gradient(circle at 35% 30%,#fff,var(--silver) 60%,#8b8f9a);color:#16171b;border:0}
.row.p3 .rk{background:radial-gradient(circle at 35% 30%,#ffd9b0,var(--bronze) 60%,#8a5228);color:#1b1006;border:0}
.row.p1{border-color:rgba(251,210,15,.45);box-shadow:0 0 30px rgba(251,210,15,.15)}
.nm{flex:1;min-width:0;font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-size:15px;color:var(--dm);font-weight:500;margin-left:8px}
.amt{font-family:var(--disp);font-size:30px;letter-spacing:.03em}
.row.zero .amt,.row.zero .nm{color:var(--dm)}

/* goal slide */
.goalwrap{padding:46px 56px;height:calc(100% - 92px);display:flex;flex-direction:column;justify-content:center;gap:40px}
.gbig{display:flex;align-items:baseline;gap:22px}
.gbig .num{font-size:170px;line-height:.85;background:linear-gradient(180deg,#fff7c4,var(--y) 55%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 40px rgba(251,210,15,.3))}
.gbig span{font-size:40px;color:var(--mt)}
.track{position:relative;height:56px;border-radius:30px;background:rgba(255,255,255,.06);border:1px solid var(--line);box-shadow:inset 0 4px 16px rgba(0,0,0,.6)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:30px;background:linear-gradient(90deg,var(--gold),var(--y) 70%,#fff3a8);box-shadow:0 0 40px rgba(251,210,15,.45);transition:width 2s cubic-bezier(.2,.8,.2,1)}
.track .pace{position:absolute;top:-22px;bottom:-22px;width:3px;background:var(--sky);box-shadow:0 0 14px var(--sky)}
.track .pace b{position:absolute;top:-34px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:19px;color:var(--sky);letter-spacing:.08em;text-transform:uppercase}
.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.gstat{padding:22px 26px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.gstat span{display:block;font-size:18px;color:var(--mt);letter-spacing:.1em;text-transform:uppercase}
.gstat b{font-family:var(--disp);font-weight:400;font-size:62px;line-height:1}

/* celebrations */
.cel{display:grid;grid-template-columns:1fr 1fr;gap:26px;height:calc(100% - 92px)}
.cel .card{padding:24px 28px;overflow:hidden;position:relative}
.cel h3{display:flex;align-items:center;gap:12px;font-family:var(--disp);font-weight:400;font-size:42px;letter-spacing:.05em;margin-bottom:14px}
.cel h3 svg{color:var(--y);font-size:36px}
.cel .list{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.cp{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.035)}
.cp .d{width:58px;height:58px;border-radius:14px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,rgba(251,210,15,.22),rgba(251,210,15,.05));border:1px solid rgba(251,210,15,.3)}
.cp .d b{font-family:var(--disp);font-weight:400;font-size:32px;line-height:.9}
.cp .d i{font-style:normal;font-size:12px;letter-spacing:.12em;color:var(--mt)}
.cp .w{min-width:0}
.cp .w b{display:block;font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp .w span{font-size:16px;color:var(--mt)}
.cp.past{opacity:.5}
.cp.today{background:linear-gradient(90deg,rgba(251,210,15,.25),rgba(251,210,15,.06));box-shadow:0 0 0 2px rgba(251,210,15,.6),0 0 34px rgba(251,210,15,.3)}
.cp.today .w span{color:var(--y);font-weight:700}
.empty{color:var(--dm);font-size:22px;padding:20px 4px}

/* reqs */
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:21px}
.tbl th{font-size:16px;color:var(--mt);font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-align:left;padding:0 16px 2px}
.tbl td{padding:0 16px;height:52px;background:rgba(255,255,255,.04);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.tbl td:first-child{border-radius:12px 0 0 12px} .tbl td:last-child{border-radius:0 12px 12px 0}
.tbl .c{text-align:center}
.tbl .t{font-weight:600}
.pill{display:inline-block;min-width:46px;text-align:center;padding:2px 10px;border-radius:999px;font-family:var(--disp);font-size:26px;line-height:1.2}
.pill.hot{background:rgba(255,107,43,.18);color:var(--ember);box-shadow:inset 0 0 0 1px rgba(255,107,43,.4)}
.pill.ok{background:rgba(255,255,255,.07);color:var(--tx)}
.flame{color:var(--ember)}

/* floor */
.floor{display:grid;grid-template-columns:1fr 1.25fr;gap:26px;height:calc(100% - 92px)}
.floor .card{padding:24px 28px;overflow:hidden}
.floor h3{display:flex;align-items:center;gap:12px;font-family:var(--disp);font-weight:400;font-size:42px;letter-spacing:.05em;margin-bottom:14px}
.floor h3 svg{color:var(--y);font-size:34px}
.fl{display:flex;flex-direction:column;gap:10px}
.fi{display:flex;align-items:center;gap:16px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.035);font-size:21px}
.fi .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:22px;background:linear-gradient(160deg,#2a2a33,#15151a);border:1px solid var(--line);flex:none}
.fi .w{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .w small{color:var(--mt);font-size:16px;margin-left:8px}
.fi .r{color:var(--mt);font-size:17px;white-space:nowrap}

/* announcements */
.ann{display:grid;gap:22px;height:calc(100% - 92px);align-content:start}
.ann .card{padding:30px 36px}
.ann h3{font-size:38px;font-weight:700;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.ann h3 svg{color:var(--y)}
.ann p{font-size:24px;color:#d8d2c6;line-height:1.4}

/* dots + ticker */
.dots{position:absolute;right:48px;top:312px;display:flex;gap:8px;z-index:3}
.dots i{width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
.dots i.on::after{content:"";position:absolute;inset:0;background:var(--y);transform-origin:left;animation:dot var(--dur,15s) linear forwards}
.dots i.done{background:rgba(251,210,15,.45)}
@keyframes dot{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tick{position:absolute;left:0;right:0;bottom:0;height:78px;display:flex;align-items:center;z-index:3;
  background:linear-gradient(180deg,rgba(10,10,12,.2),rgba(10,10,12,.95));border-top:1px solid rgba(251,210,15,.25)}
.tick .tag{height:100%;display:flex;align-items:center;gap:10px;padding:0 28px 0 48px;font-family:var(--disp);font-size:34px;letter-spacing:.06em;color:#1a1407;
  background:linear-gradient(90deg,var(--y),var(--y2));clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%);flex:none;padding-right:44px}
.tick .rail{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tick .run{display:inline-block;padding-left:100%;animation:run var(--td,60s) linear infinite;font-size:24px}
.tick .run span{margin-right:64px}
.tick .run b{color:var(--y);font-weight:600}
.tick .run svg{color:var(--y);margin-right:8px}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* spotlight */
.spot{display:grid;grid-template-columns:1.35fr 1fr;gap:26px;height:calc(100% - 92px)}
.spot .hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:48px;padding:40px 56px}
.spot .hero::before{content:"";position:absolute;inset:-40%;background:radial-gradient(closest-side,rgba(251,210,15,.22),transparent 70%);left:-30%;top:-50%;pointer-events:none}
.av-xl{position:relative;width:300px;height:300px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--disp);font-size:130px;color:#1a1407;
  background:radial-gradient(circle at 35% 30%,#fff3a8,var(--y) 55%,var(--gold));box-shadow:0 0 0 8px rgba(251,210,15,.25),0 0 80px rgba(251,210,15,.45),inset 0 -10px 30px rgba(0,0,0,.25);overflow:hidden}
.av-xl img{width:100%;height:100%;object-fit:cover}
.spot .who{position:relative;min-width:0}
.spot .who .tag{display:inline-flex;align-items:center;gap:10px;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--y);font-weight:700}
.spot .who h3{font-family:var(--disp);font-weight:400;font-size:104px;line-height:.95;margin:10px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot .who .bu{font-size:26px;color:var(--mt)}
.spot .who .amt{font-family:var(--disp);font-size:120px;line-height:1;margin-top:18px;background:linear-gradient(180deg,#fff7c4,var(--y) 55%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 30px rgba(251,210,15,.3))}
.spot .side{display:flex;flex-direction:column;gap:26px}
.spot .ru{flex:1;display:flex;align-items:center;gap:26px;padding:26px 32px}
.av-md{width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--disp);font-size:54px;overflow:hidden}
.av-md img{width:100%;height:100%;object-fit:cover}
.ru.s2 .av-md{background:radial-gradient(circle at 35% 30%,#fff,var(--silver) 60%,#8b8f9a);color:#16171b}
.ru.s3 .av-md{background:radial-gradient(circle at 35% 30%,#ffd9b0,var(--bronze) 60%,#8a5228);color:#1b1006}
.ru .w{min-width:0}
.ru .w span{font-size:18px;color:var(--mt);letter-spacing:.12em;text-transform:uppercase}
.ru .w b{display:block;font-size:40px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ru .w i{font-style:normal;font-family:var(--disp);font-size:56px;line-height:1}

/* unit race */
.race{display:flex;flex-direction:column;gap:12px}
.lane{display:grid;grid-template-columns:330px 1fr 190px;align-items:center;gap:22px;height:var(--lh,48px)}
.lane .n{font-size:24px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:12px}
.lane .n em{font-style:normal;font-family:var(--disp);font-size:24px;color:var(--mt);width:30px}
.lane .t{position:relative;height:60%;border-radius:999px;background:rgba(255,255,255,.05);overflow:hidden;box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
.lane .t i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--y));box-shadow:0 0 24px rgba(251,210,15,.35);transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.lane:first-child .t i{background:linear-gradient(90deg,var(--gold),var(--y) 70%,#fff3a8)}
.lane .a{font-family:var(--disp);font-size:36px;text-align:right}

/* welcome */
.welc{display:grid;grid-template-columns:repeat(var(--wc,3),1fr);gap:26px}
.welc .card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 28px;gap:14px}
.welc .av-md{width:170px;height:170px;font-size:72px;background:radial-gradient(circle at 35% 30%,#fff3a8,var(--y) 55%,var(--gold));color:#1a1407;box-shadow:0 0 50px rgba(251,210,15,.35)}
.welc b{font-size:38px;font-weight:600}
.welc span{font-size:22px;color:var(--mt)}
.welc em{font-style:normal;font-size:19px;color:var(--y);letter-spacing:.1em;text-transform:uppercase;font-weight:700}

/* pairing screen */
.pair{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center;z-index:9}
.pair img{height:110px;filter:drop-shadow(0 6px 30px rgba(251,210,15,.3))}
.pair h1{font-family:var(--disp);font-weight:400;font-size:64px;letter-spacing:.06em}
.pair .code{display:flex;gap:18px}
.pair .code b{width:150px;height:190px;border-radius:24px;display:grid;place-items:center;font-family:var(--disp);font-weight:400;font-size:160px;
  background:linear-gradient(170deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border:1px solid rgba(251,210,15,.45);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(251,210,15,.18);color:var(--y)}
.pair .code b:nth-child(3){margin-right:36px}
.pair p{font-size:30px;color:var(--mt);line-height:1.5;max-width:1300px}
.pair p strong{color:var(--tx)}
.pair small{font-size:20px;color:var(--dm)}

/* gate / admin */
.gate{position:absolute;inset:0;display:grid;place-items:center;z-index:9}
.gate .box{width:880px;padding:56px;text-align:center}
.gate h1{font-family:var(--disp);font-weight:400;font-size:64px;letter-spacing:.05em}
.gate p{font-size:24px;color:var(--mt);margin-top:12px;line-height:1.45}
#admin{max-width:980px;margin:48px auto;padding:0 24px;font-size:16px}
#admin header{display:flex;align-items:center;gap:18px;margin-bottom:28px}
#admin header img{height:46px}
#admin h1{font-family:var(--disp);font-weight:400;font-size:42px;letter-spacing:.05em}
#admin .card{padding:24px 26px;margin-bottom:18px}
#admin h2{font-size:20px;margin-bottom:6px}
#admin p.note{color:var(--mt);line-height:1.5;margin-bottom:14px}
#admin input{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px 14px;font:inherit;width:320px}
#admin button{background:var(--y);color:#1a1407;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}
#admin button.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
#admin button.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,93,93,.4)}
#admin table{width:100%;border-collapse:collapse}
#admin td,#admin th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
#admin th{color:var(--mt);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
#admin .newkey{margin-top:16px;padding:16px;border-radius:12px;background:rgba(251,210,15,.08);border:1px solid rgba(251,210,15,.35);word-break:break-all}
#admin .newkey code{display:block;margin:8px 0 12px;font-size:14px;color:var(--y)}
#admin a{color:var(--y)}
#admin input.code{width:200px;font-size:28px;letter-spacing:.3em;text-align:center;font-weight:700}
#admin .ok{margin-top:14px;color:var(--ok);font-weight:600}
</style>
</head>
<body>
<div id="stage" hidden></div>
<div id="admin" hidden></div>

<script>
(function () {
  'use strict';
  var WORKER = 'https://spark-hq-worker.sparkcompanies.workers.dev';
  var SB_URL = 'https://rdyzvohphrmkkowdsoam.supabase.co';
  var SB_KEY = 'sb_publishable_F1SY19w16Y4Frjd3C9RSGQ_6v4DmiO5';
  var LOGO = 'brand/spark-companies-reversed.svg';
  var REFRESH = { core: 5, floor: 5, reqs: 10, celebrate: 60, team: 60 }; // minutes
  var LS = function (k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };

  /* ---------- helpers ---------- */
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ICON = {
    bolt: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
    handshake: '<path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/>',
    trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
    cake: '<path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/>',
    award: '<circle cx="12" cy="8" r="6"/><path d="M15.48 12.89 17 22l-5-3-5 3 1.52-9.11"/>',
    flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
    plane: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
    rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
    mega: '<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
    up: '<path d="m18 15-6-6-6 6"/>', dn: '<path d="m6 9 6 6 6-6"/>', dollar: '<path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
    star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
  };
  var ic = function (n) { return '<svg class="i" viewBox="0 0 24 24">' + (ICON[n] || '') + '</svg>'; };
  var fmt$ = function (n) { return '$' + Math.round(Number(n) || 0).toLocaleString('en-US'); };
  var fmtK = function (n) { n = Number(n) || 0; var a = Math.abs(n); if (a >= 1e6) return '$' + (n / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M'; if (a >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K'; return '$' + Math.round(n); };
  var fmtN = function (n) { return n == null ? '--' : Math.round(Number(n) || 0).toLocaleString('en-US'); };
  var weLabel = function (iso) { if (!iso) return ''; var p = iso.split('-'); return 'WE ' + (+p[1]) + '.' + (+p[2]) + '.' + p[0].slice(2); };
  var initials = function (n) { var t = String(n || '').trim().split(/\s+/); return ((t[0] || '').charAt(0) + (t.length > 1 ? t[t.length - 1].charAt(0) : '')).toUpperCase(); };
  var wow = function (cur, prev, money) {
    if (cur == null || prev == null || !prev) return '';
    var d = cur - prev, pct = d / Math.abs(prev) * 100;
    var cls = Math.abs(pct) < 0.5 ? 'fl' : d > 0 ? 'up' : 'dn';
    return '<span class="wow ' + cls + '">' + (cls === 'up' ? ic('up') : cls === 'dn' ? ic('dn') : '') + Math.abs(pct).toFixed(1) + '%</span><span>vs ' + (money ? fmtK(prev) : fmtN(prev)) + ' last wk</span>';
  };

  /* ---------- route: TV (has key) vs admin setup ---------- */
  // A TV keeps its key in its own browser, so it comes back on its own after a restart.
  // Anyone signed in to HQ on this browser gets the setup page instead (unless the URL carries a key).
  var hasHqSession = (function () { try { var v = JSON.parse(LS('spark_hq_sb_auth') || 'null'); var s = v && (v.currentSession || v); return !!(s && s.access_token); } catch (e) { return false; } })();
  var urlKey = (function () { var m = /[#&?]key=([A-Za-z0-9_-]{20,})/.exec(location.hash + '&' + location.search); return m ? m[1] : null; })();
  var wantsSetup = /[#&?]setup/.test(location.hash + location.search);
  var key = urlKey || (!hasHqSession && !wantsSetup ? LS('spark_tv_key') : null);
  if (urlKey && !hasHqSession) LS('spark_tv_key', urlKey);
  if (key) tv(); else if (hasHqSession || wantsSetup) admin(); else pair();

  /* ================================================================= PAIRING (TV with no key yet) */
  function pair() {
    var stage = document.getElementById('stage');
    stage.hidden = false;
    var fit = function () { var s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'translate(' + ((innerWidth - 1920 * s) / 2) + 'px,' + ((innerHeight - 1080 * s) / 2) + 'px) scale(' + s + ')'; };
    addEventListener('resize', fit); fit();
    var pid = LS('spark_tv_pid');
    if (!pid || !/^[A-Za-z0-9_-]{24,64}$/.test(pid)) {
      var b = new Uint8Array(24); crypto.getRandomValues(b);
      pid = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
      LS('spark_tv_pid', pid);
    }
    var draw = function (code, msg) {
      var digits = String(code || '------').split('').map(function (d) { return '<b>' + esc(d) + '</b>'; }).join('');
      stage.innerHTML = '<div class="pair"><img src="' + LOGO + '" alt="Spark Companies"><h1>Connect this TV</h1><div class="code">' + digits + '</div>' +
        '<p>On a computer signed in to HQ, go to <strong>hq.sparktalentinc.com/tv</strong><br>and type this code under <strong>Pair a TV</strong>.</p><small>' + esc(msg || 'Waiting for a code\u2026') + '</small></div>';
    };
    var start = function () {
      draw(null, 'Getting a code\u2026');
      return fetch(WORKER + '/tv-pair?pid=' + pid, { method: 'POST' }).then(function (r) { return r.json(); })
        .then(function (j) { if (!j.ok) throw new Error(j.error || 'failed'); draw(j.code, 'Code is good for 15 minutes. This screen updates by itself.'); })
        .catch(function () { draw(null, 'Can\u2019t reach HQ right now. Trying again\u2026'); setTimeout(start, 15000); });
    };
    var poll = function () {
      fetch(WORKER + '/tv-pair?pid=' + pid, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
        if (j.key) { LS('spark_tv_key', j.key); LS('spark_tv_pid', null); location.replace(location.pathname); return; }
        if (j.expired) start();
      }).catch(function () {});
    };
    start(); setInterval(poll, 3000);
  }

  /* ================================================================= TV */
  function tv() {
    var stage = document.getElementById('stage');
    stage.hidden = false;
    var fit = function () { var s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'translate(' + ((innerWidth - 1920 * s) / 2) + 'px,' + ((innerHeight - 1080 * s) / 2) + 'px) scale(' + s + ')'; };
    addEventListener('resize', fit); fit();

    stage.innerHTML =
      '<div class="top"><img src="' + LOGO + '" alt="Spark Companies"><div class="ttl"><b>THE PIT</b><span id="weLbl">Live scoreboard</span></div><div class="sp"></div>' +
      '<div class="live" id="live"><i></i><span id="liveTx">Connecting</span></div><div class="clock"><b id="clk"></b><span id="dt"></span></div></div>' +
      '<div class="kpis" id="kpis"></div>' +
      '<div class="dots" id="dots"></div>' +
      '<div class="main" id="main"></div>' +
      '<div class="tick"><div class="tag">' + ic('bolt') + 'ON THE BOARD</div><div class="rail"><div class="run" id="run"></div></div></div>';

    var D = { core: null, celebrate: null, floor: null, reqs: null, team: null }, at = {}, err = {};

    // clock
    var tickClock = function () {
      var d = new Date();
      document.getElementById('clk').textContent = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      document.getElementById('dt').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
      var newest = Math.max.apply(null, Object.keys(at).map(function (k) { return at[k]; }).concat([0]));
      var live = document.getElementById('live'), tx = document.getElementById('liveTx');
      var anyErr = Object.keys(err).some(function (k) { return err[k]; });
      if (!newest) { tx.textContent = anyErr ? 'Reconnecting' : 'Connecting'; live.classList.toggle('stale', anyErr); return; }
      var mins = Math.floor((Date.now() - newest) / 60000);
      tx.textContent = 'Live \u00b7 updated ' + (mins < 1 ? 'just now' : mins + ' min ago');
      live.classList.toggle('stale', anyErr || mins > 20);
    };
    setInterval(tickClock, 15000); tickClock();

    // data
    var revoked = false;
    var load = function (part) {
      return fetch(WORKER + '/tv-feed?part=' + part + '&key=' + encodeURIComponent(key), { cache: 'no-store' })
        .then(function (r) { if (r.status === 401) { revoked = true; LS('spark_tv_key', null); throw new Error('revoked'); } return r.json(); })
        .then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || 'failed'); D[part] = j.data; at[part] = Date.parse(j.asOf) || Date.now(); err[part] = null; render(part); })
        .catch(function (e) { err[part] = String(e.message || e); if (revoked) showRevoked(); })
        .then(tickClock);
    };
    Object.keys(REFRESH).forEach(function (p, i) {
      setTimeout(function () { load(p); setInterval(function () { if (!revoked) load(p); }, REFRESH[p] * 60000); }, i * 900);
    });
    // pick up new page deploys and clear any memory creep: full reload every 6 hours
    setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);

    function showRevoked() {
      stage.innerHTML = '<div class="gate"><div class="box card"><img src="' + LOGO + '" style="height:80px" alt=""><h1>This TV link is off</h1><p>This TV was disconnected in HQ. Reconnecting\u2026</p></div></div>';
      setTimeout(function () { location.replace(location.pathname); }, 4000);
    }

    function render(part) {
      if (part === 'core') { renderKpis(); }
      if (part === 'floor' || part === 'celebrate') renderTicker();
      buildSlides();
    }

    function renderKpis() {
      var c = D.core; if (!c) return;
      document.getElementById('weLbl').textContent = 'Week ending ' + weLabel(c.weekEnding).replace('WE ', '') + (c.live ? ' \u00b7 live' : '');
      var p = c.prev || {};
      var g = c.goal || {};
      var pct = g.pct == null ? 0 : g.pct, C = 2 * Math.PI * 56;
      var ahead = g.pct != null && g.pct >= g.pacePct;
      document.getElementById('kpis').innerHTML =
        '<div class="k hero"><div class="lb">' + ic('bolt') + 'Total charge \u00b7 week</div><div class="v">' + fmt$(c.charge.total) + '</div><div class="sub">' + wow(c.charge.total, p.total, true) + '</div></div>' +
        '<div class="k"><div class="lb">' + ic('clock') + 'Hours billed</div><div class="v">' + fmtN(c.hours) + '</div><div class="sub">' + wow(c.hours, p.hours, false) + '</div></div>' +
        '<div class="k"><div class="lb">' + ic('users') + 'Headcount</div><div class="v">' + fmtN(c.headcount) + '</div><div class="sub">' + wow(c.headcount, p.headcount, false) + '</div></div>' +
        '<div class="k"><div class="lb">' + ic('handshake') + 'DH billed</div><div class="v">' + fmt$(c.charge.direct) + '</div><div class="sub">' + wow(c.charge.direct, p.direct, true) + '</div></div>' +
        '<div class="k"><div class="goalk"><div class="ring"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="56" stroke="rgba(255,255,255,.1)" stroke-width="12" fill="none"/>' +
          '<circle cx="66" cy="66" r="56" stroke="url(#gg)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="' + (C * Math.min(pct, 100) / 100).toFixed(1) + ' ' + C.toFixed(1) + '"/>' +
          '<defs><linearGradient id="gg"><stop offset="0" stop-color="#CC9F00"/><stop offset="1" stop-color="#FBD20F"/></linearGradient></defs></svg><b>' + Math.round(pct) + '%</b></div>' +
          '<div class="gx"><div class="lb">' + ic('target') + 'To Igniter \u00b7 YTD</div><div class="v">' + fmtK(g.ytd) + '</div><div class="sub"><span>of ' + fmtK(g.annual) + ' \u00b7 </span><span class="wow ' + (ahead ? 'up' : 'dn') + '">' + (ahead ? 'Ahead of pace' : 'Behind pace') + '</span></div></div></div></div>';
      fitKpis(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitKpis);
    }

    function fitKpis() {
      document.querySelectorAll('#kpis .v').forEach(function (v) {
        v.style.fontSize = ''; var fs = parseFloat(getComputedStyle(v).fontSize), par = v.parentElement, cs = getComputedStyle(par);
        var box = par.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
        while (v.offsetWidth > box && fs > 40) { fs -= 3; v.style.fontSize = fs + 'px'; }
      });
    }

    function renderTicker() {
      var items = [];
      var f = D.floor, cl = D.celebrate;
      if (cl) {
        (cl.birthdays || []).filter(function (x) { return x.today; }).forEach(function (x) { items.push(ic('cake') + 'Happy birthday, <b>' + esc(x.name) + '</b>!'); });
        (cl.anniversaries || []).filter(function (x) { return x.today; }).forEach(function (x) { items.push(ic('award') + '<b>' + esc(x.name) + '</b> celebrates ' + x.years + ' year' + (x.years === 1 ? '' : 's') + ' with Spark today'); });
      }
      if (f) {
        (f.wins || []).forEach(function (w) { items.push(ic('trophy') + 'New business: <b>' + esc(w.account || w.name) + '</b>' + (w.owner ? ' \u00b7 ' + esc(w.owner) : '')); });
        (f.starts || []).forEach(function (s) { items.push(ic('rocket') + '<b>' + esc(s.who) + '</b> ' + (s.date > new Date().toISOString().slice(0, 10) ? 'starts' : 'started') + ' as ' + esc(s.title) + (s.account ? ' at ' + esc(s.account) : '') + (s.recruiter ? ' \u00b7 placed by <b>' + esc(s.recruiter) + '</b>' : '')); });
      }
      if (!items.length) items.push(ic('bolt') + 'Let\u2019s get after it, Spark.');
      var run = document.getElementById('run');
      run.innerHTML = items.map(function (x) { return '<span>' + x + '</span>'; }).join('');
      run.style.setProperty('--td', Math.max(40, items.length * 9) + 's');
    }

    /* ----- slides ----- */
    var slides = [], cur = -1, timer = null;
    function buildSlides() {
      var list = [];
      if (D.core) {
        if ((D.core.spotlight || []).length) list.push({ id: 'spot', dur: 12, html: slideSpot });
        list.push({ id: 'board', dur: 30, html: slideBoard });
        if ((D.core.monthBoard || []).some(function (x) { return x.raw > 0; })) list.push({ id: 'month', dur: 25, html: slideMonth });
        if ((D.core.units || []).length) list.push({ id: 'units', dur: 15, html: slideUnits });
        list.push({ id: 'goal', dur: 15, html: slideGoal });
      }
      if (D.team && (D.team.newHires || []).length) list.push({ id: 'welcome', dur: 12, html: slideWelcome });
      if (D.celebrate) list.push({ id: 'celebrate', dur: 18, html: slideCelebrate });
      if (D.reqs) list.push({ id: 'reqs', dur: 20, html: slideReqs });
      if (D.floor) list.push({ id: 'floor', dur: 16, html: slideFloor });
      if (D.floor && (D.floor.announcements || []).length) list.push({ id: 'ann', dur: 15, html: slideAnn });
      var main = document.getElementById('main');
      var curId = slides[cur] && slides[cur].id;
      slides = list;
      main.innerHTML = list.map(function (s) { return '<section class="slide" data-id="' + s.id + '">' + s.html() + '</section>'; }).join('');
      document.getElementById('dots').innerHTML = list.map(function () { return '<i></i>'; }).join('');
      var idx = list.findIndex(function (s) { return s.id === curId; });
      show(idx === -1 ? 0 : idx, true);
    }
    function show(i, keepTimer) {
      if (!slides.length) return;
      cur = (i + slides.length) % slides.length;
      var secs = document.querySelectorAll('#main .slide');
      secs.forEach(function (s, k) { s.classList.toggle('on', k === cur); });
      var dots = document.querySelectorAll('#dots i');
      dots.forEach(function (d, k) { d.className = k < cur ? 'done' : k === cur ? 'on' : ''; d.style.setProperty('--dur', slides[k].dur + 's'); });
      if (keepTimer && timer) return;
      clearTimeout(timer);
      timer = setTimeout(function () { timer = null; show(cur + 1); }, slides[cur].dur * 1000);
    }

    var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    function slideMonth() {
      var c = D.core, m = c.month || {}, name = m.key ? MONTHS[+m.key.slice(5, 7) - 1] : 'Month';
      return boardHtml(c.monthBoard || [], name + ' to date', (m.weeks || 0) + ' week' + (m.weeks === 1 ? '' : 's') + ' \u00b7 raw charge, contract + DH');
    }
    function slideBoard() {
      var c = D.core;
      return boardHtml(c.board || [], 'Charge leaders', weLabel(c.weekEnding) + ' \u00b7 raw charge, contract + DH');
    }
    function avatar(p, cls) {
      return '<div class="' + cls + '">' + (p.photo ? '<img src="' + esc(p.photo) + '" alt="">' : esc(initials(p.name))) + '</div>';
    }
    function slideSpot() {
      var c = D.core, s = c.spotlight || [], a = s[0];
      var side = s.slice(1).map(function (p, i) {
        return '<div class="card ru s' + (i + 2) + '">' + avatar(p, 'av-md') + '<div class="w"><span>#' + (i + 2) + ' this week</span><b>' + esc(p.name) + '</b><i>' + fmt$(p.raw) + '</i></div></div>';
      }).join('');
      return '<div class="sh"><h2>' + ic('trophy') + 'Producer of the week</h2><span class="meta">' + weLabel(c.weekEnding) + '</span></div>' +
        '<div class="spot"' + (side ? '' : ' style="grid-template-columns:1fr"') + '><div class="card hero">' + avatar(a, 'av-xl') +
        '<div class="who"><span class="tag">' + ic('star') + 'Number one</span><h3>' + esc(a.name) + '</h3><div class="bu">' + esc([a.title, a.bu].filter(Boolean).join(' \u00b7 ')) + '</div><div class="amt">' + fmt$(a.raw) + '</div></div></div>' +
        (side ? '<div class="side">' + side + '</div>' : '') + '</div>';
    }
    function slideUnits() {
      var c = D.core, u = c.units || [], max = Math.max.apply(null, u.map(function (x) { return x.charge; }).concat([1]));
      var lh = Math.max(38, Math.min(56, Math.floor((566 - (u.length - 1) * 12) / Math.max(1, u.length))));
      return '<div class="sh"><h2>' + ic('flame') + 'Business unit race</h2><span class="meta">' + weLabel(c.weekEnding) + ' \u00b7 charge, contract + DH</span></div>' +
        '<div class="race" style="--lh:' + lh + 'px">' + u.map(function (x, i) {
          return '<div class="lane"><span class="n"><em>' + (i + 1) + '</em>' + esc(x.unit) + '</span><span class="t"><i style="width:' + Math.max(2, x.charge / max * 100).toFixed(1) + '%"></i></span><span class="a">' + fmt$(x.charge) + '</span></div>';
        }).join('') + '</div>';
    }
    function slideWelcome() {
      var h = (D.team.newHires || []).slice(0, 6), today = new Date().toISOString().slice(0, 10);
      return '<div class="sh"><h2>' + ic('handshake') + 'Welcome to the team</h2></div><div class="welc" style="--wc:' + Math.min(3, h.length) + '">' + h.map(function (p) {
        var d = new Date(p.hire + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        return '<div class="card">' + avatar(p, 'av-md') + '<b>' + esc(p.name) + '</b><span>' + esc([p.title, p.company].filter(Boolean).join(' \u00b7 ')) + '</span><em>' + (p.hire > today ? 'Starts ' : 'Started ') + d + '</em></div>';
      }).join('') + '</div>';
    }
    function boardHtml(b, title, meta) {
      var n = b.length, cols = n <= 12 ? 1 : n <= 26 ? 2 : n <= 45 ? 3 : 4;
      var rows = Math.ceil(n / cols), gap = rows > 12 ? 6 : 10, avail = 566, rh = Math.max(30, Math.min(56, Math.floor((avail - (rows - 1) * gap) / rows)));
      var max = Math.max.apply(null, b.map(function (x) { return x.raw; }).concat([1]));
      var out = b.map(function (p, i) {
        var w = p.raw > 0 ? Math.max(3, p.raw / max * 100) : 0;
        return '<div class="row' + (i < 3 && p.raw > 0 ? ' p' + (i + 1) : '') + (p.raw <= 0 ? ' zero' : '') + '"><div class="bar" style="width:' + w.toFixed(1) + '%"></div><span class="rk">' + (i + 1) + '</span>' +
          '<span class="nm">' + esc(p.name) + (cols <= 2 && p.bu ? '<small>' + esc(p.bu) + '</small>' : '') + '</span><span class="amt">' + (p.raw > 0 ? fmt$(p.raw) : '--') + '</span></div>';
      }).join('');
      return '<div class="sh"><h2>' + ic('trophy') + esc(title) + '</h2><span class="meta">' + esc(meta) + '</span><span class="sp"></span><span class="chip">' + n + ' producers</span></div>' +
        '<div class="lbw" style="grid-template-rows:repeat(' + rows + ',auto);grid-template-columns:repeat(' + cols + ',1fr);row-gap:' + gap + 'px;--rh:' + rh + 'px">' + out + '</div>';
    }

    function slideGoal() {
      var c = D.core, g = c.goal || {};
      var pct = Math.min(100, g.pct || 0), pace = Math.min(100, g.pacePct || 0);
      var paceAmt = (g.annual || 0) * (g.pacePct || 0) / 100, gap = (g.ytd || 0) - paceAmt;
      var weeksLeft = Math.max(1, Math.ceil((new Date(c.weekEnding.slice(0, 4) + '-12-31T12:00:00') - new Date(c.weekEnding + 'T12:00:00')) / (7 * 864e5)));
      var need = Math.max(0, ((g.annual || 0) - (g.ytd || 0)) / weeksLeft);
      return '<div class="sh"><h2>' + ic('target') + 'Road to Igniter</h2><span class="meta">' + c.weekEnding.slice(0, 4) + ' company Igniter \u00b7 ' + fmtK(g.annual) + ' \u00b7 contract + DH</span></div>' +
        '<div class="card goalwrap"><div class="gbig"><span class="num">' + fmtK(g.ytd) + '</span><span>year to date \u00b7 ' + (g.pct == null ? '--' : g.pct.toFixed(1)) + '% to Ignite</span></div>' +
        '<div class="track"><div class="fill" style="width:' + pct.toFixed(1) + '%"></div><div class="pace" style="left:' + pace.toFixed(1) + '%"><b>Pace ' + Math.round(pace) + '%</b></div></div>' +
        '<div class="gstats">' +
          '<div class="gstat"><span>This week</span><b>' + fmtK(c.charge.total) + '</b></div>' +
          '<div class="gstat"><span>Weekly Igniter pace</span><b>' + fmtK(g.weekly) + '</b></div>' +
          '<div class="gstat"><span>' + (gap >= 0 ? 'Ahead of pace' : 'Behind pace') + '</span><b style="color:' + (gap >= 0 ? 'var(--ok)' : 'var(--bad)') + '">' + fmtK(Math.abs(gap)) + '</b></div>' +
          '<div class="gstat"><span>Needed / week to finish</span><b>' + fmtK(need) + '</b></div>' +
        '</div></div>';
    }

    function slideCelebrate() {
      var c = D.celebrate, mon = (c.monthName || '').slice(0, 3).toUpperCase();
      var cell = function (x, kind) {
        var sub = x.today ? (kind === 'b' ? 'Today!' : x.years + ' years today!') : (kind === 'b' ? (x.company || 'Birthday') : x.years + ' year' + (x.years === 1 ? '' : 's') + (x.company ? ' \u00b7 ' + x.company : ''));
        return '<div class="cp' + (x.today ? ' today' : x.past ? ' past' : '') + '"><div class="d"><i>' + mon + '</i><b>' + x.day + '</b></div><div class="w"><b>' + esc(x.name) + '</b><span>' + esc(sub) + '</span></div></div>';
      };
      var col = function (arr, kind, maxN) {
        if (!arr.length) return '<div class="empty">None this month</div>';
        var up = arr.filter(function (x) { return !x.past; }), past = arr.filter(function (x) { return x.past; });
        var pick = up.concat(past).slice(0, maxN).sort(function (a, b) { return a.day - b.day; });
        return '<div class="list">' + pick.map(function (x) { return cell(x, kind); }).join('') + '</div>' + (arr.length > maxN ? '<div class="empty" style="padding-top:10px">+' + (arr.length - maxN) + ' more this month</div>' : '');
      };
      return '<div class="sh"><h2>' + ic('star') + 'Celebrating in ' + esc(c.monthName) + '</h2></div>' +
        '<div class="cel"><div class="card"><h3>' + ic('cake') + 'Birthdays</h3>' + col(c.birthdays || [], 'b', 14) + '</div>' +
        '<div class="card"><h3>' + ic('award') + 'Work anniversaries</h3>' + col(c.anniversaries || [], 'a', 14) + '</div></div>';
    }

    function slideReqs() {
      var r = D.reqs;
      var rows = (r.hot || []).slice(0, 9).map(function (j) {
        return '<tr><td class="t">' + (j.gap > 0 ? '<span class="flame">' + ic('flame') + '</span> ' : '') + esc(j.title) + '</td><td>' + esc(j.account) + '</td><td>' + esc(j.location) + '</td>' +
          '<td class="c"><span class="pill ' + (j.gap > 0 ? 'hot' : 'ok') + '">' + j.open + '</span></td><td class="c"><span class="pill ok">' + j.inProcess + '</span></td>' +
          '<td>' + esc(j.bu || '--') + '</td><td class="c">' + (j.days == null ? '--' : j.days + 'd') + '</td><td>' + esc(j.recruiter || '--') + '</td></tr>';
      }).join('');
      return '<div class="sh"><h2>' + ic('flame') + 'Hot reqs</h2><span class="meta">Most open seats with the thinnest pipeline \u00b7 Plug-In Board</span><span class="sp"></span>' +
        '<span class="chip">' + fmtN(r.totalOpenReqs) + ' open reqs \u00b7 ' + fmtN(r.totalOpenings) + ' openings</span></div>' +
        (rows ? '<table class="tbl"><thead><tr><th>Position</th><th>Client</th><th>Location</th><th class="c">Open</th><th class="c">In process</th><th>Unit</th><th class="c">Age</th><th>Recruiter</th></tr></thead><tbody>' + rows + '</tbody></table>' : '<div class="card empty" style="padding:30px">No open reqs right now.</div>');
    }

    function slideFloor() {
      var f = D.floor;
      var out = (f.out || []).slice(0, 8).map(function (o) {
        var until = o.until ? 'Back ' + new Date(o.until).toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' }) : 'Out today';
        return '<div class="fi"><span class="av">' + esc(initials(o.name)) + '</span><span class="w">' + esc(o.name) + (o.title ? '<small>' + esc(o.title) + '</small>' : '') + '</span><span class="r">' + until + '</span></div>';
      }).join('');
      var starts = (f.starts || []).slice(0, 8).map(function (s) {
        var d = new Date(s.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
        return '<div class="fi"><span class="av">' + esc(initials(s.who)) + '</span><span class="w">' + esc(s.who) + ' \u00b7 ' + esc(s.title) + (s.account ? '<small>' + esc(s.account) + '</small>' : '') + '</span><span class="r">' + d + (s.recruiter ? ' \u00b7 ' + esc(s.recruiter) : '') + '</span></div>';
      }).join('');
      return '<div class="sh"><h2>' + ic('users') + 'Around the floor</h2></div>' +
        '<div class="floor"><div class="card"><h3>' + ic('plane') + 'Who\u2019s out</h3><div class="fl">' + (out || '<div class="empty">' + (f.outError ? 'Out-of-office feed unavailable' : 'Everyone\u2019s in today') + '</div>') + '</div></div>' +
        '<div class="card"><h3>' + ic('rocket') + 'Starts this week</h3><div class="fl">' + (starts || '<div class="empty">No starts this week yet</div>') + '</div></div></div>';
    }

    function slideAnn() {
      var a = (D.floor.announcements || []).slice(0, 3);
      return '<div class="sh"><h2>' + ic('mega') + 'Announcements</h2></div><div class="ann">' +
        a.map(function (x) { return '<div class="card"><h3>' + (x.pinned ? ic('star') : '') + esc(x.title) + '</h3>' + (x.body ? '<p>' + esc(x.body) + '</p>' : '') + '</div>'; }).join('') + '</div>';
    }
  }

  /* ================================================================= ADMIN (TV link setup) */
  function admin() {
    document.body.classList.add('admin');
    var el = document.getElementById('admin'); el.hidden = false;
    var token = function () {
      try { var v = JSON.parse(localStorage.getItem('spark_hq_sb_auth') || 'null'); var s = v && (v.currentSession || v); return s && s.access_token; } catch (e) { return null; }
    };
    var refresh = function () {
      try {
        var v = JSON.parse(localStorage.getItem('spark_hq_sb_auth') || 'null'); var s = v && (v.currentSession || v); if (!s || !s.refresh_token) return Promise.resolve(null);
        return fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY }, body: JSON.stringify({ refresh_token: s.refresh_token }) })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { if (!d || !d.access_token) return null; var ns = Object.assign({}, s, d); if (d.expires_in) ns.expires_at = Math.floor(Date.now() / 1000) + d.expires_in; localStorage.setItem('spark_hq_sb_auth', JSON.stringify(v && v.currentSession ? Object.assign({}, v, { currentSession: ns }) : ns)); return d.access_token; });
      } catch (e) { return Promise.resolve(null); }
    };
    var api = function (method, body, retried) {
      return fetch(WORKER + '/tv-displays', { method: method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (token() || '') }, body: body ? JSON.stringify(body) : undefined })
        .then(function (r) {
          if (r.status === 401 && !retried) return refresh().then(function (t) { if (!t) throw new Error('Sign in to HQ first'); return api(method, body, true); });
          return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || ('Error ' + r.status)); return j; });
        });
    };
    var base = location.origin + location.pathname;
    el.innerHTML = '<header><img src="' + LOGO + '" alt="Spark Companies"><h1>Pit TV setup</h1></header>' +
      '<div class="card"><h2>Pair a TV</h2><p class="note">On the TV\u2019s browser, go to <b>hq.sparktalentinc.com/tv</b>. It shows a 6-digit code. Type the code and a name for the TV here. The TV connects within a few seconds and remembers itself after that.</p>' +
      '<input id="pc" class="code" inputmode="numeric" maxlength="7" placeholder="000000"> <input id="pn" placeholder="TV name, e.g. Troy pit - left" maxlength="60"> <button id="pair">Pair TV</button><div id="pairok"></div></div>' +
      '<div class="card"><h2>Or make a link</h2><p class="note">Each TV gets its own private link. Open the link once in the TV\u2019s browser (full screen, F11) and it stays on the scoreboard, refreshing itself. The link shows weekly charge numbers, so only open it on office TVs. Revoke it here if a TV is moved or replaced.</p>' +
      '<input id="nm" placeholder="TV name, e.g. Troy pit - left" maxlength="60"> <button id="add">Create TV link</button><div id="newk"></div></div>' +
      '<div class="card"><h2>TVs</h2><div id="lst" class="note">Loading\u2026</div></div>';
    var draw = function () {
      api('GET').then(function (j) {
        var d = j.displays || [];
        document.getElementById('lst').innerHTML = !d.length ? 'No TVs yet.' : '<table><thead><tr><th>Name</th><th>Status</th><th>Last seen</th><th>Created</th><th></th></tr></thead><tbody>' +
          d.slice().reverse().map(function (x) {
            return '<tr><td>' + esc(x.name) + '</td><td>' + (x.active ? '<span style="color:var(--ok)">Active</span>' : '<span style="color:var(--dm)">Revoked</span>') + '</td><td>' + (x.seen ? new Date(x.seen).toLocaleString() : 'Never') + '</td><td>' + esc((x.created_by || '').split('@')[0]) + ' \u00b7 ' + new Date(x.created_at).toLocaleDateString() + '</td><td>' +
              (x.active ? '<button class="danger" data-rv="' + esc(x.id) + '">Revoke</button>' : '') + '</td></tr>';
          }).join('') + '</tbody></table>';
      }).catch(function (e) {
        document.getElementById('lst').innerHTML = esc(e.message) + (/sign in/i.test(e.message) ? ' \u2014 <a href="/">open HQ</a>, sign in, then come back.' : '');
      });
    };
    el.addEventListener('click', function (ev) {
      var t = ev.target;
      if (t.id === 'add') {
        t.disabled = true;
        api('POST', { action: 'create', name: document.getElementById('nm').value }).then(function (j) {
          var link = base + '#key=' + j.key;
          document.getElementById('newk').innerHTML = '<div class="newkey"><b>' + esc(j.display.name) + '</b> link (shown once \u2014 copy it now):<code>' + esc(link) + '</code><button id="cp" data-l="' + esc(link) + '">Copy link</button> <a href="' + esc(link) + '" target="_blank" rel="noopener">Preview</a></div>';
          document.getElementById('nm').value = ''; draw();
        }).catch(function (e) { alert(e.message); }).then(function () { t.disabled = false; });
      }
      if (t.id === 'pair') {
        t.disabled = true;
        api('POST', { action: 'pair', code: document.getElementById('pc').value, name: document.getElementById('pn').value }).then(function (j) {
          document.getElementById('pairok').innerHTML = '<div class="ok">' + esc(j.display.name) + ' is paired. It will switch to the scoreboard in a few seconds.</div>';
          document.getElementById('pc').value = ''; document.getElementById('pn').value = ''; draw();
        }).catch(function (e) { alert(e.message); }).then(function () { t.disabled = false; });
      }
      if (t.id === 'cp') { navigator.clipboard.writeText(t.getAttribute('data-l')).then(function () { t.textContent = 'Copied'; }); }
      var rv = t.getAttribute && t.getAttribute('data-rv');
      if (rv && confirm('Revoke this TV link? That TV will go dark until you give it a new link.')) api('POST', { action: 'revoke', id: rv }).then(draw).catch(function (e) { alert(e.message); });
    });
    draw();
  }
})();
</script>
</body>
</html>
