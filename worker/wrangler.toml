# Cloudflare Worker deploy config — lives at worker/wrangler.toml in the repo
name = "spark-hq-worker"          # MUST match the worker's exact name in the Cloudflare dashboard
main = "cloudworker.js"           # the worker file, sitting next to this toml in worker/
account_id = "PASTE_ACCOUNT_ID_HERE"  # Cloudflare dashboard -> Workers & Pages -> right sidebar "Account ID"
compatibility_date = "2024-01-01"

# CRITICAL: preserves the environment variables already set in the Cloudflare dashboard
# (Supabase keys, Xero client id/secret, Graph creds, SF creds, XERO_CC_*, etc).
# Without this, a wrangler deploy can wipe dashboard-set plaintext vars.
keep_vars = true
