<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spark Boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F6F7FB; --surface:#FFFFFF; --surface-2:#FBFCFE;
    --ink:#16161D; --sub:#6B7280; --faint:#9AA0AC;
    --border:#E7E9F0; --border-strong:#D7DAE4;
    --gold:#D4A843; --gold-deep:#B8862F; --gold-soft:#F7EFD8;
    --sidebar:#16161D; --sidebar-2:#1F1F28; --sidebar-line:#2C2C38;
    --s-notstarted:#C4C7D0; --s-working:#FDAB3D; --s-stuck:#E2445C;
    --s-done:#00C875; --s-blue:#579BFC; --s-purple:#A25DDC;
    --shadow:0 1px 2px rgba(16,16,29,.04),0 4px 16px rgba(16,16,29,.06);
    --shadow-lg:0 8px 30px rgba(16,16,29,.12);
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit}
  ::selection{background:var(--gold-soft)}
  .jost{font-family:'Jost',sans-serif}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Layout */
  .app{display:flex;height:100vh;overflow:hidden}
  .sidebar{width:262px;flex-shrink:0;background:var(--sidebar);color:#E8E9EE;display:flex;flex-direction:column;border-right:1px solid #000}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .content{flex:1;overflow:auto}
  .content.no-scroll{overflow:hidden}

  /* Sidebar */
  .brand{display:flex;align-items:center;gap:11px;padding:18px 20px 16px}
  .brand-mark{width:30px;height:30px;flex-shrink:0}
  .brand-name{font-family:'Jost';font-weight:600;font-size:18px;letter-spacing:.04em}
  .brand-name b{color:var(--gold);font-weight:700}
  .side-section{padding:6px 12px}
  .side-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6E6E7C;padding:14px 12px 7px}
  .side-label.tight{padding-top:10px}
  .fav-list{max-height:20vh;overflow-y:auto;flex-shrink:0}
  .ws-scroll{flex:1 1 auto;min-height:140px;overflow-y:auto}
  .sidebar>.side-section:first-of-type{flex-shrink:0}
  .sidebar .side-foot{flex-shrink:0}
  .nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:8px;color:#C8CAD3;font-size:14px;font-weight:500;text-align:left;position:relative}
  .nav-item:hover{background:var(--sidebar-2);color:#fff}
  .nav-item.active{background:var(--sidebar-2);color:#fff}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
  .board-row{display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;border-radius:8px;color:#C8CAD3;font-size:13.5px;text-align:left;position:relative}
  .board-row:hover{background:var(--sidebar-2);color:#fff}
  .board-row.active{background:var(--sidebar-2);color:#fff}
  .board-row.active::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
  .board-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
  .board-row .star{margin-left:auto;opacity:0;color:var(--gold)}
  .board-row:hover .star{opacity:.6}
  .board-row .star.on{opacity:1}
  .ws-head{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;color:#8A8C97;font:600 11px/1 'Jost',sans-serif;letter-spacing:.5px;text-transform:uppercase;padding:9px 14px 5px;cursor:pointer;text-align:left}
  .ws-head:hover{color:#fff}
  .ws-head .chev{transition:transform .15s;flex-shrink:0}
  .ws-head.open .chev{transform:rotate(90deg)}
  .ws-count{margin-left:auto;font-size:10.5px;opacity:.65;font-weight:500}
  .side-foot{margin-top:auto;border-top:1px solid var(--sidebar-line);padding:12px}
  .user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px}
  .user-chip:hover{background:var(--sidebar-2)}
  .new-board-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:8px 0 4px;padding:9px;border-radius:8px;background:var(--gold);color:#1A1407;font-weight:600;font-size:13.5px}
  .new-board-btn:hover{background:#E0B654}
  .sb-hdr{display:flex;align-items:center;gap:6px;padding:2px 12px 8px}
  .sb-search{flex:1;display:flex;align-items:center;gap:7px;background:var(--sidebar-2);border:1px solid transparent;border-radius:8px;padding:6px 9px;transition:border-color .12s}
  .sb-search:focus-within{border-color:var(--gold)}
  .sb-search svg{width:14px;height:14px;flex-shrink:0;opacity:.55}
  .sb-search input{flex:1;min-width:0;background:none;border:0;outline:none;color:#E8E9EE;font-size:13px;font-family:inherit}
  .sb-search input::placeholder{color:#7A7C88}
  .sb-iconbtn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex-shrink:0;border-radius:7px;background:none;border:0;color:#8A8C97;cursor:pointer}
  .sb-iconbtn:hover{background:var(--sidebar-2);color:#fff}
  .sb-iconbtn svg{width:16px;height:16px}
  .board-glyph{width:16px;height:16px;flex-shrink:0;opacity:.9}
  .sb-empty{color:#7A7C88;font-size:12.5px;padding:10px 12px}
  .ws-pill-wrap{position:relative;padding:0 12px 4px;display:flex;align-items:center;gap:6px}
  .ws-pill{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:var(--sidebar-2);border:1px solid transparent;border-radius:9px;padding:7px 9px;color:#E8E9EE;cursor:pointer;text-align:left}
  .ws-pill:hover{border-color:#3A3C48}
  .ws-tile{width:24px;height:24px;flex-shrink:0;border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 12px/1 'Jost',sans-serif;color:#1A1407}
  .ws-pill-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:600}
  .ws-pill .chev{flex-shrink:0;opacity:.6;transition:transform .15s}
  .ws-pill.open .chev{transform:rotate(90deg)}
  .ws-menu{position:absolute;top:100%;left:12px;right:12px;z-index:70;background:#25262F;border:1px solid #3A3C48;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.45);padding:5px;max-height:320px;overflow-y:auto}
  .ws-opt{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:7px;background:none;border:0;color:#C8CAD3;font-size:13.5px;text-align:left;cursor:pointer}
  .ws-opt:hover{background:#31333E;color:#fff}
  .ws-opt.on{color:#fff;font-weight:600}
  .ws-opt .ws-count{margin-left:auto;font-size:11px;color:#7A7C88}
  .fold-head{display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px;border-radius:8px;background:none;border:0;color:#C8CAD3;font-size:13.5px;text-align:left;cursor:pointer}
  .fold-head:hover{background:var(--sidebar-2);color:#fff}
  .fold-head .chev{width:11px;height:11px;flex-shrink:0;opacity:.7;transition:transform .15s}
  .fold-head.open .chev{transform:rotate(90deg)}
  .fold-head svg.fold-ic{width:16px;height:16px;flex-shrink:0;opacity:.85}
  .fold-head .ws-count{margin-left:auto;font-size:11px;color:#7A7C88}
  .fold-kids{padding-left:14px;border-left:1px solid #2E3038;margin-left:19px}
  .sidebar.rail .ws-pill-wrap{display:none}
  .sidebar.rail{width:62px}
  .sidebar.rail .brand-name,.sidebar.rail .sb-search,.sidebar.rail .side-label,.sidebar.rail .ws-head,
  .sidebar.rail .board-row-wrap,.sidebar.rail .new-board-btn,.sidebar.rail .side-foot,.sidebar.rail .board-row span{display:none}
  .sidebar.rail .brand{padding:18px 0 16px;justify-content:center}
  .sidebar.rail .side-section{padding:6px 8px}
  .sidebar.rail .nav-item{justify-content:center;padding:9px 0;font-size:0;gap:0}
  .sidebar.rail .nav-item .tg-badge{display:none}
  .sidebar.rail .sb-hdr{padding:2px 0 8px;justify-content:center}
  /* rail-fix: nothing but the nav icons survives collapse */
  .sidebar.rail{overflow:hidden}
  .sidebar.rail .board-row,.sidebar.rail .fold-head,.sidebar.rail .fold-kids,
  .sidebar.rail .ws-menu,.sidebar.rail .sb-empty,.sidebar.rail .ws-count{display:none}
  .sidebar.rail .side-section{overflow:hidden;white-space:nowrap}
  .sidebar.rail .nav-item svg{opacity:1}

  /* Topbar */
  .topbar{height:60px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 22px}
  .crumb{display:flex;align-items:center;gap:9px;min-width:0}
  .crumb-title{font-family:'Jost';font-weight:600;font-size:19px;letter-spacing:.01em;white-space:nowrap}
  .crumb-emoji{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .topbar-spacer{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;width:240px;color:var(--sub)}
  .search input{border:none;background:none;outline:none;font-size:13.5px;width:100%;color:var(--ink)}
  .icon-btn{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
  .icon-btn:hover{background:var(--bg);color:var(--ink)}
  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-shrink:0;font-size:12px}

  /* View tabs */
  .viewbar{display:flex;align-items:center;gap:4px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--border);height:46px}
  .vtab{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--sub)}
  .vtab svg{width:16px;height:16px}
  .vtab:hover{background:var(--bg);color:var(--ink)}
  .vtab.active{color:var(--ink);background:var(--gold-soft)}
  .vtab.active svg{color:var(--gold-deep)}
  .viewbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink)}
  .btn:hover{border-color:var(--faint);background:var(--surface-2)}
  /* segmented utility group */
  .toolgroup{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);box-shadow:var(--shadow)}
  .toolgroup>*{position:relative}
  .toolgroup>*+*::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:1px;background:var(--border)}
  .toolgroup .btn{border:none;border-radius:7px;background:transparent;box-shadow:none;padding:8px 13px;color:var(--sub);font-weight:500;margin:2px}
  .toolgroup .btn:hover{background:var(--bg);color:var(--ink)}
  .tg-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--gold);color:#1A1407;font-size:11px;font-weight:700;margin-left:2px}
  /* salesforce sync — the one accent action */
  .btn.sync{border-color:#bfe6f6;background:#ecf8fe;color:#0379a8}
  .btn.sync:hover:not(:disabled){background:#dff2fc;border-color:#9bd6f0}
  .btn.sync:disabled{opacity:.65}
  .sync-count{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#00A1E0;color:#fff;font-size:11px;font-weight:700;margin-left:2px}
  .btn svg{width:15px;height:15px}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#1A1407}
  .btn.primary:hover{background:#E0B654}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
  .btn.ghost:hover{background:var(--bg);color:var(--ink)}

  /* Table */
  .board-wrap{padding:22px 22px 60px}
  .cal-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .cal-title{font-family:'Jost';font-weight:600;font-size:19px;min-width:190px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .cal-dow{background:var(--surface-2);padding:8px 10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);text-align:center}
  .cal-day{background:var(--surface);min-height:118px;padding:6px 7px;display:flex;flex-direction:column;gap:4px}
  .cal-day.dim{background:var(--surface-2);opacity:.55}
  .cal-day.today .cal-num{background:var(--gold);color:#1A1407;border-radius:999px;padding:1px 7px}
  .cal-day.over{outline:2px solid var(--gold);outline-offset:-2px}
  .cal-num{font-size:12px;font-weight:600;color:var(--sub);align-self:flex-start}
  .cal-chip{font-size:11.5px;padding:3px 7px;border-radius:6px;color:#fff;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:left;width:100%}
  .cal-chip:hover{filter:brightness(1.08)}
  .cal-more{font-size:11px;color:var(--faint);padding-left:2px}
  .cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:12px;color:var(--sub)}
  .cal-legend span{display:inline-flex;align-items:center;gap:6px}
  .cal-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
  /* sticky-hdr: the table view scrolls here, so headers have something to pin to */
  .board-wrap.scroller{height:100%;overflow:auto;padding-top:0}
  .board-wrap.scroller .group{margin-bottom:24px}
  .board-wrap.scroller .group-head{position:sticky;top:0;z-index:6;background:var(--bg);padding:14px 0 8px;margin-bottom:0;height:46px;box-sizing:border-box}
  .board-wrap.scroller .tbl thead th{position:sticky;top:46px;z-index:5}
  .board-wrap.scroller .tbl thead th.name-th{z-index:7}
  .board-wrap.scroller .tbl{box-shadow:none}
  .group{margin-bottom:24px}
  .group-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .group-caret{color:var(--sub);display:flex;cursor:pointer}
  .group-title{font-family:'Jost';font-weight:600;font-size:15.5px}
  .group-count{font-size:12.5px;color:var(--faint);font-weight:500}
  .tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .tbl thead th{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--sub);text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
  .tbl td{padding:0;border-bottom:1px solid var(--border);border-right:1px solid var(--border);font-size:13.5px;overflow:hidden}
  .tbl td .cell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbl td .cell>span,.tbl td .cell>div{overflow:hidden;text-overflow:ellipsis}
  .tbl td:last-child{border-right:none}
  .tbl tr:last-child td{border-bottom:none}
  .grip{width:5px;padding:0!important}
  .cell{padding:10px 14px;min-height:42px;display:flex;align-items:center;width:100%;height:100%}
  .emo-cell{justify-content:center;font-size:19px;line-height:1;cursor:pointer;user-select:none}
  .emo-cell.empty{color:var(--faint);font-size:13px}
  .emo-pop{position:absolute;z-index:80;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:8px;width:268px}
  .emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:190px;overflow-y:auto}
  .emo-grid button{font-size:18px;line-height:1;padding:5px 0;border:0;background:none;border-radius:6px;cursor:pointer}
  .emo-grid button:hover{background:var(--surface-2)}
  .emo-clear{width:100%;margin-top:6px;padding:5px;font-size:12.5px;color:var(--sub);background:var(--surface-2);border:0;border-radius:7px;cursor:pointer}
  .emo-clear:hover{color:var(--text)}
  .cell-name{font-weight:500}
  .cell-input{width:100%;border:none;outline:none;background:none;font-size:13.5px;color:var(--ink);padding:10px 14px}
  .cell-input:focus{box-shadow:inset 0 0 0 2px var(--gold)}
  .status-cell{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12.5px;height:42px;cursor:pointer;width:100%}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .person-cell{display:flex;align-items:center;gap:-6px;padding:8px 14px;cursor:pointer}
  .date-cell{padding:10px 14px;color:var(--ink);cursor:pointer}
  .date-cell.over{color:var(--s-stuck);font-weight:600}
  .num-cell{padding:10px 14px;text-align:right;font-variant-numeric:tabular-nums}
  .timeline-bar{height:22px;border-radius:6px;background:linear-gradient(90deg,var(--s-blue),#7FB3FF);display:flex;align-items:center;padding:0 9px;color:#fff;font-size:11px;font-weight:600;margin:10px}
  .add-row{display:flex;align-items:center;gap:8px;padding:11px 14px;color:var(--sub);font-size:13.5px;font-weight:500;width:100%;border-top:1px solid var(--border)}
  .add-row:hover{color:var(--gold-deep);background:var(--surface-2)}
  .add-group{display:inline-flex;align-items:center;gap:8px;margin-top:6px;color:var(--sub);font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:8px}
  .add-group:hover{background:var(--surface);color:var(--ink)}

  /* status menu */
  .menu{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;min-width:190px}
  .menu-opt{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;font-size:13px;width:100%;text-align:left;color:#fff;font-weight:600;margin-bottom:4px}
  .menu-opt:last-child{margin-bottom:0}
  .menu-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;font-size:13.5px;width:100%;text-align:left;color:var(--ink)}
  .menu-row:hover{background:var(--bg)}

  /* status label editor */
  .status-menu{min-width:210px;max-height:none;overflow:visible}
  .label-edit{display:flex;align-items:center;gap:7px;padding:3px 4px;position:relative}
  .label-swatch{width:24px;height:24px;border-radius:6px;flex-shrink:0;border:none;cursor:pointer}
  .label-input{flex:1;min-width:0;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;font-weight:600;outline:none;color:var(--ink)}
  .label-input:focus{border-color:var(--gold)}
  .label-del{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--faint);flex-shrink:0}
  .label-del:hover{background:var(--bg);color:var(--s-stuck)}
  .palette{position:absolute;top:100%;left:0;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:268px;max-height:230px;overflow-y:auto;margin-top:4px}
  .pal-dot{width:26px;height:26px;border-radius:7px;cursor:pointer;border:2px solid transparent;display:flex;align-items:center;justify-content:center}
  .pal-dot:hover{border-color:var(--ink);transform:scale(1.08)}
  /* person filter chips */
  .person-pick{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 4px;border:1px solid var(--border-strong);border-radius:20px;font-size:12.5px;font-weight:500;color:var(--sub)}
  .person-pick:hover{border-color:var(--faint);color:var(--ink)}
  .person-pick.on{border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
  .btn.ghost.on{color:var(--gold-deep)}
  .status-menu-foot{border-top:1px solid var(--border);margin-top:6px;padding-top:6px;display:flex;flex-direction:column;gap:2px}
  .status-foot-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--sub);text-align:left}
  .status-foot-btn:hover{background:var(--bg);color:var(--ink)}

  /* Kanban */
  .kanban{display:flex;gap:16px;padding:22px;overflow-x:auto;align-items:flex-start;min-height:100%}
  .kcol{width:288px;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 200px)}
  .kcol-head{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--border);font-weight:600;font-size:13.5px}
  .kcol-count{margin-left:auto;font-size:12px;color:var(--faint);background:var(--bg);padding:2px 8px;border-radius:10px}
  .kcards{padding:11px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;flex:1}
  .kcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 13px;box-shadow:var(--shadow);cursor:grab}
  .kcard:hover{border-color:var(--border-strong)}
  .kcard.drag{opacity:.4}
  .kcard-title{font-weight:600;font-size:13.5px;margin-bottom:9px}
  .kcard-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .kcol.dragover{outline:2px dashed var(--gold);outline-offset:-3px}

  /* Home / dashboard */
  .home{padding:30px 34px 60px;max-width:1180px}
  .home-h{font-family:'Jost';font-size:27px;font-weight:600;margin-bottom:4px}
  .home-sub{color:var(--sub);font-size:14.5px;margin-bottom:26px}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:28px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:18px 19px;box-shadow:var(--shadow)}
  .stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:13px}
  .stat-num{font-family:'Jost';font-size:30px;font-weight:600;line-height:1}
  .stat-lbl{color:var(--sub);font-size:13px;margin-top:5px}
  .widget-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
  .widget{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:20px 21px;box-shadow:var(--shadow)}
  .widget-h{display:flex;align-items:center;gap:9px;font-family:'Jost';font-weight:600;font-size:15.5px;margin-bottom:16px}
  .widget-h svg{width:17px;height:17px;color:var(--gold-deep)}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:13px}
  .bar-lbl{width:104px;font-size:13px;color:var(--sub);flex-shrink:0}
  .bar-track{flex:1;height:11px;background:var(--bg);border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px}
  .bar-val{width:34px;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .board-card{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--border)}
  .board-card:last-child{border-bottom:none}
  .bc-dot{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .bc-name{font-weight:600;font-size:14px}
  .bc-meta{font-size:12.5px;color:var(--faint);margin-top:2px}
  .bc-prog{margin-left:auto;text-align:right;flex-shrink:0}
  .ring{transform:rotate(-90deg)}

  /* Templates */
  .tpl-wrap{padding:30px 34px 60px;max-width:1100px}
  .tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}
  .tpl-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .tpl-card:hover{border-color:var(--gold);box-shadow:var(--shadow-lg)}
  .tpl-top{height:96px;display:flex;align-items:center;justify-content:center}
  .tpl-body{padding:16px 18px;flex:1;display:flex;flex-direction:column}
  .tpl-name{font-family:'Jost';font-weight:600;font-size:16px;margin-bottom:5px}
  .tpl-desc{font-size:13px;color:var(--sub);line-height:1.5;flex:1}
  .tpl-tags{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--bg);color:var(--sub)}

  /* generic */
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;color:var(--sub)}
  .empty svg{width:46px;height:46px;color:var(--border-strong);margin-bottom:16px}
  .empty h3{font-family:'Jost';font-size:18px;color:var(--ink);margin-bottom:7px;font-weight:600}
  .empty p{font-size:14px;max-width:380px;line-height:1.55}
  .scaffold-note{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--gold-deep);background:var(--gold-soft);padding:5px 11px;border-radius:20px;margin-bottom:18px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(16,16,29,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal{background:var(--surface);border-radius:16px;width:480px;max-width:100%;box-shadow:var(--shadow-lg);overflow:hidden}
  .modal-h{padding:20px 22px 0;font-family:'Jost';font-weight:600;font-size:18px}
  .modal-b{padding:18px 22px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-bottom:7px}
  .field input,.field textarea{width:100%;border:1px solid var(--border-strong);border-radius:8px;padding:10px 12px;font-size:14px;outline:none}
  .field input:focus,.field textarea:focus{border-color:var(--gold)}
  .swatches{display:flex;gap:9px}
  .swatch{width:30px;height:30px;border-radius:8px;cursor:pointer;border:2px solid transparent}
  .swatch.sel{border-color:var(--ink)}
  .modal-f{padding:14px 22px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--border)}

  /* connectors */
  .conn-wrap{padding:30px 34px;max-width:760px}
  .conn{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
  .conn-logo{width:48px;height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;color:#fff;font-family:'Jost'}
  .conn-info h4{font-family:'Jost';font-size:15.5px;font-weight:600}
  .conn-info p{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.5}
  .conn-status{margin-left:auto;flex-shrink:0}
  .badge{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px}
  .badge.pending{background:var(--gold-soft);color:var(--gold-deep)}

  /* item name + updates affordance */
  .name-cell{display:flex;align-items:center;gap:4px;padding-right:8px}
  .update-btn{display:inline-flex;align-items:center;gap:3px;color:var(--faint);padding:5px;border-radius:7px;position:relative;opacity:0}
  tr:hover .update-btn{opacity:1}
  .update-btn.has{opacity:1;color:var(--gold-deep)}
  .update-btn:hover{background:var(--bg);color:var(--ink)}
  .update-badge{font-size:10px;font-weight:700;background:var(--gold);color:#1A1407;border-radius:9px;padding:0 5px;min-width:16px;text-align:center}

  /* read-only mode (recruiter view) */
  .readonly .cell-input{pointer-events:none}
  .readonly .status-cell,.readonly .person-cell,.readonly .date-cell{pointer-events:none}
  .readonly .add-row,.readonly .add-group{display:none}

  /* role switcher */
  .role-switch{padding:4px 8px 12px}
  .role-switch-lbl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6E6E7C;display:block;margin-bottom:7px}
  .role-pills{display:flex;gap:5px;background:var(--sidebar-2);padding:4px;border-radius:9px}
  .role-pill{flex:1;font-size:11.5px;font-weight:600;color:#9A9CA8;padding:6px 4px;border-radius:6px}
  .role-pill:hover{color:#fff}
  .role-pill.on{background:var(--gold);color:#1A1407}

  /* updates drawer */
  .drawer-overlay{position:fixed;inset:0;background:rgba(16,16,29,.35);z-index:90}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--surface);box-shadow:var(--shadow-lg);z-index:91;display:flex;flex-direction:column;animation:slidein .18s ease}
  @keyframes slidein{from{transform:translateX(30px);opacity:.5}to{transform:translateX(0);opacity:1}}
  .drawer-head{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--border)}
  .drawer-compose{padding:16px 22px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .drawer-compose textarea{width:100%;border:1px solid var(--border-strong);border-radius:9px;padding:11px 13px;font-size:14px;outline:none;resize:vertical;font-family:inherit}
  .drawer-compose textarea:focus{border-color:var(--gold)}
  .drawer-feed{flex:1;overflow-y:auto;padding:8px 22px 22px}
  .update{display:flex;gap:11px;padding:15px 0;border-bottom:1px solid var(--border)}
  .update:last-child{border-bottom:none}

  /* activity log */
  .act-drawer{width:460px}
  .drawer-title{font-family:'Jost';font-weight:600;font-size:17px}
  .act-tools{padding:12px 22px;border-bottom:1px solid var(--border)}
  .act-list{flex:1;overflow-y:auto;padding:6px 14px 22px}
  .act-row{display:flex;gap:11px;align-items:flex-start;padding:12px 8px;border-bottom:1px solid var(--border)}
  .act-row:hover{background:var(--surface-2);border-radius:10px}
  .act-body{flex:1;min-width:0}
  .act-line{font-size:13.5px;line-height:1.5;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
  .act-who{font-weight:600}
  .act-act{color:var(--sub);display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
  .act-chip{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:12px;font-weight:600;color:var(--ink)}
  .act-meta{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:11.5px;color:var(--faint)}
  .act-item{font-weight:600;color:var(--sub)}
  .act-undo{align-self:center;font-size:12.5px;font-weight:600;color:var(--gold-deep);padding:5px 11px;border:1px solid var(--border);border-radius:7px;flex-shrink:0}
  .act-undo:hover{background:var(--gold-soft);border-color:var(--gold)}
  .avatar-btn{border-radius:50%;display:inline-flex}
  .avatar-btn:hover{box-shadow:0 0 0 3px var(--gold-soft)}

  /* privacy controls */
  .vis-opt{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border:1px solid var(--border-strong);border-radius:9px;font-size:13.5px;font-weight:600;color:var(--sub)}
  .vis-opt:hover{border-color:var(--faint)}
  .vis-opt.on{border-color:var(--gold);color:var(--gold-deep);background:var(--gold-soft)}
  .member-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border:1px solid var(--border-strong);border-radius:20px;font-size:12.5px;font-weight:500;color:var(--sub)}
  .member-chip.on{border-color:var(--gold);color:var(--ink);background:var(--gold-soft)}

  /* automations */
  .auto-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border)}
  .auto-ico{width:34px;height:34px;border-radius:9px;background:var(--gold-soft);color:var(--gold-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .toggle{width:40px;height:23px;border-radius:13px;background:var(--border-strong);padding:2px;flex-shrink:0;display:flex}
  .toggle span{width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .15s}
  .toggle.on{background:var(--s-done)}
  .toggle.on span{transform:translateX(17px)}
  .composer{border:1px solid var(--gold);border-radius:12px;padding:16px;margin-top:8px;background:var(--gold-soft)}
  .composer-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .composer-when{font-size:13.5px;font-weight:600;color:var(--sub)}
  .composer select{border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;font-weight:600;color:var(--ink);outline:none}
  .composer select:focus{border-color:var(--gold-deep)}
  .tpl-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 13px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;font-size:13.5px;font-weight:500}
  .tpl-row:hover{border-color:var(--gold);background:var(--surface-2)}
  .bell-badge{position:absolute;top:3px;right:3px;background:var(--s-stuck);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}

  /* user management */
  .um{padding:28px 32px 60px}
  .um-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
  .um-tools{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .um-tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .um-tbl thead th{font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--sub);text-align:left;padding:13px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
  .um-tbl td{padding:11px 16px;border-bottom:1px solid var(--border);font-size:13.5px;white-space:nowrap}
  .um-tbl tr:last-child td{border-bottom:none}
  .um-tbl tbody tr:hover{background:var(--surface-2)}
  .role-select{border:1px solid var(--border-strong);border-radius:7px;padding:6px 9px;font-size:13px;font-weight:600;background:#fff;outline:none;cursor:pointer}
  .role-select:focus{border-color:var(--gold)}
  .um-status{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--sub)}
  .um-dot{width:8px;height:8px;border-radius:50%;background:var(--s-done)}

  /* login */
  .login{height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#23232E,#16161D)}
  .login-card{width:400px;max-width:92vw;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);padding:34px 32px}
  .login-brand{display:flex;align-items:center;gap:11px;justify-content:center;margin-bottom:24px}
  .login-h{font-family:'Jost';font-size:22px;font-weight:600;text-align:center}
  .login-sub{color:var(--sub);font-size:14px;text-align:center;margin:5px 0 22px}
  .login-err{background:#FCEBEC;color:var(--s-stuck);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:12px}
  .login-switch{text-align:center;font-size:13px;color:var(--sub);margin-top:18px}
  .login-switch button{color:var(--gold-deep);font-weight:600}

  /* column header controls */
  .col-head{display:flex;align-items:center;gap:7px}
  .col-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .col-glyph{display:inline-flex;align-items:center;justify-content:center;border-radius:7px;flex-shrink:0}
  .col-kebab{opacity:.32;color:var(--sub);display:inline-flex;padding:3px;border-radius:5px;flex-shrink:0;transition:opacity .12s}
  th:hover .col-kebab{opacity:.7}
  .col-kebab:hover{opacity:1;background:var(--bg);color:var(--ink)}
  /* drag & drop reordering */
  th[draggable=true]{cursor:grab}
  th[draggable=true]:active{cursor:grabbing}
  .col-drag{opacity:0;color:var(--faint);display:inline-flex;cursor:grab;flex-shrink:0;margin-right:-3px}
  th:hover .col-drag{opacity:.6}
  .col-drop{box-shadow:inset 3px 0 0 var(--gold)}
  .row-grip{opacity:0;color:var(--faint);display:inline-flex;align-items:center;cursor:grab;padding:0 2px;flex-shrink:0;transition:opacity .12s}
  tr:hover .row-grip{opacity:.65}
  .row-grip:hover{opacity:1;color:var(--ink)}
  .row-grip:active{cursor:grabbing}
  .row-drop td{box-shadow:inset 0 2px 0 var(--gold)}

  /* dashboard */
  .dash{padding:24px 28px 60px}
  .dash-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
  .dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  @media(max-width:1100px){.dash-grid{grid-template-columns:1fr}}
  .widget{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px}
  .widget-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .widget-head-left{display:flex;align-items:center;gap:7px;min-width:0}
  .widget-grip{opacity:0;color:var(--faint);display:inline-flex;cursor:grab;flex-shrink:0;transition:opacity .12s}
  .widget:hover .widget-grip{opacity:.55}
  .widget-grip:hover{opacity:1;color:var(--ink)}
  .widget-grip:active{cursor:grabbing}
  .widget-drop{outline:2px dashed var(--gold);outline-offset:3px}
  .widget-title{font-family:'Jost';font-weight:600;font-size:15px}
  .chart-row{display:flex;align-items:center;gap:18px}
  .donut-svg{width:170px;height:170px;flex-shrink:0}
  .donut-total{font-family:'Jost';font-weight:600;font-size:26px;fill:var(--ink)}
  .donut-sub{font-size:11px;fill:var(--faint)}
  .chart-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;max-height:180px;overflow-y:auto}
  .chart-legend.row{flex-direction:row;flex-wrap:wrap;gap:14px;margin-top:12px;max-height:none}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub)}
  .legend-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
  .legend-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .legend-val{font-weight:700;color:var(--ink)}
  .chart-bar{padding-top:6px}
  .bar-area{position:relative;height:220px;margin-left:26px;border-bottom:1px solid var(--border-strong)}
  .grid-line{position:absolute;left:0;right:0;height:1px;background:var(--border)}
  .grid-line span{position:absolute;left:-26px;top:-7px;font-size:10.5px;color:var(--faint);width:22px;text-align:right}
  .benchmark{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--s-working);z-index:2}
  .benchmark span{position:absolute;left:0;top:-15px;font-size:10.5px;font-weight:600;color:var(--s-working)}
  .bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:10px;padding:0 6px}
  .bar-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
  .bar-val{font-size:11.5px;font-weight:700;color:var(--ink);margin-bottom:3px}
  .bar{width:100%;max-width:54px;border-radius:6px 6px 0 0;min-height:2px;transition:height .3s}
  .bar.stacked{display:flex;flex-direction:column-reverse;overflow:hidden}
  .seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;min-height:0}
  .bar-labels{display:flex;gap:10px;margin-left:26px;padding:7px 6px 0}
  .bar-label{flex:1;text-align:center;font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  /* widget picker */
  .wpick-row{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:11px 12px;border-radius:10px}
  .wpick-row:hover:not(:disabled){background:var(--bg)}
  .wpick-row:disabled{opacity:.5;cursor:default}
  .wpick-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .wpick-title{display:block;font-size:14px;font-weight:600;color:var(--ink)}
  .wpick-desc{display:block;font-size:12.5px;color:var(--sub);margin-top:1px;line-height:1.35}
  .widget-filt{font-size:12px;font-weight:500;color:var(--gold-deep)}
  /* KPI tile */
  .kpi{padding:18px 4px 8px;text-align:center}
  .kpi-num{font-family:'Jost';font-weight:600;font-size:54px;line-height:1;color:var(--ink);letter-spacing:-.02em}
  .kpi-cap{font-size:13px;color:var(--sub);margin-top:10px}
  /* battery */
  .battery-top{display:flex;align-items:baseline;gap:9px;margin-bottom:12px}
  .battery-pct{font-family:'Jost';font-weight:600;font-size:34px;line-height:1;color:var(--ink)}
  .battery-sub{font-size:13px;color:var(--sub)}
  .battery{display:flex;height:30px;border-radius:8px;overflow:hidden;background:var(--bg)}
  .batt-seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;min-width:0}
  .col-add{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;color:var(--sub)}
  .col-add:hover{background:var(--bg);color:var(--gold-deep)}
  .colpick-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}

    .tpl-grid{grid-template-columns:1fr}
  }

  .menu-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;font-size:13.5px;width:100%;text-align:left;color:var(--ink);font-weight:500}
  .menu-item:hover{background:var(--bg)}
  .menu-item.danger{color:#C0392B}
  .menu-item.danger:hover{background:#FCEBE9}
  .menu-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:6px 11px 4px}
  .sel-box{width:17px;height:17px;border-radius:5px;border:1.6px solid var(--border);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;color:#fff;background:var(--surface);transition:.12s}
  .sel-box:hover{border-color:var(--gold)}
  .sel-box.on{background:var(--gold);border-color:var(--gold);color:#1A1407}
  .sel-box.part{background:var(--gold-soft);border-color:var(--gold)}
  .sel-dash{width:9px;height:2.4px;border-radius:2px;background:var(--gold-deep)}
  .row-sel-box{opacity:0;transition:opacity .12s}
  tr:hover .row-sel-box,.row-sel-box.on{opacity:1}
  .row-sel td{background:var(--gold-soft)!important}
  .bulkbar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;display:flex;align-items:center;gap:2px;background:var(--ink,#16161D);color:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 10px 34px rgba(0,0,0,.30)}
  .bulk-count{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;border-radius:7px;background:var(--gold);color:#1A1407;font-weight:800;font-size:13.5px}
  .bulk-lbl{font-size:13px;color:#C9CAD2;margin:0 10px 0 8px}
  .bulk-actions{display:flex;align-items:center;gap:2px}
  .bulk-act{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 13px;border-radius:8px;color:#E7E8EE;font-size:11px;font-weight:600;min-width:64px}

  .bulk-act.danger:hover{background:rgba(192,57,43,.28);color:#fff}
  .bulk-x{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#9A9CA8;margin-left:6px}
  .bulk-x:hover{background:rgba(255,255,255,.10);color:#fff}
  .trash-tabs{display:flex;align-items:center;gap:6px;padding:12px 22px 0;border-bottom:1px solid var(--border)}
  .trash-tab{display:inline-flex;align-items:center;gap:6px;padding:8px 4px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--sub);font-size:13.5px;font-weight:600}

  .btn.ghost.danger{color:#C0392B}
  .btn.ghost.danger:hover{background:#FCEBE9;color:#C0392B}

const optOf = (col, idx) => col && col.options && idx != null ? col.options[idx] : null;
const isDoneLabel = s => /\b(done|approved|placed|clear to start|complete|synced)\b/i.test(s || '');

const canSeeBoard = (b, meId, role, meEmail) => { if (b.visibility !== 'private' || role === 'admin') return true; const em = (meEmail || '').toLowerCase(); const own = String(b.owner || '').toLowerCase(); if (b.owner === meId || (em && own === em)) return true; return (b.members || []).some(m => m === meId || String(m).toLowerCase() === em); };

/* ---------------- Activity log ---------------- */
const relTime = ms => {
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return (s || 1) + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h';
  return Math.floor(h / 24) + 'd';
};
const valLabel = (board, key, val) => {
  const c = (board.columns || []).find(x => x.key === key);
  if (key === 'owner' || c && c.type === 'person') return (userById(val) || {}).name || '—';
  if (!c) return val == null ? '—' : String(val);
  if (c.type === 'status') return (optOf(c, val) || {}).label || '—';
  if (c.type === 'sf') return val === 1 ? 'Synced' : val === 0 ? 'Pending' : '—';
  if (c.type === 'priority') return (PRIORITIES[val] || {}).label || '—';
  if (c.type === 'checkbox') return val ? 'Checked' : 'Unchecked';
  if (c.type === 'progress') return (val || 0) + '%';
  return val == null || val === '' ? '—' : String(val);
};

const TRIGGER_TYPES = [{

function statusColumns(board) {

function statusLabelOf(board, key, val) {

}
function describeAutomation(board, a) {
  const t = a.trigger,
    ac = a.action;
  const trg = t.type === 'item_created' ? 'an item is created' : `${(board.columns.find(c => c.key === t.col) || {}).label || 'status'} changes to “${t.value}”`;
  let act = '';
  if (ac.type === 'move_group') act = `move it to ${ac.group}`;else if (ac.type === 'set_status') act = `set ${(board.columns.find(c => c.key === ac.col) || {}).label} to “${ac.value}”`;else if (ac.type === 'assign') act = `assign ${(userById(ac.who) || {}).name || 'a person'}`;else if (ac.type === 'notify') act = `notify ${ac.who === 'owner' ? 'the owner' : (userById(ac.who) || {}).name || 'someone'}`;else if (ac.type === 'email') act = `email ${ac.who === 'owner' ? 'the owner' : (userById(ac.who) || {}).name || 'someone'} via Outlook`;
  return `When ${trg}, ${act}.`;
}
// mutates board (a clone); returns notifications produced
function runAutomations(board, item, changedKey) {
  const notes = [];
  (board.automations || []).forEach(a => {
    if (!a.enabled) return;
    const t = a.trigger;
    if (t.type === 'status_change') {
      if (t.col !== changedKey) return;
      if (statusLabelOf(board, t.col, item[t.col]) !== t.value) return;
    } else if (t.type === 'item_created') {
      if (changedKey !== '__created__') return;
    } else return;
    const ac = a.action;
    if (ac.type === 'move_group') {
      let cur = null;
      board.groups.forEach(g => {
        if (g.items.includes(item)) cur = g;
      });
      let tgt = board.groups.find(g => g.title === ac.group);
      if (!tgt) {
        tgt = {
          id: 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
          title: ac.group,
          color: '#00C875',
          items: []
        };
        board.groups.push(tgt);
      }
      if (cur && cur !== tgt) {
        cur.items = cur.items.filter(x => x !== item);
        tgt.items.push(item);
        logAct(board, {
          actor: {
            name: 'Automation',
            color: '#7E5BD6'
          },
          kind: 'moved',
          itemId: item.id,
          item: item.name,
          from: cur.title,
          to: tgt.title,
          fromGroupId: cur.id,
          toGroupId: tgt.id,
          auto: true
        });
      }
    } else if (ac.type === 'set_status') {
      const c = board.columns.find(x => x.key === ac.col);
      const idx = c && c.options ? c.options.findIndex(o => o.label === ac.value) : -1;
      if (idx >= 0) {
        const old = item[ac.col];
        item[ac.col] = idx;
        logAct(board, {
          actor: {
            name: 'Automation',
            color: '#7E5BD6'
          },
          kind: 'cell',
          itemId: item.id,
          item: item.name,
          col: ac.col,
          colLabel: (c || {}).label,
          from: valLabel(board, ac.col, old),
          to: ac.value,
          rawFrom: old,
          auto: true
        });
      }
    } else if (ac.type === 'assign') {
      item.owner = ac.who;
    } else if (ac.type === 'notify') {
      notes.push({
        id: 'n' + Date.now() + Math.random().toString(36).slice(2, 5),
        kind: 'notify',
        text: describeAutomation(board, a),
        item: item.name,
        board: board.name,
        at: Date.now()
      });
      logAct(board, {
        actor: {
          name: 'Automation',
          color: '#7E5BD6'
        },
        kind: 'notify',
        item: item.name,
        to: describeAutomation(board, a),
        auto: true
      });
    } else if (ac.type === 'email') {
      notes.push({
        id: 'n' + Date.now() + Math.random().toString(36).slice(2, 5),
        kind: 'email',
        text: `Outlook email queued for ${item.name}`,
        sub: 'Sends through the connection bridge at deploy',
        item: item.name,
        board: board.name,
        at: Date.now()
      });
    }
    item.updates = item.updates || [];
    item.updates.push({
      id: 'au' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4),
      author: 'Automation',
      color: '#7E5BD6',
      text: describeAutomation(board, a),
      at: new Date().toISOString()
    });
  });
  return notes;
}

<script id="sb-import-tool">
(function () {
  var W = "https://spark-hq-worker.sparkcompanies.workers.dev";
  function rowsOf(b){var n=0;(b.groups||[]).forEach(function(g){n+=(g.items||[]).length});return n;}
  function token(){
    try { var raw = JSON.parse(localStorage.spark_hq_sb_auth); return (raw.currentSession||raw).access_token; }
    catch(e){ return null; }
  }
  var btn = document.createElement("button");
  btn.id = "sbImportBtn";
  btn.textContent = "Import JSON";
  btn.style.cssText = "position:fixed;bottom:18px;right:18px;z-index:99999;background:#111;color:#FFC800;border:1px solid #FFC800;border-radius:8px;padding:10px 16px;font:600 13px/1 'Century Gothic',Jost,sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)";
  document.body.appendChild(btn);

  btn.onclick = function () {
    var tok = token();
    if (!tok) { alert("No login token found. Open/refresh the Spark HQ tab, then hard-refresh this page."); return; }
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json"; inp.multiple = true;
    inp.onchange = function () { run(Array.prototype.slice.call(inp.files), tok); };
    inp.click();
  };

  function run(files, tok) {
    var H = { "Content-Type": "application/json", Authorization: "Bearer " + tok };
    var report = [];
    btn.disabled = true;

    fetch(W + "/boards-load", { headers: H }).then(function (r) {
      if (r.status !== 200) throw new Error("boards-load returned " + r.status + " - refresh the Spark HQ tab and try again.");
      return r.json();
    }).then(function (j) {
      var existing = {};
      (j.boards || []).forEach(function (b) { existing[b.id] = true; });

      return Promise.all(files.map(function (f) {
        return f.text().then(function (t) { return { name: f.name, data: JSON.parse(t) }; });
      })).then(function (parsed) {
        // validate shapes up front, none written until all named files look right
        parsed.forEach(function (p) {
          var b = p.data;
          if (b && b.items && b.board && !b.columns) throw new Error(p.name + " is the monday ARCHIVE file - pick sparkboard-*.json files instead. Nothing imported.");
          if (!b || !b.id || !b.name || !Array.isArray(b.columns) || !Array.isArray(b.groups)) throw new Error(p.name + " is not a Spark Boards file. Nothing imported.");
        });
        parsed.sort(function (a, b) { return rowsOf(a.data) - rowsOf(b.data); });
        var dupes = parsed.filter(function (p) { return existing[p.data.id]; }).length;
        var overwrite = dupes > 0 && confirm(dupes + " of the selected boards already exist. OK = OVERWRITE them with these files. Cancel = import only new boards.");

        var chain = Promise.resolve();
        parsed.forEach(function (p, i) {
          chain = chain.then(function () {
            var b = p.data, want = rowsOf(b);
            if (existing[b.id] && !overwrite) { report.push("SKIP " + b.id + " (already exists)"); return; }
            btn.textContent = "Importing " + (i + 1) + "/" + parsed.length + "...";
            return fetch(W + "/boards-save", { method: "POST", headers: H, body: JSON.stringify({ board: b }) })
              .then(function (r) {
                if (r.status !== 200) throw new Error(b.id + ": save returned " + r.status);
                return fetch(W + "/boards-load", { headers: H });
              })
              .then(function (r) { return r.json(); })
              .then(function (j2) {
                var got = (j2.boards || []).filter(function (x) { return x.id === b.id; })[0];
                if (!got) throw new Error(b.id + ": not present after save - boards-save may not create new boards. Tell Claude.");
                var gotRows = rowsOf(got);
                if (gotRows !== want) throw new Error(b.id + ": row mismatch " + gotRows + "/" + want + " - do not edit it. Tell Claude.");
                existing[b.id] = true;
                report.push("OK   " + b.id + "  " + gotRows + "/" + want + " rows");
              });
          });
        });
        return chain;
      });
    }).then(function () {
      btn.textContent = "Import JSON";
      btn.disabled = false;
      alert("Import finished:\n\n" + report.join("\n") + "\n\nRefresh the page to see the boards.");
    }).catch(function (e) {
      btn.textContent = "Import JSON";
      btn.disabled = false;
      alert("IMPORT STOPPED:\n\n" + (report.length ? report.join("\n") + "\n\n" : "") + e.message);
    });
  }
})();
</script>
