<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin Board · Spark HQ</title>
<link rel="icon" href="icons/hq-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* PLUGIN BOARD v1 · spark-plugin-board.html · opens from the HQ sidebar in a new tab
   Same login as Spark HQ (adopts the HQ session from localStorage), same worker.
   Zero animation on purpose: this runs on a TV all day. */
:root{
  --y:#FFC800; --y-soft:#FFF3C4; --ink:#171614; --paper:#FEFAED; --paper-2:#F5F3EC;
  --card:#FFFFFF; --line:#ECE9DF; --line-2:#E7E4DA; --muted:#6F6A5E; --muted-2:#9A958A;
  --green:#176A3F; --green-soft:#DDF3E6; --red:#D23B2E; --red-soft:#FBDEDB; --red-deep:#A4231A;
  --amber:#A58000; --amber-soft:#FFEFC7; --blue:#2557A7; --blue-soft:#DCE8FB; --purple:#5B3FA3; --purple-soft:#E9E2F8;
  --sb:240px; --top:56px; --r:12px; --r-sm:8px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 Jost,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--paper-2);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.hidden{display:none !important}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--sb) 1fr;grid-template-rows:var(--top) 1fr;min-height:100vh}
.sidebar{grid-row:1/3;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 0 14px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{padding:0 22px 16px;display:flex;align-items:center;min-height:56px}
.logo img{height:46px;width:auto;display:block}
.logo .wordmark{font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1}
.logo .wordmark small{display:block;font-size:10px;letter-spacing:.28em;font-weight:500;color:var(--muted)}
.nav-h{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);padding:14px 22px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 22px;border:0;background:none;border-left:3px solid transparent;font-size:14px}
.nav-item:hover{background:var(--paper)}
.nav-item.active{background:var(--paper);border-left-color:var(--y);font-weight:600}
.nav-item .ico{width:14px;color:var(--muted-2);font-size:12px;text-align:center}
.nav-item .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--paper-2);border-radius:999px;padding:1px 8px}
.nav-item .cnt.alert{background:var(--red);color:#fff;font-weight:600}
.nav-item.sub{padding-left:48px;font-size:13px}
.nav-item.soon{color:var(--muted-2);cursor:default}
.nav-item.soon .tag{margin-left:auto;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.sb-foot{margin-top:auto;padding:14px 22px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.sb-foot .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sb-foot button{background:none;border:0;padding:0;font-size:12px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.sb-foot .build{margin-top:10px;font-size:11px;color:var(--muted-2)}

.topbar{grid-column:2;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 24px;position:sticky;top:0;z-index:5}
.topbar .qa-lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);font-weight:600;margin-right:6px}
.qa{display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px 10px;border-radius:var(--r-sm);font-weight:600;font-size:13.5px}
.qa:hover{background:var(--paper)}
.qa .sq{width:16px;height:16px;border-radius:4px;background:var(--y);display:inline-grid;place-items:center;font-size:10px;color:var(--ink)}
.qa[disabled]{color:var(--muted-2);cursor:default}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);padding:7px 12px;min-width:260px}
.search input{border:0;background:none;outline:none;width:100%;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;background:var(--card)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.pill.stale .dot{background:var(--amber)}
.pill.err .dot{background:var(--red)}

.main{grid-column:2;padding:22px 24px 40px;min-width:0}

/* ---------- page header ---------- */
.crumb{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);font-weight:600}
.titlebar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:4px 0 16px}
.titlebar h1{font-size:28px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1}
.titlebar .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.chips{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chips .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);font-weight:600;margin-right:4px}
.chip{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:6px 13px;font-weight:600;font-size:12.5px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.week{background:var(--y);border-color:var(--y);color:var(--ink)}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;min-height:118px;cursor:pointer}
.kpi:hover{border-color:var(--line-2)}
.kpi.hl{border:2px solid var(--y);box-shadow:0 0 0 3px var(--y-soft)}
.kpi .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:700}
.kpi .v{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:6px 0 2px}
.kpi .v small{font-size:16px;font-weight:500;color:var(--muted)}
.kpi .v .g{color:var(--green)} .kpi .v .r{color:var(--red)}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi .d2{font-size:12px;margin-top:6px;font-weight:600}
.kpi .d2.up{color:var(--green)} .kpi .d2.dn{color:var(--red)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--y)}
.bar i.dark{background:var(--ink)}

/* ---------- panels ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel .ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.panel .ph .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:700;width:100%}
.panel .ph h2{font-size:17px;margin:0;font-weight:700}
.panel .ph .note{color:var(--muted);font-size:12.5px}
.panel .foot{margin-top:10px;font-size:12px;color:var(--muted)}

/* jobs table */
table.jobs{width:100%;min-width:960px;border-collapse:collapse;table-layout:fixed;font-size:12.5px}
table.jobs th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.jobs td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.jobs tr.row{cursor:pointer}
table.jobs tr.row:hover td{background:var(--paper)}
table.jobs .num{text-align:center;font-variant-numeric:tabular-nums}
table.jobs .num.z{color:var(--muted-2)}
.score{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:2px 6px;font-weight:700;font-size:12px}
.score.g{background:var(--green-soft);color:var(--green)}
.score.a{background:var(--amber-soft);color:var(--amber)}
.score.r{background:var(--red-soft);color:var(--red-deep)}
.svc{display:inline-block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border-radius:4px;padding:2px 6px;background:var(--paper-2);color:var(--muted)}
.svc.li{background:var(--green-soft);color:var(--green)} .svc.st{background:var(--amber-soft);color:var(--amber)}
.svc.et{background:var(--blue-soft);color:var(--blue)} .svc.pe{background:var(--purple-soft);color:var(--purple)}
.cov{font-size:11px;font-weight:700;letter-spacing:.04em}
.cov.ok{color:var(--green)} .cov.part{color:var(--amber)} .cov.none{color:var(--red)}
.cov::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}
.cov.part::before{border-radius:0;transform:rotate(45deg);width:6px;height:6px}
.cov.none::before{background:none;border:1.5px solid currentColor;width:6px;height:6px}
.who{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;padding:2px 8px;font-weight:600;font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.who.none{background:var(--paper-2);color:var(--muted);font-style:italic;font-weight:500}
.client{font-weight:700}

/* focus board */
table.focus{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
table.focus th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-weight:600}
table.focus td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.focus select{width:100%;border:1px solid var(--line-2);border-radius:6px;padding:4px 4px;background:var(--card);font-size:11.5px;color:var(--ink);text-overflow:ellipsis}
table.focus select.set{border-color:var(--green);background:var(--green-soft)}
table.focus select.set.miss{border-color:var(--red);background:var(--red-soft);border-style:dashed}
table.focus td.psb{font-size:11px;text-align:right;white-space:nowrap;color:var(--muted)}
table.focus td.psb b{color:var(--ink);background:var(--y-soft);border-radius:4px;padding:0 5px}

/* support */
table.sup{width:100%;border-collapse:collapse;font-size:12.5px}
table.sup th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);font-weight:600}
table.sup td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.sup td.n{text-align:center;font-variant-numeric:tabular-nums}
table.sup td.gap{color:var(--red);font-weight:700;text-align:center}
table.sup td.gap.ok{color:var(--muted-2);font-weight:500}
table.sup td.money{color:var(--red);font-weight:700}
table.sup td.money.ok{color:var(--muted)}

/* states */
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:13px}
.gate{min-height:100vh;display:grid;place-items:center;background:var(--paper-2)}
.gate .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 36px;max-width:440px}
.gate h1{font-size:22px;margin:0 0 8px}
.gate p{color:var(--muted);margin:0 0 18px}
.btn{background:var(--y);border:0;border-radius:var(--r-sm);padding:10px 16px;font-weight:700}
.btn.ghost{background:var(--card);border:1px solid var(--line-2);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;max-width:80vw}

/* modal */
.modal{position:fixed;inset:0;background:rgba(23,22,20,.45);display:grid;place-items:center;z-index:40}
.modal .box{background:var(--card);border-radius:16px;padding:22px 24px;width:min(560px,92vw);max-height:86vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:18px}
.modal p{color:var(--muted);margin:0 0 14px;font-size:13px}
.modal table{width:100%;border-collapse:collapse;font-size:13px}
.modal td,.modal th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
.modal input{width:84px;border:1px solid var(--line-2);border-radius:6px;padding:5px 7px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* region dropdown (sidebar) */
.regsel{padding:4px 22px 6px}
.regsel select{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 10px;background:var(--card);font-weight:600;font-size:14px;color:var(--ink)}
.regsel select:focus{border-color:var(--y);outline:none;box-shadow:0 0 0 3px var(--y-soft)}
.regsel .meta{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.regsel .meta b{color:var(--ink)}
.regsel .meta .warn{color:var(--red);font-weight:600}
.tag-dc{display:inline-block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-radius:3px;padding:1px 4px;background:var(--blue-soft);color:var(--blue);margin-left:4px;vertical-align:1px}
.tag-src{display:inline-block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;border-radius:3px;padding:1px 4px;background:var(--paper-2);color:var(--muted);margin-left:4px;vertical-align:1px}
.modal select{border:1px solid var(--line-2);border-radius:6px;padding:5px 7px;background:var(--card);font-size:13px;min-width:160px}
.modal .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}

/* TV mode */
body.tv .sidebar,body.tv .topbar{display:none}
body.tv .shell{grid-template-columns:1fr}
body.tv .main{grid-column:1;padding:18px 22px}
body.tv .kpi .v{font-size:40px}
body.tv table.jobs{font-size:14px}
.tv-exit{position:fixed;top:10px;right:12px;z-index:30;display:none}
body.tv .tv-exit{display:block}

@media (max-width:1280px){ .kpis{grid-template-columns:repeat(4,minmax(0,1fr))} .cols{grid-template-columns:1fr} }
@media (max-width:860px){ .shell{grid-template-columns:1fr} .sidebar{display:none} .topbar,.main{grid-column:1} .search{min-width:0} }
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- v3: multi-view additions ---------- */
.view{display:none}
.view.on{display:block}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.rcard:hover{border-color:var(--y)}
.rcard h3{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;border-radius:4px;padding:2px 7px}
.badge.ok{background:var(--green-soft);color:var(--green)} .badge.close{background:var(--amber-soft);color:var(--amber)} .badge.behind{background:var(--red-soft);color:var(--red-deep)} .badge.na{background:var(--paper-2);color:var(--muted)}
.rcard .subr{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin-bottom:8px}
.stat{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:3px 0;border-bottom:1px dotted var(--line)}
.stat b{font-variant-numeric:tabular-nums}
.stat .mini{width:44%;height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 8px}
.stat .mini i{display:block;height:100%}
.stat .mini i.g{background:var(--green)} .stat .mini i.a{background:var(--y)} .stat .mini i.r{background:var(--red)}
.ob{margin-top:10px}
.ob .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:4px}
.ob table{width:100%;border-collapse:collapse;font-size:11.5px}
.ob td{padding:3px 2px;border-bottom:1px solid var(--line)}
.ob td.n{text-align:right;font-variant-numeric:tabular-nums}
.stackbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin-bottom:6px}
.stackbar i{display:block;height:100%}
table.list{width:100%;border-collapse:collapse;font-size:12.5px}
table.list th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
table.list th.on{color:var(--ink)}
table.list td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list td.n{text-align:center;font-variant-numeric:tabular-nums}
table.list tr.row{cursor:pointer} table.list tr.row:hover td{background:var(--paper)}
table.list td.dim{color:var(--muted)}
.stage{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border-radius:4px;padding:2px 6px;background:var(--paper-2);color:var(--muted)}
.stage.sub{background:var(--blue-soft);color:var(--blue)} .stage.iv{background:var(--purple-soft);color:var(--purple)} .stage.pnd{background:var(--amber-soft);color:var(--amber)} .stage.off{background:var(--green-soft);color:var(--green)} .stage.onb{background:var(--y-soft);color:var(--amber)}
.days{font-weight:700;font-variant-numeric:tabular-nums} .days.bad{color:var(--red)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.reg-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--paper-2);border-radius:4px;padding:2px 6px}
.sumbox{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px 18px;font-size:14px;line-height:1.5;margin-bottom:16px;border-left:5px solid var(--y)}
.sumbox b{color:var(--y)}
.spark{display:inline-block;vertical-align:middle;margin-left:6px}
.hbars .row{display:grid;grid-template-columns:150px 1fr 48px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0}
.hbars .bar{margin:0;height:9px}
.hbars .pct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.huddle{white-space:pre-wrap;font-size:13.5px;line-height:1.55;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;max-height:52vh;overflow:auto}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sc h4{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.sc h4 .who{font-size:12px}
.sc .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.sc .nums div{background:var(--paper);border-radius:6px;padding:6px 2px}
.sc .nums b{display:block;font-size:17px;line-height:1.1}
.sc .nums span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);font-weight:600}
.sc .foot{font-size:11.5px;color:var(--muted);margin-top:8px}
@media (max-width:1280px){ .grid4{grid-template-columns:repeat(2,minmax(0,1fr))} .grid2{grid-template-columns:1fr} }
@media (max-width:860px){ .sc .nums{grid-template-columns:repeat(2,1fr)} }
table.jobs th{cursor:pointer;user-select:none} table.jobs th.on,table.sup th.on{color:var(--ink)}
table.sup th{cursor:pointer;user-select:none}
</style>
</head>
<body>

<div id="gate" class="gate hidden">
  <div class="box">
    <h1>Sign in through Spark HQ</h1>
    <p>The Plugin Board uses your HQ login. Open Spark HQ, sign in, then come back and reload this tab.</p>
    <button class="btn" onclick="window.open('https://hq.sparktalentinc.com','_blank','noopener')">Open Spark HQ</button>
    <button class="btn ghost" onclick="location.reload()">I signed in, reload</button>
  </div>
</div>

<div id="app" class="shell hidden">
  <aside class="sidebar">
    <div class="logo">
      <img src="spark-companies-logo.png" alt="Spark Companies" onerror="this.outerHTML='<div class=wordmark>SPARK<small>COMPANIES</small></div>'">
    </div>

/* ============================================================================

const CONFIG = {

        const raw = localStorage.getItem('spark_hq_sb_auth'); if (!raw) return null;
        const v = JSON.parse(raw); const s = v && (v.currentSession || v); const rt = s && s.refresh_token; if (!rt) return null;
        const res = await fetch(CONFIG.SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {

        if (!res.ok) return null;

        const ns = Object.assign({}, s, d); if (d.expires_in) ns.expires_at = Math.floor(Date.now() / 1000) + d.expires_in;
        try { localStorage.setItem('spark_hq_sb_auth', JSON.stringify(v && v.currentSession ? Object.assign({}, v, { currentSession: ns }) : ns)); } catch (e) {}
        self.token = d.access_token; return d.access_token;
      } catch (e) { return null; } finally { setTimeout(function () { self._refreshing = null; }, 1500); }

};
const API = {
  async call(path, opts = {}) {
    const hit = t => fetch(CONFIG.WORKER_URL + path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (t || ''), ...(opts.headers || {}) } });
    let r = await hit(Auth.currentToken());

    if (!r.ok) {
      let body = ''; try { body = (await r.text()).slice(0, 200); } catch (e) {}
      if (r.status === 401) { showGate(); }
      throw new Error('API ' + r.status + ' ' + path + ' ' + body);

};

/* ============================================================================
   DATA MODEL
   ========================================================================== */
const S = {
  raw: null, jobs: [], byJob: {}, apps: [], pl: [], ytd: [], acts: [], units: [], region: '', view: 'home', svc: 'ALL', q: '',
  state: {}, targets: {}, focus: {}, regionMap: null, hcHistory: [], week: null, hl: null, admin: false, sort: {}
};
const num = v => (v == null || v === '' || isNaN(+v)) ? 0 : +v;
const day = 86400000;
function mondayOf(d) { const x = new Date(d); x.setHours(0,0,0,0); const dow = (x.getDay() + 6) % 7; x.setDate(x.getDate() - dow); return x; }
function ymd(d) { return d.toISOString().slice(0,10); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
function fmtD(d) { return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—'; }
function pDate(s) { if (!s) return null; return /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T00:00:00') : new Date(s); }

/* ---------- REGION MODEL ----------
   Eight regions. Detroit sits inside Central, Nashville inside Southeast, Data Center is national.
   A req gets ONE region, in this order:
     1. Data Center  — classification / sub-classification / title says "data center"
     2. Business Unit on the job, through the editable map (Region map, admins)
     3. Business Unit on the account, same map (flagged "via account")
     4. Southeast + a Tennessee location → Nashville
     5. none → "no region"; still counted under Select region (all)                                */
const REGIONS = {
  central:   { label: 'Central',    parent: null },
  detroit:   { label: 'Detroit',    parent: 'central' },
  northeast: { label: 'Northeast',  parent: null },
  northwest: { label: 'Northwest',  parent: null },
  southwest: { label: 'Southwest',  parent: null },
  southeast: { label: 'Southeast',  parent: null },
  nashville: { label: 'Nashville',  parent: 'southeast' },
  datacenter:{ label: 'Data Center',parent: null }
};
const TOP_REGIONS = ['central', 'northeast', 'southeast', 'northwest', 'southwest', 'datacenter'];
const DEFAULT_REGION_MAP = {
  bu: { 'Central': 'central', 'MI Metro': 'detroit', 'Northeast': 'northeast', 'Northwest': 'northwest', 'Southwest': 'southwest', 'Southeast': 'southeast' },
  dcAlsoGeo: false
};
const DC_RE = /data\s*cent(er|re)/i;
const TN_RE = /nashville|franklin|murfreesboro|smyrna|la ?vergne|lebanon|clarksville|chattanooga|knoxville|memphis|\bTN\b|tennessee/i;
function regionMap() { return S.regionMap || DEFAULT_REGION_MAP; }
function regionLabel(k) { return k ? (REGIONS[k] ? REGIONS[k].label : k) : 'All regions'; }
function regionOf(f) {
  const m = regionMap();
  const isDC = DC_RE.test([f.cls, f.sub, f.title].join(' ')) || m.bu[f.bu] === 'datacenter' || m.bu[f.acctBu] === 'datacenter';
  let geo = m.bu[f.bu] || null, via = geo ? 'job' : null;
  if (!geo && f.acctBu && m.bu[f.acctBu]) { geo = m.bu[f.acctBu]; via = 'account'; }
  if (geo && (geo === 'southeast') && TN_RE.test(f.loc || '')) { geo = 'nashville'; via = via === 'job' ? 'location' : via; }
  if (isDC) return { key: 'datacenter', geo: geo && geo !== 'datacenter' ? geo : null, via: 'datacenter' };
  return { key: geo || '', geo: geo || null, via: via || 'none' };
}
function inRegion(r, g, sel) {
  if (!sel) return true;
  if (r === sel || (REGIONS[r] && REGIONS[r].parent === sel)) return true;
  if (r === 'datacenter' && regionMap().dcAlsoGeo && g && (g === sel || (REGIONS[g] && REGIONS[g].parent === sel))) return true;
  return false;
}

/* ---------- STAGES (Asymbl: Source → Submit → Interview → Pending Feedback → Offer → Onboarding → Placement) ---------- */
const STAGE_LABEL = { src: 'Source', pre: 'Pre-screen', sub: 'Submittal', iv: 'Interview', pnd: 'Pending', off: 'Offer', onb: 'Onboarding', placed: 'Placed', other: 'Other' };
const INPROC = ['sub', 'iv', 'pnd', 'off', 'onb'];
function stageKey(name, type) {
  const s = (String(name || '') + ' ' + String(type || '')).toLowerCase();
  if (/place|hired|start/.test(s)) return 'placed';
  if (/onboard/.test(s)) return 'onb';
  if (/pending/.test(s)) return 'pnd';
  if (/offer/.test(s)) return 'off';
  if (/interview/.test(s)) return 'iv';
  if (/submit|submittal|client review|sent to client/.test(s)) return 'sub';
  if (/pre-?screen|prescreen|screen/.test(s)) return 'pre';
  if (/sourc|applied|new|lead/.test(s)) return 'src';
  return 'other';
}
const CLOSED_APP = /reject|declin|withdr|closed|not selected|dnq|do not/i;
// Fletcher's v357 stall limits: submit 5d, pending 3d, offer 3d, interview 14d, onboarding 14d
const STALL_DAYS = { sub: 5, pnd: 3, off: 3, iv: 14, onb: 14 };

function reqScore(j) {
  if (j.Req_Score__c != null && j.Req_Score__c !== '') return num(j.Req_Score__c);
  return (j.Target_Rate__c ? 30 : 0) + (j.Top_5_Skill_Sets__c ? 30 : 0) + (j.Hiring_Manager_Alignment__c ? 30 : 0) + (j.Interview_Time__c ? 10 : 0);
}
function svcClass(v) {
  const s = String(v || '').toLowerCase();
  if (/light industrial/.test(s)) return 'li';
  if (/skilled/.test(s)) return 'st';
  if (/engineer|tech|it\b/.test(s)) return 'et';
  if (/professional|exec|clerical|admin/.test(s)) return 'pe';
  return '';
}
function svcShort(v) {
  const s = String(v || '');
  if (/DFM MARSHALL/i.test(s)) return 'LI · DFM';
  if (/Clerical/i.test(s)) return 'Clerical/Prof';
  if (/High Volume/i.test(s)) return 'High Vol';
  return s.length > 16 ? s.slice(0, 15) + '…' : s;
}

/* ---------- TITLE GROUPS (Skill Market + Cross Sub) ----------
   A simplified port of v357's trade matcher: a title maps to one or more trade groups; two reqs match when they share a group. */
const TRADES = [
  ['electrician', /electric/i], ['welder', /weld/i], ['pipefitter', /pipe ?fit|plumb|steam ?fit/i], ['millwright', /millwright|rigger/i],
  ['hvac', /hvac|refrig/i], ['cnc', /\bcnc\b|lathe|mill operator|machinist|machining/i], ['tool & die', /tool ?maker|tool (and|&) die|die ?maker|mold ?maker/i],
  ['maintenance tech', /maint(enance)? tech|industrial maint|facilities tech|multi-?craft/i], ['controls', /controls? eng|plc|automation eng|electrical eng/i],
  ['robot programmer', /robot/i], ['mechanical eng', /mech(anical)? eng|mech(anical)? design/i], ['quality', /quality|inspector|\bqc\b|\bqa\b|cmm/i],
  ['assembler', /assembl/i], ['forklift', /forklift|hi-?lo|material handl/i], ['warehouse', /warehouse|shipping|receiving|picker|packer|packag|general labor|production (assoc|worker|operator)/i],
  ['machine operator', /machine op|press op|operator/i], ['fabricator', /fabricat|sheet metal/i], ['painter', /paint/i], ['driver', /driver|\bcdl\b/i],
  ['estimator', /estimat/i], ['project manager', /project manag|\bpm\b|project eng/i], ['supervisor', /supervisor|lead\b|foreman|manager/i],
  ['admin', /admin|clerk|receptionist|coordinator|office/i], ['accounting', /account(ant|ing)|payroll|bookkeep|\bap\b|\bar\b/i], ['hr', /\bhr\b|human resources|recruit/i],
  ['engineer', /engineer/i], ['technician', /technician|tech\b/i], ['data center', /data\s*cent/i]
];
function tradesOf(title) { const t = String(title || ''); const out = []; TRADES.forEach(([k, re]) => { if (re.test(t)) out.push(k); }); return out.length ? out : ['other']; }
function tradeMatch(a, b) { const A = tradesOf(a), B = tradesOf(b); if (A[0] === 'other' || B[0] === 'other') return 0; return A.filter(x => B.includes(x) && !['engineer', 'technician', 'supervisor'].includes(x)).length; }
function locState(s) { const m = /\b([A-Z]{2})\b(?!.*\b[A-Z]{2}\b)/.exec(String(s || '').toUpperCase()); return m ? m[1] : ''; }

/* ---------- BUILD ---------- */
function emptyPipe() { return { pre:0, sub:0, iv:0, pnd:0, off:0, onb:0, placed:0, src:0, other:0, inproc:0, stalled:0, preWk:0, subWk:0, ivWk:0, movedWk:0 }; }
function buildModel(raw) {
  S.raw = raw;
  const today = new Date(); today.setHours(0,0,0,0);
  S.today = today;
  S.week = mondayOf(today);
  const weekEnd = new Date(S.week.getTime() + 7 * day);
  S.weekEnd = weekEnd;

  // jobs (open)
  S.jobs = (raw.jobs || []).map(j => {
    const open = Math.max(0, num(j.bpats__Number_of_Openings__c) - num(j.bpats__Openings_Filled__c));
    const acct = j.bpats__Account__r || {};
    const reg = regionOf({ bu: j.Subdivision__c, acctBu: acct.Subdivision__c, cls: j.Job_Classification__c, sub: j.Job_Subclassification__c, title: j.bpats__Job_Title__c, loc: j.bpats__Location__c });
    const bill = num(j.bpats__Bill_Rate__c), pay = num(j.bpats__Pay_Rate__c), burden = num(j.Burden_Percent__c);
    const gp = (bill && pay) ? Math.max(0, bill - pay * (1 + burden / 100)) : null;
    return {
      id: j.Id, name: j.Name, title: j.bpats__Job_Title__c || j.Name, client: j.bpats__Account_Name__c || '(no account)',
      unit: j.Subdivision__c || 'Unassigned', acctUnit: acct.Subdivision__c || '', acctStatus: acct.Status__c || '', industry: acct.Industry || '',
      company: j.Division__c || acct.Division__c || '', loc: j.bpats__Location__c || '', state: locState(j.bpats__Location__c),
      region: reg.key, geo: reg.geo, via: reg.via,
      svc: j.Job_Classification__c || 'Unassigned', sub: j.Job_Subclassification__c || '',
      openings: num(j.bpats__Number_of_Openings__c), filled: num(j.bpats__Openings_Filled__c), open,
      recruiter: (j.Recruiter__r && j.Recruiter__r.Name) || '', am: (j.Account_Manager__r && j.Account_Manager__r.Name) || '', support: (j.User__r && j.User__r.Name) || '',
      hm: (j.bpats__Hiring_Manager__r && j.bpats__Hiring_Manager__r.Name) || '',
      score: reqScore(j), boxes: { rate: !!j.Target_Rate__c, skills: !!j.Top_5_Skill_Sets__c, hm: !!j.Hiring_Manager_Alignment__c, iv: !!j.Interview_Time__c },
      age: j.CreatedDate ? Math.floor((today - new Date(j.CreatedDate)) / day) : null,
      bill, pay, burden, gp, trades: tradesOf(j.bpats__Job_Title__c), p: emptyPipe(), cov: 'none'
    };
  });
  S.byJob = {}; S.jobs.forEach(j => S.byJob[j.id] = j);

  // applicants → per-job pipeline + flat list
  S.apps = [];
  (raw.applicants || []).forEach(a => {
    if (CLOSED_APP.test(String(a.bpats__Applicant_Status__c || ''))) return;
    const j = S.byJob[a.bpats__Job__c]; if (!j) return;
    const stName = a.Stage_name__c || (a.bpats__Stage__r && a.bpats__Stage__r.Name) || '';
    const k = stageKey(stName, a.bpats__Stage__r && a.bpats__Stage__r.bpats__Stage_Type__c);
    const csd = pDate(a.bpats__Current_Stage_Date__c) || pDate(a.LastModifiedDate);
    const inWeek = csd && csd >= S.week && csd < weekEnd;
    const dis = num(a.bpats__Days_in_Current_Stage__c);
    const stalled = INPROC.includes(k) && dis > (STALL_DAYS[k] || 14);
    const p = j.p;
    p[k] = (p[k] || 0) + 1;
    if (k === 'pre' && inWeek) p.preWk++;
    if (INPROC.includes(k)) { p.inproc++; if (inWeek) p.movedWk++; if (k === 'sub' && inWeek) p.subWk++; if (k === 'iv' && inWeek) p.ivWk++; if (stalled) p.stalled++; }
    S.apps.push({ id: a.Id, job: j, cand: a.bpats__Candidate__c || '', name: a.bpats__Applicant_Name__c || (a.bpats__Candidate__r && a.bpats__Candidate__r.Name) || 'Candidate', stage: k, stageName: stName, dis, stalled, csd, inWeek, rec: (a.bpats__Recruited_By__r && a.bpats__Recruited_By__r.Name) || j.recruiter });
  });
  S.jobs.forEach(j => { j.cov = (j.open > 0 && j.p.inproc >= j.open) ? 'ok' : (j.p.inproc > 0 ? 'part' : 'none'); });

  // placements
  S.pl = (raw.placements || []).map(pl => {
    const j = pl.bpats__ATS_Job__r || {}, a = pl.bpats__Account__r || {};
    const reg = regionOf({ bu: j.Subdivision__c, acctBu: a.Subdivision__c, cls: j.Job_Classification__c, sub: j.Job_Subclassification__c, title: j.bpats__Job_Title__c, loc: j.bpats__Location__c });
    const st = pDate(pl.bpats__Start_Date__c), tm = pDate(pl.Terminated_Date__c);
    const status = pl.Status__c || '';
    const active = status ? status === 'Active' : !!(st && st <= today && !tm);
    const reason = pl.Termination_Reason__c || '';
    const neverStarted = /never start|no.?show|did not start|didn.t start/i.test(reason) || !!(tm && st && tm <= st);
    return { id: pl.Id, region: reg.key, geo: reg.geo, client: a.Name || '', status, reason, st, tm, active, neverStarted,
      cand: (pl.bpats__ATS_Candidate__r && pl.bpats__ATS_Candidate__r.Name) || '', title: j.bpats__Job_Title__c || '', svc: j.Job_Classification__c || '',
      rec: (j.Recruiter__r && j.Recruiter__r.Name) || '', am: (j.Account_Manager__r && j.Account_Manager__r.Name) || '', jobId: pl.bpats__ATS_Job__c,
      startWk: !!(st && st >= S.week && st < weekEnd), termWk: !!(tm && tm >= S.week && tm < weekEnd),
      startNext: !!(st && st >= weekEnd && st < new Date(weekEnd.getTime() + 7 * day)),
      start90: !!(st && st >= new Date(today - 90 * day) && st <= today), term90: !!(tm && tm >= new Date(today - 90 * day)) };
  });

  // YTD jobs (open + closed this year) for Fulfillment Data and Skill Market
  S.ytd = (raw.ytdJobs || []).map(j => {
    const acct = j.bpats__Account__r || {};
    const reg = regionOf({ bu: j.Subdivision__c, acctBu: acct.Subdivision__c, cls: j.Job_Classification__c, sub: j.Job_Subclassification__c, title: j.bpats__Job_Title__c, loc: j.bpats__Location__c });
    const openings = num(j.bpats__Number_of_Openings__c), filled = num(j.bpats__Openings_Filled__c);
    const closed = /closed/i.test(j.bpats__Status__c || '');
    const reason = j.Close_Reason__c || '';
    const washLoss = closed && /wash|lost|loss|cancel|competitor|filled internally|no longer|on hold|hold/i.test(reason);
    return { id: j.Id, title: j.bpats__Job_Title__c || j.Name, client: j.bpats__Account_Name__c || '', region: reg.key, geo: reg.geo, svc: j.Job_Classification__c || 'Unassigned',
      openings, filled, closed, reason, washLoss, status: j.bpats__Status__c || '', rec: (j.Recruiter__r && j.Recruiter__r.Name) || '', am: (j.Account_Manager__r && j.Account_Manager__r.Name) || '',
      trades: tradesOf(j.bpats__Job_Title__c), created: pDate(j.CreatedDate), modified: pDate(j.LastModifiedDate) };
  });

  // activities → pre-screens. Type or Subject says pre-screen. Region: the job it was logged on, else the owner's home region (where most of their open reqs sit).
  const PRE_RE = /pre.?screen/i;
  const ownerHome = {};
  S.jobs.filter(j => j.open > 0 && j.recruiter && j.region).forEach(j => { const o = ownerHome[j.recruiter] || (ownerHome[j.recruiter] = {}); o[j.region] = (o[j.region] || 0) + 1; });
  Object.keys(ownerHome).forEach(n => { const o = ownerHome[n]; ownerHome[n] = Object.keys(o).sort((a, b) => o[b] - o[a])[0]; });
  S.actTypes = {};
  S.acts = (raw.activities || []).map(t => {
    const type = t.Type || '', subj = t.Subject || '';
    const d = pDate(t.ActivityDate) || pDate(t.StartDateTime) || pDate(t.CreatedDate);
    const owner = (t.Owner && t.Owner.Name) || '';
    const job = S.byJob[t.WhatId] || null;
    const isPre = PRE_RE.test(type) || PRE_RE.test(subj);
    const inWeek = d && d >= S.week && d < weekEnd;
    if (inWeek) { const k = (type || '(no type)') + (t._kind === 'Event' ? ' · event' : ''); S.actTypes[k] = (S.actTypes[k] || 0) + 1; }
    const region = job ? job.region : (ownerHome[owner] || '');
    return { id: t.Id, kind: t._kind, type, subj, d, owner, job, isPre, inWeek, region, geo: job ? job.geo : null, who: (t.Who && t.Who.Name) || '' };
  });
  S.acts.filter(a => a.isPre && a.inWeek).forEach(a => { if (a.job) a.job.p.preWk++; });

  const cnt = {};
  S.jobs.forEach(j => { if (j.open > 0) cnt[j.unit] = (cnt[j.unit] || 0) + 1; });
  S.units = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || a.localeCompare(b)).map(u => ({ name: u, n: cnt[u] }));
  S.noRegion = S.jobs.filter(j => j.open > 0 && !j.region).length;
}

function jobsIn(sel) { return S.jobs.filter(j => inRegion(j.region, j.geo, sel)); }
function plIn(sel) { return S.pl.filter(p => inRegion(p.region, p.geo, sel)); }
function appsIn(sel) { return S.apps.filter(a => inRegion(a.job.region, a.job.geo, sel)); }
function preIn(sel) { return S.acts.filter(a => a.isPre && a.inWeek && inRegion(a.region, a.geo, sel)); }
function ytdIn(sel) { return S.ytd.filter(j => inRegion(j.region, j.geo, sel)); }
function regionJobs() { return jobsIn(S.region); }
function regionPl() { return plIn(S.region); }
function svcFilter(list) { return S.svc === 'ALL' ? list : list.filter(j => (j.svc || (j.job && j.job.svc)) === S.svc); }
function qFilter(list, f) { if (!S.q) return list; return list.filter(x => f(x).toLowerCase().includes(S.q)); }
function visibleJobs() {
  return qFilter(svcFilter(regionJobs()).filter(j => j.open > 0), j => j.client + ' ' + j.title + ' ' + j.recruiter + ' ' + j.name)
    .sort((a, b) => b.score - a.score || b.open - a.open || (a.age || 0) - (b.age || 0));
}
// one region's numbers, used by Command Center, Region Compare, huddle
function regionStats(sel) {
  const jobs = jobsIn(sel), open = jobs.filter(j => j.open > 0), pl = plIn(sel), apps = appsIn(sel);
  const openBal = open.reduce((a, j) => a + j.open, 0);
  const covered = open.filter(j => j.cov === 'ok').length;
  const inproc = apps.filter(a => INPROC.includes(a.stage)).length;
  const stalled = apps.filter(a => a.stalled).length;
  const subWk = apps.filter(a => a.stage === 'sub' && a.inWeek).length;
  const preWk = preIn(sel).length;
  const ivWk = apps.filter(a => a.stage === 'iv' && a.inWeek).length;
  const hc = pl.filter(p => p.active).length, sw = pl.filter(p => p.startWk).length, tw = pl.filter(p => p.termWk).length;
  const s90 = pl.filter(p => p.start90).length, t90 = pl.filter(p => p.term90).length;
  const avgScore = open.length ? Math.round(open.reduce((a, j) => a + j.score, 0) / open.length) : 0;
  const low = open.filter(j => j.score < 40).length;
  const nobody = open.filter(j => !j.recruiter).length;
  const t = S.targets[sel || 'ALL'] || {};
  const hcT = num(t.hc), subT = num(t.sub), preT = num(t.pre);
  // health = ½ HC % of target + ½ activity %, ON TRACK ≥100 · CLOSE 80–99 · BEHIND <80 (v357)
  let health = null;
  if (hcT || subT || preT) { const a = hcT ? Math.min(150, hc / hcT * 100) : null; const acts = [subT ? Math.min(150, subWk / subT * 100) : null, preT ? Math.min(150, preWk / preT * 100) : null].filter(x => x != null); const b = acts.length ? acts.reduce((x, y) => x + y, 0) / acts.length : null; health = Math.round(a != null && b != null ? (a + b) / 2 : (a != null ? a : b)); }
  const outlook = hc + pl.filter(p => p.status === 'Pending Start' && p.st && p.st <= new Date(S.today.getTime() + 14 * day)).length;
  const bySvc = {}; open.forEach(j => { const s = bySvc[j.svc] || (bySvc[j.svc] = { open: 0, n: 0, score: 0 }); s.open += j.open; s.n++; s.score += j.score; });
  return { sel, jobs, open, openBal, covered, covPct: pct(covered, open.length), inproc, stalled, stallPct: pct(stalled, inproc), subWk, ivWk, preWk, hc, hcT, subT, preT, sw, tw, s90, t90, avgScore, low, nobody, health, outlook, bySvc };
}
function healthBadge(h) { if (h == null) return '<span class="badge na">no target</span>'; return h >= 100 ? '<span class="badge ok">On track</span>' : h >= 80 ? '<span class="badge close">Close</span>' : '<span class="badge behind">Behind</span>'; }

function tile(id, k, v, d, extra = '') { return `<div class="kpi ${S.hl === id ? 'hl' : ''}" data-hl="${id}"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div>${extra}</div>`; }
function bar(v, t, dark) { return t ? `<div class="bar"><i class="${dark ? 'dark' : ''}" style="width:${Math.min(100, Math.round(v / t * 100))}%"></i></div>` : ''; }
function sparkline(vals, w = 70, h = 18) {
  if (!vals || vals.length < 2) return '';
  const mn = Math.min(...vals), mx = Math.max(...vals), rng = mx - mn || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - (v - mn) / rng * (h - 2) - 1).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="currentColor" stroke-width="1.5" points="${pts}"/></svg>`;
}
function hcSeries(sel) {
  // hc_history rows: {day, hc:{bucketKey:n}} where bucketKey = [DC|]bu|acct:bu[|TN]; map each bucket through the current region map
  return (S.hcHistory || []).slice(-14).map(r => {
    let n = 0;
    Object.keys(r.hc || {}).forEach(k => {
      const dc = k.startsWith('DC|'), tn = k.endsWith('|TN'); let bu = k.replace(/^DC\|/, '').replace(/\|TN$/, '');
      const acct = bu.startsWith('acct:'); if (acct) bu = bu.slice(5);
      const reg = regionOf({ bu: acct ? '' : bu, acctBu: acct ? bu : '', cls: dc ? 'Data Center' : '', loc: tn ? 'TN' : '' });
      if (inRegion(reg.key, reg.geo, sel)) n += r.hc[k];
    });
    return n;
  });
}

function whoTag(n) { return n ? `<span class="who" title="${esc(n)}">${esc(n)}</span>` : '<span class="who none">unassigned</span>'; }
function sortId(t) { return S.view + ':' + (t || 'main'); }
function sortable(list, key, defKey, defDir, t) {
  const s = S.sort[sortId(t)] || { key: defKey, dir: defDir };
  const k = s.key, d = s.dir === 'asc' ? 1 : -1;
  return list.slice().sort((a, b) => { let x = key(a, k), y = key(b, k); if (x == null) x = typeof y === 'string' ? '' : -Infinity; if (y == null) y = typeof x === 'string' ? '' : -Infinity; return (typeof x === 'string' ? x.localeCompare(y) : (x - y)) * d; });
}
function th(label, key, cls = '', t) { const s = S.sort[sortId(t)] || {}; return `<th class="${cls} ${s.key === key ? 'on' : ''}" data-sort="${key}" data-table="${t || 'main'}" title="Sort by ${label}">${label}${s.key === key ? (s.dir === 'asc' ? ' ↑' : ' ↓') : ''}</th>`; }

        <td class="num"><b>${j.open}</b></td>${cell(j.p.sub, 'Submittal')}${cell(j.p.iv, 'Interview')}${cell(j.p.pnd, 'Pending')}${cell(j.p.off, 'Offer')}${cell(j.p.onb, 'Onboarding')}
        <td><span class="cov ${j.cov}">${covTxt}</span></td>

function focusBoard(sel, compact) {
  const key = focusKey(sel);
  const jobs = jobsIn(sel).filter(j => j.open > 0).sort((a, b) => a.client.localeCompare(b.client) || a.title.localeCompare(b.title));
  const picks = S.focus[key] || {};
  const recs = {}; jobs.forEach(j => { if (j.recruiter) recs[j.recruiter] = true; }); Object.keys(picks).forEach(r => recs[r] = true);
  const names = Object.keys(recs).sort();
  const opts = jobs.map(j => `<option value="${j.id}">${esc(j.client)} — ${esc(j.title)}</option>`).join('');
  let filled = 0;
  const body = names.map(r => {
    const mine = jobs.filter(j => j.recruiter === r);
    const pre = S.acts.filter(a => a.isPre && a.inWeek && a.owner === r).length, sub = mine.reduce((a, j) => a + j.p.subWk, 0);
    const row = picks[r] || {};
    const cells = DAYS.map(d => { const v = row[d] || ''; const j = v && S.byJob[v]; if (v) filled++; const cls = j ? ('set' + (j.p.inproc ? '' : ' miss')) : '';
      return `<td><select class="${cls}" data-key="${key}" data-rec="${esc(r)}" data-day="${d}" title="${j ? esc(j.client + ' — ' + j.title) : 'pick a req'}"><option value="">— pick —</option>${opts.replace(`value="${v}"`, `value="${v}" selected`)}</select></td>`; }).join('');
    return `<tr><td>${whoTag(r)}</td>${cells}<td class="psb" title="pre-screens logged by this recruiter this week · submittals on their reqs"><b>${pre}</b> ${sub}</td></tr>`;
  }).join('');
  return `<section class="panel">
    <div class="ph"><div class="k">Focus board · week of ${S.week.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}${sel ? ' · ' + esc(regionLabel(sel)) : ''}</div><h2>One req per person per day</h2><span class="note">${filled} of ${names.length * 5} slots picked</span></div>
    <table class="focus"><thead><tr><th style="width:26%">Recruiter</th>${DAYS.map(d => `<th>${DAY_LBL[d]}</th>`).join('')}<th style="width:70px;text-align:right">Pre·Sub</th></tr></thead>
    <tbody>${body || `<tr><td colspan="7" class="empty">No recruiters on open reqs here yet. Assign a Recruiter on the job in Salesforce and they appear.</td></tr>`}</tbody></table>
    ${compact ? '' : '<div class="foot">Picks save to Spark HQ as you change them. Green = that req has pipeline today. Dashed red = picked, but nobody is in process on it.</div>'}
  </section>`;
}
function supportPanel() {
  const jobs = svcFilter(regionJobs()).filter(j => j.open > 0);
  const hcBy = {}; regionPl().filter(p => p.active).forEach(p => { hcBy[p.client] = (hcBy[p.client] || 0) + 1; });
  const picks = S.focus[focusKey(S.region)] || {};
  const focusedBy = {}; Object.keys(picks).forEach(r => DAYS.forEach(d => { const j = S.byJob[picks[r][d]]; if (j) (focusedBy[j.client] || (focusedBy[j.client] = {}))[r] = true; }));
  const by = {}; jobs.forEach(j => { const c = by[j.client] || (by[j.client] = { open: 0, pipe: 0, gps: [], noRate: 0 }); c.open += j.open; c.pipe += j.p.inproc; if (j.gp == null) c.noRate++; else c.gps.push(j.gp); });
  const rows = Object.keys(by).map(name => { const c = by[name]; const gap = Math.max(0, c.open - c.pipe); const gp = c.gps.length ? c.gps.reduce((a, b) => a + b, 0) / c.gps.length : 0; const who = Object.keys(focusedBy[name] || {});
    return { name, open: c.open, pipe: c.pipe, gap, gp, risk: gap * gp * 40, noRate: c.noRate, who, hc: hcBy[name] || 0 }; })
    .sort((a, b) => (a.who.length - b.who.length) || (b.risk - a.risk) || (b.gap - a.gap));
  const ss = S.sort[sortId('sup')];
  const shown = (ss ? sortable(rows, (r, k) => ({ client: r.name, hc: r.hc, open: r.open, pipe: r.pipe, gap: r.gap, risk: r.risk, who: r.who.length })[k], 'risk', 'desc', 'sup') : rows).slice(0, 14);
  return `<section class="panel">
    <div class="ph"><div class="k">Where to put support</div><h2>Gap × GP/hr × 40 = weekly GP at risk</h2><span class="note">unsupported clients first · ${rows.length} clients</span></div>
    <table class="sup list"><thead><tr>${th('Client', 'client', '', 'sup')}${th('HC', 'hc', 'n', 'sup')}${th('Open', 'open', 'n', 'sup')}${th('Pipe', 'pipe', 'n', 'sup')}${th('Gap', 'gap', 'n', 'sup')}${th('GP $/wk at risk', 'risk', '', 'sup')}${th('Focused by', 'who', '', 'sup')}</tr></thead>
    <tbody>${shown.map(r => `<tr><td class="client" title="${esc(r.name)}">${esc(r.name)}</td><td class="n">${r.hc}</td><td class="n">${r.open}</td><td class="n">${r.pipe}</td><td class="gap ${r.gap ? '' : 'ok'}">${r.gap}</td>
      <td class="money ${r.gap ? '' : 'ok'}" title="${r.noRate ? r.noRate + ' req(s) without bill/pay rate' : 'avg GP/hr ' + money(r.gp)}">${r.gap ? money(r.risk) : '$0'}${r.noRate ? ' <span style="color:var(--muted-2)">*</span>' : ''}</td>
      <td>${r.who.length ? r.who.map(w => `<span class="who">${esc(w.split(' ')[0])}</span>`).join(' ') : '<span class="who none">nobody</span>'}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Nothing open here.</td></tr>'}</tbody></table>
    <div class="foot">GP/hr = bill − pay × (1 + burden) averaged over the client's open reqs. Reqs without a bill or pay rate count as $0 and are marked.</div>
  </section>`;
}

/* ---------- FULFILLMENT DATA (YTD) ---------- */
function vFulData() {
  const all = svcFilter(ytdIn(S.region));
  const openings = all.reduce((a, j) => a + j.openings, 0), filled = all.reduce((a, j) => a + j.filled, 0);
  const closed = all.filter(j => j.closed), wl = closed.filter(j => j.washLoss);
  const closedFill = closed.filter(j => j.filled > 0).length;
  const never = plIn(S.region).filter(p => p.neverStarted && p.tm && p.tm.getFullYear() === S.today.getFullYear()).length;
  const kept = all.filter(j => !j.closed && j.openings > 0 && j.filled === 0 && j.created && (S.today - j.created) / day > 60).length;
  const group = (keyf) => { const g = {}; all.forEach(j => { const k = keyf(j) || '—'; const o = g[k] || (g[k] = { openings: 0, filled: 0, n: 0, wl: 0, closed: 0 }); o.openings += j.openings; o.filled += j.filled; o.n++; if (j.closed) o.closed++; if (j.washLoss) o.wl++; }); return g; };
  const bySvc = group(j => j.svc), byReg = group(j => j.region ? regionLabel(j.region) : 'No region');
  const hbars = (g) => `<div class="hbars">${Object.keys(g).sort((a, b) => g[b].openings - g[a].openings).map(k => { const p = pct(g[k].filled, g[k].openings); const cls = p >= 60 ? 'var(--green)' : p >= 40 ? 'var(--y)' : 'var(--red)';
    return `<div class="row"><span title="${g[k].n} reqs · ${g[k].openings} openings">${esc(k)}</span><div class="bar"><i style="width:${Math.min(100, p)}%;background:${cls}"></i></div><span class="pct">${p}%</span></div>`; }).join('')}</div>`;
  const worst = Object.keys(bySvc).sort((a, b) => pct(bySvc[a].filled, bySvc[a].openings) - pct(bySvc[b].filled, bySvc[b].openings))[0];
  const best = Object.keys(bySvc).sort((a, b) => pct(bySvc[b].filled, bySvc[b].openings) - pct(bySvc[a].filled, bySvc[a].openings))[0];
  return `<div class="sumbox">EXEC SUMMARY &nbsp; ${best ? `We fill <b>${esc(best)}</b> at ${pct(bySvc[best].filled, bySvc[best].openings)}%.` : ''} ${worst && worst !== best ? `<b>${esc(worst)}</b> is the hole: ${pct(bySvc[worst].filled, bySvc[worst].openings)}% fill, ${bySvc[worst].openings - bySvc[worst].filled} openings missed.` : ''} ${closed.length ? `${pct(wl.length, closed.length)}% of closed reqs wash or lose.` : ''} ${never} placements never started. ${kept} open reqs are 60+ days old with nothing filled.</div>
  <section class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">
    ${tile('reqs', 'Reqs YTD', all.length.toLocaleString(), `${openings.toLocaleString()} openings`)}
    ${tile('fill', 'Fill rate · all reqs', pct(filled, openings) + '<small>%</small>', `closed-only ${pct(closed.filter(j => j.filled > 0).reduce((a, j) => a + j.filled, 0), closed.reduce((a, j) => a + j.openings, 0))}% · ${closedFill} of ${closed.length} closed reqs filled`)}
    ${tile('never', 'Never-starts', never, 'placements that never became HC')}
    ${tile('kept', 'Kept · should have passed', kept, `open 60+ days, nothing filled · ${pct(wl.length, closed.length)}% of closed washed or lost`)}
  </section>
  <div class="grid2">
    <section class="panel"><div class="ph"><div class="k">Fill rate by service line</div></div>${hbars(bySvc)}</section>
    <section class="panel"><div class="ph"><div class="k">Fill rate by region</div></div>${hbars(byReg)}<div class="foot">Fill = openings filled ÷ openings on every req opened this year. Wash/loss = closed with a Close Reason like wash, lost, canceled, on hold, filled internally.</div></section>
  </div>
  <section class="panel" style="margin-top:16px"><div class="ph"><div class="k">Closed this year · wash and loss reasons</div></div>
    ${(() => { const r = {}; wl.forEach(j => r[j.reason || '—'] = (r[j.reason || '—'] || 0) + 1); const ks = Object.keys(r).sort((a, b) => r[b] - r[a]); return ks.length ? `<div class="hbars">${ks.map(k => `<div class="row"><span>${esc(k)}</span><div class="bar"><i style="width:${Math.round(r[k] / wl.length * 100)}%;background:var(--red)"></i></div><span class="pct">${r[k]}</span></div>`).join('')}</div>` : '<div class="empty">No wash or loss closures this year in this view.</div>'; })()}
  </section>`;
}

  const cur = S.hl && INPROC.includes(S.hl) ? S.hl : '';

  return `<section class="panel">${stageChips(list, cur)}${candTable(shown, th('Moved', 'moved', '', 'cand'), a => `<td class="dim">${a.inWeek ? 'this week' : fmtD(a.csd)}</td>`, 'cand', 'stage', 'desc')}<div class="foot">${list.length} candidates in process · ${list.filter(a => a.inWeek).length} moved stage this week · Source never counts as in process.</div></section>`;
}
function vInts() {

/* ---------- CROSS SUB ---------- */
function vCrossSub() {
  const cands = appsIn(S.region).filter(a => INPROC.includes(a.stage));
  const opens = S.jobs.filter(j => j.open > 0 && j.p.inproc < j.open);
  const opps = [];
  cands.forEach(a => {
    opens.forEach(j => {
      if (j.id === a.job.id) return;
      const m = tradeMatch(a.job.title, j.title); if (!m) return;
      const sameState = a.job.state && j.state ? a.job.state === j.state : null;
      const sameRegion = j.region === a.job.region || (REGIONS[j.region] && REGIONS[j.region].parent === a.job.region) || (REGIONS[a.job.region] && REGIONS[a.job.region].parent === j.region);
      if (sameState === false && !sameRegion) return;
      opps.push({ a, j, m, sameState, sameRegion, score: m * 10 + (sameRegion ? 5 : 0) + (sameState ? 3 : 0) + (j.score >= 80 ? 2 : 0) + (a.stage === 'pnd' || a.stage === 'off' ? -3 : 0) });
    });
  });
  const byCand = {}; opps.forEach(o => (byCand[o.a.id] || (byCand[o.a.id] = { a: o.a, list: [] })).list.push(o));
  const groups = qFilter(Object.values(byCand), g => g.a.name + ' ' + g.a.job.client + ' ' + g.a.job.title).sort((x, y) => Math.max(...y.list.map(o => o.score)) - Math.max(...x.list.map(o => o.score)));
  return `<section class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    ${tile('c', 'Candidates with a cross-sub fit', groups.length, `of ${cands.length} in process`)}
    ${tile('o', 'Open reqs they could fill', new Set(opps.map(o => o.j.id)).size, 'reqs still short of pipeline')}
    ${tile('g', 'Gap those reqs carry', [...new Set(opps.map(o => o.j.id))].reduce((a, id) => a + Math.max(0, S.byJob[id].open - S.byJob[id].p.inproc), 0), 'open balance not yet covered')}
  </section>
  <section class="panel">${groups.slice(0, 60).map(g => `<div style="padding:10px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>${g.a.cand ? `<a href="#" data-open-cand="${g.a.cand}">${esc(g.a.name)}</a>` : esc(g.a.name)}</b> ${stageTag(g.a.stage)} <span class="dim" style="color:var(--muted)">on ${esc(g.a.job.client)} — ${esc(g.a.job.title)} · ${esc(regionLabel(g.a.job.region) || 'no region')}</span> ${whoTag(g.a.rec)}</div>
      <table class="list" style="margin-top:6px"><tbody>${g.list.sort((x, y) => y.score - x.score).slice(0, 4).map(o => `<tr class="row" data-job="${o.j.id}"><td style="width:28px">→</td><td class="client">${esc(o.j.client)}</td><td>${esc(o.j.title)}</td><td><span class="reg-tag">${esc(regionLabel(o.j.region) || 'none')}</span></td><td class="n">gap ${Math.max(0, o.j.open - o.j.p.inproc)}</td><td class="n"><span class="score ${o.j.score >= 80 ? 'g' : o.j.score >= 40 ? 'a' : 'r'}">${o.j.score}</span></td><td class="dim">${o.j.trades.filter(t => g.a.job.trades.includes(t)).join(', ')}${o.sameRegion ? ' · same region' : o.sameState ? ' · same state' : ''}</td><td>${whoTag(o.j.recruiter)}</td></tr>`).join('')}</tbody></table></div>`).join('') || '<div class="empty">No cross-sub fits right now.</div>'}
    <div class="foot">Fit = shared trade group between the candidate's current req and another open req that still needs pipeline, in the same region or state. Candidates in Pending or Offer rank lower (don't poach a near-close).</div></section>`;
}

/* ---------- SKILL MARKET ---------- */
function vSkills() {
  const jobs = svcFilter(regionJobs()).filter(j => j.open > 0), apps = appsIn(S.region).filter(a => INPROC.includes(a.stage)), ytd = svcFilter(ytdIn(S.region));
  const g = {};
  const add = (t, f) => { const o = g[t] || (g[t] = { t, reqs: 0, open: 0, pipe: 0, yOpen: 0, yFill: 0, clients: {}, gp: [] }); f(o); };
  jobs.forEach(j => j.trades.forEach(t => add(t, o => { o.reqs++; o.open += j.open; o.clients[j.client] = 1; if (j.gp != null) o.gp.push(j.gp); })));
  apps.forEach(a => a.job.trades.forEach(t => add(t, o => o.pipe++)));
  ytd.forEach(j => j.trades.forEach(t => add(t, o => { o.yOpen += j.openings; o.yFill += j.filled; })));
  let rows = Object.values(g).filter(o => o.open > 0);
  rows = sortable(rows, (o, k) => ({ trade: o.t, reqs: o.reqs, open: o.open, pipe: o.pipe, gap: o.open - o.pipe, fill: pct(o.yFill, o.yOpen), gp: o.gp.length ? o.gp.reduce((a, b) => a + b, 0) / o.gp.length : 0 })[k], 'open', 'desc');
  const hot = rows.slice().sort((a, b) => (b.open - b.pipe) - (a.open - a.pipe))[0];
  return `<section class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    ${tile('t', 'Trades in demand', rows.length, `${jobs.length} open reqs mapped to trades`)}
    ${tile('h', 'Biggest gap', hot ? esc(hot.t) : '—', hot ? `${hot.open - hot.pipe} open with no pipeline · ${pct(hot.yFill, hot.yOpen)}% YTD fill` : '')}
    ${tile('u', 'Unmapped titles', jobs.filter(j => j.trades[0] === 'other').length, 'titles no trade group recognizes yet')}
  </section>
  <section class="panel"><div style="overflow-x:auto"><table class="list" style="min-width:760px"><thead><tr>${th('Trade', 'trade')}${th('Reqs', 'reqs', 'n')}${th('Open', 'open', 'n')}${th('In process', 'pipe', 'n')}${th('Gap', 'gap', 'n')}${th('YTD fill', 'fill', 'n')}${th('Avg GP/hr', 'gp', 'n')}<th>Clients</th></tr></thead>
    <tbody>${rows.map(o => { const f = pct(o.yFill, o.yOpen); const gp = o.gp.length ? o.gp.reduce((a, b) => a + b, 0) / o.gp.length : 0; return `<tr><td><b>${esc(o.t)}</b></td><td class="n">${o.reqs}</td><td class="n">${o.open}</td><td class="n">${o.pipe}</td><td class="n" style="color:${o.open - o.pipe > 0 ? 'var(--red)' : 'var(--green)'};font-weight:700">${o.open - o.pipe}</td><td class="n"><span class="score ${f >= 60 ? 'g' : f >= 40 ? 'a' : 'r'}">${o.yOpen ? f + '%' : '—'}</span></td><td class="n">${gp ? money(gp) : '—'}</td><td class="dim">${Object.keys(o.clients).slice(0, 4).map(esc).join(', ')}${Object.keys(o.clients).length > 4 ? ` +${Object.keys(o.clients).length - 4}` : ''}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="foot">A req can sit in more than one trade (e.g. "Controls Technician" is controls and technician). YTD fill uses every req opened this year in the same trade.</div></section>`;
}

/* ---------- SCORECARDS ---------- */
function vScorecards() {
  const jobs = regionJobs(), apps = appsIn(S.region), pl = regionPl(), ytd = ytdIn(S.region);
  const build = (key, label) => {
    const p = {};
    const get = n => p[n] || (p[n] = { n, open: 0, bal: 0, cov: 0, inproc: 0, stalled: 0, pre: 0, sub: 0, iv: 0, starts: 0, terms: 0, hc: 0, score: 0, yFill: 0, yOpen: 0 });
    if (key === 'recruiter') S.acts.filter(a => a.isPre && a.inWeek && a.owner && inRegion(a.region, a.geo, S.region)).forEach(a => get(a.owner).pre++);
    jobs.filter(j => j.open > 0 && j[key]).forEach(j => { const o = get(j[key]); o.open++; o.bal += j.open; if (j.cov === 'ok') o.cov++; o.score += j.score; });
    apps.forEach(a => { const n = key === 'recruiter' ? a.rec : a.job.am; if (!n) return; const o = get(n); if (INPROC.includes(a.stage)) o.inproc++; if (a.stalled) o.stalled++; if (a.stage === 'sub' && a.inWeek) o.sub++; if (a.stage === 'iv' && a.inWeek) o.iv++; });
    pl.forEach(x => { const n = key === 'recruiter' ? x.rec : x.am; if (!n) return; const o = get(n); if (x.startWk) o.starts++; if (x.termWk) o.terms++; if (x.active) o.hc++; });
    ytd.forEach(j => { const n = key === 'recruiter' ? j.rec : j.am; if (!n) return; const o = get(n); o.yOpen += j.openings; o.yFill += j.filled; });
    const list = Object.values(p).sort((a, b) => (b.pre + b.sub + b.iv + b.starts * 2) - (a.pre + a.sub + a.iv + a.starts * 2) || b.open - a.open);
    return `<h2 style="font-size:15px;margin:14px 0 8px">${label}</h2><div class="sc-grid">${list.map(o => `<div class="sc"><h4>${whoTag(o.n)}<span class="dim" style="color:var(--muted);font-weight:500;font-size:12px">${o.open} open · ${o.bal} bal · ${pct(o.cov, o.open)}% covered</span></h4>
      <div class="nums" style="grid-template-columns:repeat(${key === 'recruiter' ? 5 : 4},1fr)">${key === 'recruiter' ? `<div><b>${o.pre}</b><span>Pre-screens</span></div>` : ''}<div><b>${o.sub}</b><span>Subs wk</span></div><div><b>${o.iv}</b><span>Interviews wk</span></div><div><b style="color:var(--green)">${o.starts}</b><span>Starts wk</span></div><div><b style="color:${o.terms ? 'var(--red)' : 'inherit'}">${o.terms}</b><span>Terms wk</span></div></div>
      <div class="foot">HC ${o.hc} · in process ${o.inproc} · <span style="color:${o.stalled ? 'var(--red)' : 'inherit'}">${o.stalled} stalled</span> · avg req score ${o.open ? Math.round(o.score / o.open) : '—'} · YTD fill ${o.yOpen ? pct(o.yFill, o.yOpen) + '%' : '—'}</div></div>`).join('') || '<div class="empty">No one to score here.</div>'}</div>`;
  };
  return `<section class="panel">${build('recruiter', 'Recruiters')}${build('am', 'Account managers')}<div class="foot">Ranked by this week's production (submittals + interviews + 2× starts). Weekly counts come from stage dates and placement dates; HC is active placements on this person's reqs. Pre-screens = activities typed Pre-Screen, credited to the activity owner.</div></section>`;
}

/* ============================================================================
   LOAD
   ========================================================================== */
function setLive(kind, txt) { const p = document.getElementById('live'); p.className = 'pill ' + (kind || ''); document.getElementById('live-txt').textContent = txt; }
function toast(msg) { let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = msg; clearTimeout(t._t); t._t = setTimeout(() => t.remove(), 6000); }
function showGate() { document.getElementById('gate').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); }

async function loadState() {
  try {
    const keys = ['targets', 'regions', 'hc_history', focusKey('')].concat(Object.keys(REGIONS).map(k => focusKey(k)));
    const r = await API.call('/pi-state-load?keys=' + encodeURIComponent(keys.join(',')));
    S.state = r.state || {};
    S.targets = (S.state.targets && S.state.targets.value) || {};
    S.hcHistory = (S.state.hc_history && Array.isArray(S.state.hc_history.value)) ? S.state.hc_history.value : [];
    Object.keys(S.state).forEach(k => { if (k.startsWith('focus:')) S.focus[k] = S.state[k].value || {}; });
    if (S.state.regions && S.state.regions.value && S.state.regions.value.bu) { S.regionMap = S.state.regions.value; buildModel(S.raw); }
  } catch (e) { /* state routes unavailable: board still works, nothing persists */ }
}
async function loadMe() {
  try { const me = await API.call('/pi-me'); S.admin = !!me.admin; document.getElementById('admin-row').style.display = S.admin ? '' : 'none'; } catch (e) {}
}
async function load(fresh) {
  setLive('stale', fresh ? 'Refreshing' : 'Loading');
  try {
    const raw = await API.call('/pi-board' + (fresh ? '?fresh=1' : ''));
    if (raw.error) throw new Error(raw.error);
    buildModel(raw);
    await loadState();
    renderAll();
    const at = new Date(raw.asOf);
    setLive('', (raw.cached ? 'Live · cached ' : 'Live · synced ') + at.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }));
    const d = raw.diag || {};
    const probs = Object.keys(d).filter(k => d[k] && d[k].error);
    if (probs.length) toast('Salesforce returned an error for ' + probs.join(', ') + '. Open Data check in the sidebar.');
  } catch (e) {
    setLive('err', 'Not connected');
    if (/404/.test(e.message)) toast('The /pi-board route is not on the HQ worker yet.');
    else toast(e.message.slice(0, 140));
  }
}

  L.push(`MORNING HUDDLE · ${S.today.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })} · week of ${fmtD(S.week)}`);
  L.push('');
  L.push(`COMPANY · HC ${c.hc.toLocaleString()}${c.hcT ? ' / ' + c.hcT.toLocaleString() : ''} · open balance ${c.openBal} on ${c.open.length} reqs · covered ${c.covPct}% · in process ${c.inproc} (${c.stalled} stalled, ${c.stallPct}%) · pre-screens ${c.preWk} · submittals ${c.subWk} · interviews ${c.ivWk} · starts ${c.sw} / terms ${c.tw}`);
  L.push('');
  TOP_REGIONS.forEach(k => {
    const s = regionStats(k); if (!s.open.length && !s.hc) return;
    const top = s.open.filter(j => j.cov !== 'ok').sort((a, b) => (b.open - b.p.inproc) - (a.open - a.p.inproc)).slice(0, 3).map(j => `${j.client} ${j.title} (${Math.max(0, j.open - j.p.inproc)} short${j.recruiter ? ', ' + j.recruiter.split(' ')[0] : ', nobody'})`);
    L.push(`${regionLabel(k).toUpperCase()}${s.health != null ? ' · ' + (s.health >= 100 ? 'ON TRACK' : s.health >= 80 ? 'CLOSE' : 'BEHIND') : ''} · HC ${s.hc}${s.hcT ? '/' + s.hcT : ''} · open ${s.openBal} · covered ${s.covPct}% · stalled ${s.stalled} · pre-screens ${s.preWk} · subs ${s.subWk} · starts ${s.sw} / terms ${s.tw}`);
    if (top.length) L.push(`  Needs pipeline: ${top.join(' · ')}`);
    if (s.nobody) L.push(`  ${s.nobody} open req${s.nobody > 1 ? 's' : ''} with no recruiter`);
    if (s.low) L.push(`  ${s.low} req${s.low > 1 ? 's' : ''} score below 40: kill or fix`);
  });
  if (S.noRegion) { L.push(''); L.push(`${S.noRegion} open reqs have no region yet (Region map).`); }
  const stalled = S.apps.filter(a => a.stalled).sort((a, b) => b.dis - a.dis).slice(0, 5);
  if (stalled.length) { L.push(''); L.push('LONGEST STALLS: ' + stalled.map(a => `${a.name} ${a.dis}d in ${STAGE_LABEL[a.stage]} at ${a.job.client}`).join(' · ')); }
  return L.join('\n');
}
function openHuddle() {
  const txt = huddleText();
  const root = modal(`<h2>Morning huddle</h2><p>Today's summary from live data, ready to paste into Teams.</p><div class="huddle">${esc(txt)}</div>
    <div class="acts"><button class="btn ghost" id="m-ok">Close</button><button class="btn" id="m-copy">Copy to clipboard</button></div>`);
  root.querySelector('#m-ok').onclick = () => root.innerHTML = '';
  root.querySelector('#m-copy').onclick = async () => { try { await navigator.clipboard.writeText(txt); toast('Huddle copied'); } catch (e) { toast('Select the text and copy manually'); } };
}

/* ---------- boot ---------- */
(function boot() {
  if (!Auth.adopt()) { showGate(); return; }
  document.getElementById('app').classList.remove('hidden');
  const email = (Auth.user && Auth.user.email) || '';
  document.getElementById('who').textContent = email.split('@')[0] || 'signed in';
  document.getElementById('who-foot').textContent = email;
  S.region = localStorage.getItem('pi_region') || '';
  const v = (location.hash || '').replace('#', ''); if (VIEWS[v]) S.view = v;
  document.getElementById('btn-refresh').onclick = () => load(true);
  document.getElementById('btn-sf').onclick = () => window.open(CONFIG.SF_BASE, '_blank', 'noopener');
  document.getElementById('btn-huddle').onclick = openHuddle;
  document.getElementById('btn-tv').onclick = () => document.body.classList.add('tv');
  document.getElementById('btn-tv-exit').onclick = () => document.body.classList.remove('tv');
  document.getElementById('btn-targets').onclick = openTargets;
  document.getElementById('btn-regions').onclick = openRegions;
  document.getElementById('btn-diag').onclick = openDiag;
  document.getElementById('region-select').onchange = e => { S.region = e.target.value; localStorage.setItem('pi_region', S.region); S.hl = null; S.svc = 'ALL'; if (S.view === 'home') S.view = 'focus'; renderAll(); };
  document.querySelectorAll('.nav-item[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (VIEWS[h] && h !== S.view) setView(h); });
  document.getElementById('q').oninput = e => { S.q = e.target.value.trim().toLowerCase(); renderAll(); };
  loadMe();
  load(false);
  setInterval(() => load(false), 15 * 60 * 1000);
})();
</script>
