<!DOCTYPE html><html><head><meta charset="utf-8"><title>Xero connection</title>
<style>body{background:#0A0A0B;color:#EDEAE3;font:15px/1.6 "Century Gothic",Trebuchet MS,sans-serif;
display:grid;place-items:center;min-height:100vh;margin:0;padding:24px}
div{max-width:560px;background:#141519;border:1px solid #ffffff14;border-radius:12px;padding:30px}
h1{font-size:20px;margin:0 0 12px}.ok{color:#2FB27C}.bad{color:#E0574A}
pre{background:#08090B;padding:10px;border-radius:6px;font-size:11.5px;overflow:auto;max-height:240px;white-space:pre-wrap}
a{color:#E8C55A}</style></head><body><div>
<h1 id="h">Finishing the Xero connection</h1><div id="b">Working...</div></div>
<script>
var h=document.getElementById("h"),b=document.getElementById("b"),BACK=" <p><a href=\"/\">Back to HQ</a></p>";
function out(t,c,m){h.textContent=t;h.className=c||"";b.innerHTML=m+BACK;}
var qs=new URLSearchParams(location.search),code=qs.get("code"),er=qs.get("error");
(async function(){
if(er)return out("Xero declined","bad","<p>"+er+" "+(qs.get("error_description")||"")+"</p><p>Nothing changed.</p>");
if(!code)return out("No authorisation code","bad","<p>Start the connection from HQ, do not open this page directly.</p>");
var tk=null;
try{var m=await import("https://esm.sh/@supabase/supabase-js@2");
var sb=m.createClient("https://rdyzvohphrmkkowdsoam.supabase.co","sb_publishable_F1SY19w16Y4Frjd3C9RSGQ_6v4DmiO5",
{auth:{persistSession:true,autoRefreshToken:true,storageKey:"spark_hq_sb_auth"}});
var s=await sb.auth.getSession();tk=s&&s.data&&s.data.session&&s.data.session.access_token;}catch(e){}
if(!tk)return out("Not signed in","bad","<p>No Spark HQ session in this browser. Sign in to HQ, then start the connection again.</p>");
try{var r=await fetch("https://spark-hq-worker.sparkcompanies.workers.dev/xero-callback-exchange",
{method:"POST",headers:{Authorization:"Bearer "+tk,"Content-Type":"application/json"},
body:JSON.stringify({code:code,state:qs.get("state")||null})});
var d=await r.json();
if(!r.ok)return out("Exchange failed","bad","<pre>"+JSON.stringify(d,null,1)+"</pre><p>Codes are single use. Start again from HQ.</p>");
out("Connected","ok","<p>Tokens stored with the reports scope.</p><pre>"+JSON.stringify(d,null,1)+"</pre>");
}catch(e){out("Exchange error","bad","<pre>"+(e&&e.message||e)+"</pre>");}
})();
</script></body></html>
