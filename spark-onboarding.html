artners (JJP)",who:"Alex Gorman"},{co:"Ignite Search",who:"Alex Gorman"},{co:"Bolt Creative Strategies",who:"Aaron Opalewski"},{co:"Flex Workforce Solutions",who:"Ryan Aymen"}],Eo=[{k:"lead",name:"Leading by example isn't just a way, it's the ONLY way",body:"Regardless of job title, every person in our organization leads by example. Cross-functional support is critical, and the best way to stay close to your business is rolling up the sleeves and diving in. You can't expect others to do something you wouldn't be willing to do."},{k:"right",name:"Do the right thing",body:"The root of our organization stems from making the right decisions with the utmost integrity and respect for the people around us \u2014 even when no one is looking. You can never go wrong doing the right thing."},{k:"adversity",name:"Conquering adversity is the recipe to success",body:`A service-based industry demands aggressive patience. Overcoming adversity is part of life, and persevering through objections defines your character. As Muhammad Ali said: "I hated every minute of training, but I said, 'Don't quit. Suffer now and live the rest of your life as a champion.'"`},{k:"humble",name:"Be humble. Crave improvement",body:"If you aren't learning, you aren't leading. Self-development should never have a cap. Every day is a chance to be a student and a teacher. Find value in people regardless of background or skill set \u2014 open your mind and you'll unlock potential you never imagined."},{k:"people",name:"We are people driven and service focused",body:"Our product may be a service, but our passion lies in the people we interact with daily. It's a non-negotiable expectation that team members go the extra mile to deliver the best result for the people we work with."},{k:"dominate",name:"Dominate the day, don't let the day dominate you",body:"Tenacity, old-school grit, and the vision to succeed can't lead you in the wrong direction. Each day gives you a choice to be great. We strive for nothing short of greatness \u2014 the best preparation for tomorrow is doing the best you can today."},{k:"value",name:"Find a way to deliver value",body:"Impacting the outcome starts with an inquisitive approach and a desire to leverage every resource necessary. Figuring it out is the nucleus of what we're all about. Our team members hunt for solutions to serve our clients."},{k:"mindset",name:"Mindset is the foundation of excellence",body:"Why have a glass half empty when it can be half full? Every day presents challenges, but those challenges are ultimately opportunities. A positive attitude is the core of achievement and the framework for a successful day."}],de=[{id:"s1",num:"01",name:"Machine Ready",tag:"Computer set-up. Password, MFA, Wi-Fi, OneDrive, Chrome, settings.",celebrate:"Your machine is locked in. Nothing between you and the work now.",steps:[{id:"s1-password",title:"Change Your Password",blocks:[{t:"p",x:"First move on day one: take control of your account."},{t:"steps",x:["Go to microsoft.com and click Sign in","Sign in with your Spark email","Click your profile photo in the right corner","Click View account","Click Change password, follow the prompt, and click Submit"]},{t:"note",x:"While you're in Microsoft 365: click your initials (top right) and create a strong password you'll actually remember \u2014 this is how you'll log in to Outlook and your computer going forward. Then press Ctrl+Alt+Delete, go to Sign-in options, click the key, and enter the new password there too."}],checks:["Password changed in Microsoft 365","Windows sign-in updated to the new password"]},{id:"s1-mfa",title:"Microsoft Authenticator",blocks:[{t:"p",x:"Multi-factor authentication is a MUST DO. It's what keeps your account yours."},{t:"steps",x:["Install Microsoft Authenticator on your mobile device","Open the Authenticator app","Select Add account (the plus symbol at the top, next to Search)","Choose Work account","Select Sign in and sign in with your company email and password \u2014 or scan the QR code if the company provided one","Once your account appears, use one-time codes to sign in to Microsoft 365"]}],checks:["Authenticator installed on my phone","Work account added and generating codes"]},{id:"s1-wifi",title:"Wi-Fi + Phone Set-Up",blocks:[{t:"p",x:"If you're in the Troy office, connect your cell phone and laptop to Wi-Fi:"},{t:"kv",x:[["Network","SparkWireless"],["Password","Spark2015"]]},{t:"p",x:"Then download the Microsoft Outlook app on your cell phone so email travels with you."}],checks:["Laptop connected to SparkWireless","Phone connected to SparkWireless","Outlook app installed on my phone"]},{id:"s1-onedrive",title:"OneDrive",blocks:[{t:"p",x:"Find the cloud icon at the bottom of your screen. If it says up to date, you're good. If there's a no-smoking sign, it is not uploading \u2014 sign in with your email and password (the cloud should be blue)."},{t:"note",x:"Always save your work under OneDrive on your computer. If your laptop ever dies, your files don't."}],checks:["OneDrive signed in, blue, and up to date","I save everything to OneDrive"]},{id:"s1-chrome",title:"Google Chrome, Not Edge",blocks:[{t:"p",x:"Use Google Chrome. Certain plug-ins we rely on only work in Chrome."},{t:"h",x:"Set default browser in Windows"},{t:"steps",x:["Go to Settings",'Search "default apps" in the search bar',"Click Default apps","Scroll to Default browser","Switch to Google Chrome"]},{t:"h",x:"Set default browser in Teams"},{t:"steps",x:["Click the three dots in the right corner of Teams","Click Settings","Click Files and Links",'Under "Always open Word, PowerPoint, and Excel files in" choose Default browser','Under "Links open preference" choose Default browser']},{t:"note",x:"Do BOTH of these."}],checks:["Chrome is my Windows default browser","Chrome is my Teams default browser"]},{id:"s1-settings",title:"Dial In Your Settings",blocks:[{t:"kv",x:[["Power & sleep",'Under "additional power settings" find "Choose what closing the lid does." Default is shut down on lid close \u2014 change it to what works for you.'],["Bluetooth","Settings, then Devices, then Add Device"],["Pin apps to taskbar","Open the app, right-click, Pin to taskbar. Suggestions: Chrome, Teams, Outlook, Files, Excel, Word, Snip"],["Multiple monitors","Settings, System, Display \u2014 Identify 1/2/3, then Apply. Brightness lives on this tab too."],["Shut down","You don't have to shut down daily, but do it every other day so updates run. Always shut down before it goes in a backpack \u2014 sleep mode gets hot. Never leave your laptop in your car."],["Notifications & actions","Pop-ups appear in the right-hand corner. Go through them all and select or unselect to your preference. Sounds \u2014 you don't need to hear them all day."],["Date & time","If wrong: Settings, Time & Language, pick the correct time zone."]]}],checks:["Lid-close behavior set","My daily apps are pinned","Notifications tuned","Date and time verified"]}]},{id:"s2",num:"02",name:"Plugged In",tag:"The stack, Teams, your signature, LinkedIn, bookmarks, Bookings.",celebrate:"You're wired into every system Spark runs on. Fully plugged in.",steps:[{id:"s2-stack",title:"The Spark Tech Stack",blocks:[{t:"h",x:"Daily upkeep"},{t:"list",x:["Microsoft 365 \u2014 Teams, Word, Excel, Copilot, Outlook","Spark Boards \u2014 onboarding + project tracker","SharePoint \u2014 important files","Salesforce / Asymbl \u2014 our ATS and CRM"]},{t:"h",x:"Email"},{t:"list",x:["Outlook","Barracuda \u2014 email phishing protection and reporting"]},{t:"h",x:"Job boards (if required)"},{t:"list",x:["LinkedIn + LinkedIn Recruiter","Indeed","ZipRecruiter","ZoomInfo Talent","Michigan Talent Bank (other states' talent banks are listed in Spark HQ)"]},{t:"h",x:"Onboarding & HR"},{t:"list",x:["Spark HQ \u2014 training, guides, and materials","Greenshades \u2014 request PTO, pay, floating holidays"]},{t:"h",x:"Download on your mobile device"},{t:"list",x:["Outlook","Teams","LinkedIn","Microsoft Authenticator","GreenEmployee","Xero Me \u2014 expense reports"]}],checks:["Mobile apps downloaded"]},{id:"s2-teams",title:"Teams Set-Up",blocks:[{t:"h",x:"Set your Spark backdrop"},{t:"steps",x:["Save the company backdrop (from the Spark All Team Photo doc) to your files","Open the Teams app","Go to Calendar","Click Meet now","Hit the camera button in the left corner","Click Effects and avatars","Click More video effects (lower right)","Click Add new","Select the Spark backdrop from your files and click Open"]},{t:"h",x:"Auto-start Teams"},{t:"steps",x:["Open Teams","Three dots on the right-hand side","Settings, General, Systems","Check Auto-start Teams"]},{t:"note",x:"Audio issues or AirPods not connecting? Three dots, Settings, Device, Audio Settings, click Speaker."},{t:"h",x:"Remove auto Teams meetings from Outlook invites"},{t:"steps",x:["Open Outlook","Settings","Calendar","Events and invitations",'Uncheck "Add online meeting"']},{t:"h",x:"Channels & chats \u2014 where the company talks"},{t:"kv",x:[["Channel: Spark Portfolio",'Click "Channels" in the upper left of Teams. This is for important weekly announcements \u2014 the onboarding tracker updated daily, the weekly charge report, and announcements from the executives and TMX team.'],["Chat: Spark Portfolio \u2014 ALL TEAM",`Click "Chats" in the upper left. Company-wide quick hits: a new post going live, a team member's birthday, reminders.`]]}],checks:["Spark backdrop set","Teams auto-starts","I know the Spark Portfolio channel and ALL TEAM chat"]},{id:"s2-signature",title:"Outlook Signature",tool:"siggen",blocks:[{t:"p",x:"Build your signature right here \u2014 fill in your details, copy, and paste it into Outlook. The full manual steps are below if you prefer the template route."}],extra:[{t:"h",x:"Manual route: template from the Spark All Team Photo doc"},{t:"steps",x:["Open Outlook","Click Settings (upper right corner)","Click Account","Click Signature","Click Add New Signature and title it","Paste the template into the blank white area","Type your information into the signature","Right-click the LinkedIn embedded photo, click Edit Link","Delete the current LinkedIn URL","On LinkedIn: click your picture (upper right), View profile, copy the URL from the search bar","Paste your LinkedIn URL into the Edit Link line and press Done","Press Save",'Select your signature title in BOTH dropdowns under "Select default signature" \u2014 for new messages AND for replies and forwards']}],checks:["Signature set in Outlook","My LinkedIn URL is linked","Default for new messages and replies"]},{id:"s2-teamsvemail",title:"Teams vs. Email",blocks:[{t:"p",x:"We've all been there \u2014 wondering whether to send an email or a Teams message. Here's the quick guide."},{t:"h",x:"Use Teams when"},{t:"list",x:["You need a quick response or real-time collaboration","It's a short question or update","You're working a project with ongoing back-and-forth","You want to share a file or link quickly"]},{t:"p",x:"Think of it like tapping someone on the shoulder."},{t:"h",x:"Use email when"},{t:"list",x:["You're sharing detailed or formal information","You need to loop in external contacts","You want to document a decision or summary","The message is not time-sensitive"]},{t:"p",x:"Think of it like sending a letter with a paper trail."},{t:"h",x:"Never miss a Teams message"},{t:"steps",x:["Open Microsoft Teams","Click your profile picture (top right), then Settings","Go to Notifications",'Under "Missed activity emails" choose how often to be notified \u2014 As soon as possible works well',"Customize alerts for @mentions, replies, and chat messages"]}],checks:["Missed activity emails turned on","I know when to use Teams vs. email"]},{id:"s2-linkedin",title:"LinkedIn Set-Up",blocks:[{t:"p",x:"Your LinkedIn gets branded to Spark \u2014 use the header photo from the Spark All Team Photo doc."},{t:"steps",x:["Log into LinkedIn","Click your profile photo, then View profile","Press the pencil/edit button on the same line as your name","Type your title and company into the Current Position section, press Save","Click the pencil/edit button in the top right of the header photo","Choose the Spark header photo and click Save","Scroll to Experience and click the pencil/edit button","Press the plus in the upper right, Add position, and enter everything including start date to present","Press Save"]}],checks:["Title and company set","Spark header photo up","Experience added, start date to present"]},{id:"s2-google",title:"Google Account + Bookmarks",blocks:[{t:"h",x:"Create a Google account"},{t:"steps",x:["Go to Google and click Sign in",'Click Create new account, then "for my personal use"',"Type your information and use your existing Spark email","Enter the code sent to your email","Create a password","Enter your phone number for a verification code","Click Create account"]},{t:"h",x:"How to save a bookmark"},{t:"steps",x:["Open the tab you want to save","Click the star in the URL bar (top right)","Click Bookmarks bar","Click Done"]},{t:"h",x:"What you need bookmarked"},{t:"kv",x:[["Greenshades","Pay stubs, time-off requests, floating holidays \u2014 anything HR-related. GreenEmployee is the mobile app."],["LinkedIn","Your Spark-branded profile."],["Indeed","Job board \u2014 log in once and bookmark it."],["ZipRecruiter","Job board \u2014 log in once and bookmark it."],["Michigan Talent Bank","The Michigan unemployment site. Everyone who applies for unemployment must create a profile here, so it's a real sourcing resource. On a high-level executive search it may not be the best tool, but you should have it."],["Microsoft 365","The web version of your email. If something happens to your computer, your email lives here. Bookmark it."],["Spark HQ","Houses all of our training guides and materials \u2014 including this one."],["SharePoint","Important company files. Log in once and bookmark it."],["Spark Boards","Onboarding and project tracking. Log in and bookmark."],["Salesforce","spark-companies.my.salesforce.com \u2014 the ATS/CRM you'll live in."],["Barracuda","Email gateway defense \u2014 where quarantined mail lands."]]}],checks:["Google account created with my Spark email","All bookmarks saved to the bookmarks bar"]},{id:"s2-bookings",title:"Bookings (Optional)",blocks:[{t:"note",x:"Optional \u2014 set this up only if your role books meetings with clients or candidates. If it doesn't apply, check it off below and move on."},{t:"h",x:"Set up Bookings"},{t:"steps",x:["Go to the Office 365 portal at office.com","Select All Apps, then click Bookings (search for it if you don't see it)","If prompted, click Get It Now","Enter the name of your business and select the type","Click Continue to create your booking calendar"]},{t:"h",x:"Business information"},{t:"kv",x:[["Name","Your name"],["Logo","Add the company logo"],["Business type","Other"],["Business hours","Monday to Friday, 8:00 AM to 5:00 PM"]]},{t:"h",x:"Customize your booking page"},{t:"steps",x:["Go to the Booking Page tab","Set time increments, minimum lead time, and maximum lead time","Enable or disable customer email notifications","Click Save and publish"]}],checks:["Bookings set up \u2014 or confirmed not needed for my role"]}]},{id:"s3",num:"03",name:"Welcome to Spark",tag:"The story, the portfolio of companies, the values, the language.",celebrate:"You know who we are and how we talk. Welcome to the family.",steps:[{id:"s3-story",title:"The Spark Story",sim:"quizstory",blocks:[{t:"h",x:"A welcome from Aaron"},{t:"video",x:"aaron-welcome.mp4"},{t:"p",x:"Founded in 2013 by Aaron Opalewski, Spark Talent Acquisition is a Michigan-headquartered recruiting and staffing organization that connects great talent with great employers. Finding a new position is stressful, and identifying top talent is hard \u2014 so we start by listening to and understanding each client's individual needs. We believe in face-to-face interaction and a solid understanding of a client's business before placement."},{t:"p",x:"We pride ourselves on team development and a culture of accountability. Our goal is never to connect candidates on skill set alone \u2014 culture, shared values, and intangibles matter just as much. And our commitment to 24-7 availability sets us apart: staffing is a full-time responsibility, and we accommodate any shift need that arises."},{t:"h",x:"Our purpose"},{t:"note",x:"Spark's purpose is to help PEOPLE grow. Our mission: create 100,000 annual opportunities across the nation. Money is the product of outstanding service \u2014 it follows, it does not lead. We operate in the recruiting industry, but we are in the people development business. Empowerment, freedom, and unlimited professional and personal growth."}],checks:["I can say our purpose out loud: help people grow \u2014 100,000 annual opportunities"]},{id:"s3-family",title:"Portfolio of Companies",sim:"quizfam",blocks:[{t:"h",x:"How our companies are structured"},{t:"list",x:["1 management company \u2014 Spark Companies (sparkcompanies.com)","1 content creation company \u2014 Bolt Creative Strategies (boltcreativestrategies.com)","5 staffing companies \u2014 Spark Talent (sparktalentinc.com), Spark Packaging (sparkpackaginginc.com), John Joseph Partners (johnjosephpartners.com), Ignite Executive Search (ignitesearch.com), Flex Workforce Solutions (flexworkforceco.com)"]},{t:"h",x:"Who to go to"},{t:"p",x:"People and reporting lines change as we grow, so there is no printed list to memorize \u2014 the live org chart in Spark HQ is the single source of truth: who leads each entity, who reports to whom, and who to talk to for what."},{t:"cta",x:"Open the live org chart in Spark HQ",tab:"people",href:"index.html"}],checks:["I opened the live org chart in Spark HQ"]},{id:"s3-who",title:"Who to Go To",sim:"quizwho",blocks:[{t:"p",x:"Roles, not names \u2014 people change seats, the roles don't. Route the situation to the right role on the first try. The live org chart tells you who holds each role today."}],checks:[]},{id:"s3-dress",title:"Dress Code",blocks:[{t:"p",x:"At Spark, we value a casual work environment \u2014 wear clothing that's comfortable and practical for your job. Attire should remain appropriate and respectful to keep a professional atmosphere."},{t:"list",x:["No clothing with words, images, or symbols that could be offensive to coworkers, clients, or visitors","Spark-logo apparel is encouraged \u2014 team spirit, unified image","Sports teams, universities, and fashion-brand logos are generally fine","Business casual is expected when meeting external clients or guests","Lounge pants, sweatpants, and basketball shorts are not workplace-appropriate","Shorts are allowed on Fridays in the summer","Hats and beanies: Fridays only \u2014 unless they carry the company logo, in which case any day works"]}],checks:["Dress code read and understood"]},{id:"s3-values",title:"The Eight Values",kind:"values",sim:"quizvals",blocks:[{t:"p",x:"These are the eight things we actually mean. Tap each card to flip it, then pick the one that will be hardest for YOU to live \u2014 that answer is worth keeping."}],checks:[]},{id:"s3-profile",title:"Your Working Style",blocks:[{t:"p",x:"Everyone at Spark works one of four ways \u2014 Builder, Adventurer, Planner, or Relator. The Worker Profile is a short two-part assessment (about 10 minutes) that maps your style so your leader can coach you the way YOU work best, not the way the last person did."},{t:"p",x:"Your results go to you and your leader by email \u2014 have your leader's name and email ready. There are no wrong answers and no scores to beat; answer with your gut."},{t:"link",href:"worker-profile.html",x:"Take the Worker Profile"},{t:"note",x:"Not sure who your leader is? The live org chart in Spark HQ has today's answer."}],checks:["I completed the Worker Profile and my results were emailed to me and my leader"]},{id:"s3-rhythm",title:"Meetings & Cadence",blocks:[{t:"h",x:"Mandatory meetings"},{t:"kv",x:[["Bi-weekly company meetings","Tuesdays at 4:00 PM \u2014 applies to everyone. Company updates, important news, and achievements."],["Sales trainings","Recruiters, ARMs, AREs, Directors"],["Recruiting trainings","Recruiters, ARMs, AREs, Directors"],["PI Board meetings","Scheduled by business unit leaders \u2014 Recruiters, ARMs, AREs, Directors"]]}],checks:["Company meetings and PI Board on my calendar"]},{id:"s3-words",title:"Words Matter",sim:"wordswap",blocks:[{t:"p",x:"Language shapes culture. Small shifts in vocabulary have a big impact on team unity, client relationships, and mindset."},{t:"kv",x:[["Team members, not employees","We're all part of a high-performance team working toward a common goal \u2014 internally and with clients."],["Positive phrasing",'Instead of "No problem," use "My pleasure" or "Absolutely." Service-focused tone, zero negative connotations.'],['Gratitude over "Happy Friday"',"Every day is a gift. Gratitude for life and health keeps us aligned with excellence \u2014 not counting down to the weekend."],["Value language in sales",`Avoid "fee," "cost," and "bill" \u2014 they imply loss. Use "invoice," "investment," and "search." "Investment in the project" frames the client's benefit.`]]},{t:"p",x:"Now prove it. Eight rounds \u2014 replace the corporate phrase with the Spark phrase."}],checks:[]}]},{id:"s4",num:"04",name:"The Recruiting Process",tag:"Staffing, sourcing, prescreens, the law \u2014 plus the live ATS Sandbox: run a full placement yourself.",celebrate:"You've run the reps. The process is yours \u2014 one standard, no shortcuts.",steps:[{id:"s4-staffing",title:"What Is Staffing?",blocks:[{t:"p",x:"Staffing is the process of strategically identifying, recruiting, and placing the right talent into roles that support an organization's goals. It means understanding workforce requirements, sourcing qualified candidates, and ensuring a strong match on skills, experience, and culture. Done well, it doesn't just fill vacancies \u2014 it builds a resilient workforce."},{t:"h",x:"The five components"},{t:"kv",x:[["1. Workforce planning","Assess current and future staffing needs; identify skill gaps and forecast hiring."],["2. Recruitment","Attract candidates through postings, referrals, and sourcing; promote the employer brand."],["3. Selection","Screen resumes, conduct interviews, evaluate \u2014 choose the best fit on skills, experience, and culture."],["4. Onboarding","Introduce new hires to the culture, tools, and processes; ensure a smooth transition."],["5. Retention & development","Keep people engaged; offer training, career growth, and performance feedback."]]},{t:"h",x:"Why it matters"},{t:"list",x:["Ensures business continuity and productivity","Builds a strong company culture","Reduces turnover costs and improves satisfaction","Meets strategic goals with the right talent in place"]},{t:"note",x:"Quick tips: use data to guide hiring decisions, weigh skills AND cultural fit, keep communication clear and timely, invest in development."}],checks:["I can explain staffing and its five components"]},{id:"s4-lifecycle",title:"The Recruiting Lifecycle",sim:"orderit",blocks:[{t:"p",x:"Every candidate moves through the same Kanban in Salesforce \u2014 it's how the whole company reads your pipeline."},{t:"kv",x:[["Req qualifications","Qualify the req with the hiring manager or account rep, get your qualifying questions answered, establish expectations, enter it in the system, manage it in real time."],["Sourcing talent","Create a sourcing strategy, set daily phone screen goals, build niche networks."],["Get to know the candidate & prescreen","Qualify with references, screen for skills and culture fit, finalize lockdown, generate leads."],["Selection","Represent the candidate, prep them to win the interview, debrief afterward and update the req."],["Onboarding","Offer accepted \u2014 send start details to TMX, prep the candidate for day one, and confirm they're set up to win."],["Ongoing communication","First-day and first-week calls, consistent performance feedback, rehire quality team members whenever possible."]]},{t:"p",x:"Now the drill: tap the Kanban stages in order."}],checks:[]},{id:"s4-reqs",title:"Job Reqs",blocks:[{t:"h",x:"Qualify the req with the Account Manager"},{t:"list",x:["Clarify expectations \u2014 skills, experience, timeline","Ask questions \u2014 why is it open? Backfill, new role, or contract extension?","Understand priorities \u2014 must-haves vs. nice-to-haves","Get your qualifying questions answered before you source"]},{t:"note",x:"Use intake meetings to align on goals and avoid miscommunication later."},{t:"h",x:"Learn & research the role and the client"},{t:"list",x:["Study the job description \u2014 responsibilities, skills, qualifications","Research the client \u2014 industry, culture, values (LinkedIn, Glassdoor, their website)","Know the team \u2014 who does the candidate report to? What's the dynamic?"]},{t:"h",x:"Hands-on: find the req (ATS Sandbox)"},{t:"steps",x:["Open the ATS Sandbox \u2014 training data only, never production","The training req is pinned at the top: PLC Programmer, Pari Robotics, Rochester Hills","Open the job details \u2014 the job details ARE the req"]}],checks:["Found the Pari Robotics req in the ATS Sandbox"]},{id:"s4-sourcing",title:"Sourcing",tool:"boolean",blocks:[{t:"p",x:"Sourcing is the art and science of identifying candidates who match the req. Master it and you'll always have a pipeline."},{t:"h",x:"Strategy"},{t:"list",x:["Proactive beats reactive \u2014 don't wait for applicants, go find them","Targeted outreach \u2014 relevant experience and location","Pipeline building \u2014 maintain a pool of qualified candidates for future roles","Some of the best people you will find will still be working. Hunt them."]},{t:"h",x:"What to look for"},{t:"list",x:["Tenure \u2014 stability and growth in previous roles","Red flags \u2014 frequent job changes, vague titles, unexplained gaps","Qualifications \u2014 match skills, certifications, and education to the req"]},{t:"h",x:"Boolean search"},{t:"note",x:'Combine keywords into a search string. Example for a Controls Engineer with PLC, HMI, SCADA experience: ("controls engineer" OR "automation engineer" OR "electrical engineer") AND ("PLC" OR "HMI" OR "SCADA")'},{t:"h",x:"Tools"},{t:"list",x:["Job boards \u2014 LinkedIn, Indeed, ZipRecruiter, ZoomInfo Talent, Michigan Talent Bank","The ATS \u2014 source from existing candidates first","Social media \u2014 Facebook, Instagram, and beyond"]},{t:"h",x:"Hands-on: source in the ATS"},{t:"steps",x:["No job to work? Go to Search and use filters to source through the system","Have an opening? Go to the job (use Pari Robotics), use Applicants & Match","Work Search and Match to find qualified candidates","Source 2 candidates for the position"]}],checks:["Sourced 2 candidates for the Pari Robotics req","I can write a boolean string for my niche"]},{id:"s4-contact",title:"Call Sheets & Outreach",blocks:[{t:"h",x:"Build a call sheet in Salesforce"},{t:"steps",x:["Go to a job","Source candidates through the system or add new ones","On a candidate profile, use the Task button (left-hand side) to schedule a call for the future","Your call sheet lives in your ATS Kanban"]},{t:"h",x:"Daily goals & organization"},{t:"list",x:["Prepare for tomorrow \u2014 build your call sheet the night before","Set phone screen goals per your assigned KPIs","Block time daily for sourcing and cold calling \u2014 consistency builds momentum"]},{t:"h",x:"Calls"},{t:"list",x:["Be prepared with a brief pitch and key questions","Respect time zones and working hours \u2014 adjust your schedule to the candidate's","Always introduce yourself clearly","Ask if it's a good time to talk","Be polite, and fluctuate your voice"]},{t:"h",x:"Voicemails"},{t:"list",x:["Keep it short and professional","Include your name, company, role, and callback info"]},{t:"h",x:"Messages & texts"},{t:"list",x:["Personalize \u2014 mention the role, the company, and why they'd be a good fit","Keep texts concise and professional","Always try calling before texting, unless it's a quick update"]},{t:"h",x:"Emails"},{t:"list",x:["Clear subject line","Include job details, next steps, and contact info"]},{t:"h",x:"Hands-on: log it all in Salesforce"},{t:"list",x:["Log tasks, calls, prescreens, notes, and calendar events","Know how to navigate to a candidate profile"]}],checks:["Call sheet built in my Kanban","I've logged a task, a call, and a note in SF"]},{id:"s4-prescreen",title:"The Prescreen",sim:"callsim",blocks:[{t:"p",x:"Prescreening determines whether a candidate meets the basic qualifications and is a real fit before anyone invests more time."},{t:"h",x:"Why prescreens matter"},{t:"list",x:["Save time by filtering out unqualified candidates early","Build rapport and assess communication skills","Clarify resume details and uncover red flags","Set expectations for the role and next steps"]},{t:"h",x:"Flow of the conversation"},{t:"steps",x:["Introduction \u2014 who you are and why you're calling","Candidate overview \u2014 let them share their background; listen","Q&A \u2014 ask targeted questions, let them ask theirs","Role & company overview \u2014 explain the position and the client","Next steps \u2014 outline exactly what happens after the call"]},{t:"h",x:"References"},{t:"list",x:["Ask if they can provide professional references","Note hesitation or lack of references as a potential concern","Confirm reference types \u2014 manager, peer, client","Log the information in Salesforce"]},{t:"h",x:"Phone etiquette"},{t:"list",x:["Warm, clear, professional tone","Respectful language and active listening","Conversational, not scripted \u2014 build rapport","Be transparent"]},{t:"note",x:'Prescreen template lives in Asymbl: go to log a call, click in the text box, press Ctrl+Period, and select Prescreen from the template list. Log a sample prescreen tagged "Training Prescreen" in Chatter for leader review.'},{t:"p",x:"Time for a rep. Jordan is a CNC machinist who just picked up your call."}],checks:[]},{id:"s4-dub",title:"Dub the Resume",sim:"dubmark",blocks:[{t:"p",x:"Before any candidate reaches a client, their resume gets dubbed \u2014 rebuilt into the Spark template so every submittal is clean, consistent, and easy to read. The facts stay the candidate's. The presentation is ours."},{t:"h",x:"How to dub"},{t:"steps",x:["Open the resume dub template in Spark HQ","Remove the candidate's personal contact details \u2014 the client's path to the candidate is YOU","Rebuild the work history into the template \u2014 clean dates, titles, companies, tight bullets","Tailor the top \u2014 surface the experience that matches the req's must-haves","Fix every typo and formatting inconsistency \u2014 the dub reflects Spark","Never add, inflate, or invent \u2014 dubbing is presentation, not fiction","Save as PDF and attach it in the candidate's relevant documents"]},{t:"note",x:"Practice rep: your leader will hand you a rough resume \u2014 dub it into the template, then walk them through what you changed and why."}],checks:["I know where the dub template lives in Spark HQ","Dubbed a practice resume and reviewed it with my leader"]},{id:"s4-reference",title:"Art of the Reference",blocks:[{t:"h",x:"Pre-call preparation"},{t:"list",x:["Candidate name, company name, manager info (title, contact)","Type of employment and agency used, if any","Total dates of employment and time under the manager's supervision","The candidate's feedback about this manager \u2014 use it to build rapport"]},{t:"h",x:"The intro \u2014 set the tone"},{t:"list",x:["Introduce yourself and thank them for their time","Explain why you're calling \u2014 considering the candidate for X role",`Use the candidate's words: "They mentioned you helped them improve their leadership and gave them exposure to PLC programming."`,"Casually confirm title, team size, and their time managing the candidate"]},{t:"h",x:"TEDW \u2014 conversation, not interrogation"},{t:"note",x:"Tell me. Explain. Describe. Walk me through. Open-enders get you stronger answers than rapid-fire yes/no questions."},{t:"h",x:"Core reference questions"},{t:"kv",x:[["Core responsibilities",'"Walk me through what they handled day to day."'],["Quality of work",'"Describe how they performed in their role."'],["Technical skills","Tailor to the req \u2014 electrical, mechanical, PLCs"],["Attitude & effort",'"Tell me about their attitude and work ethic."'],["Team fit",'"How did they collaborate across departments?"'],["Attendance","Ask only if relevant \u2014 engineering vs. floor matters"],["Reason for leaving",'"Can you share your perspective on their departure?"'],["Additional notes",'"Anything I should share with their next leader?"']]},{t:"h",x:"Try to set the meeting"},{t:"note",x:`"Based on what I know, [candidate] came through [agency]. We're a direct competitor and would love to introduce our services. Would tomorrow at 11 AM work?"`},{t:"h",x:"Log it"},{t:"steps",x:["Fill out the reference document","Upload it into the candidate's files in Asymbl","Change the logo to the appropriate internal company"]}],checks:["I know TEDW and the core reference questions","Reference logged in Asymbl"]},{id:"s4-placement",title:"Submittal, Interview, Offer",blocks:[{t:"h",x:"Submittal \u2014 the formal presentation"},{t:"list",x:["Qualify the candidate with references first \u2014 recent managers, supervisors, or peers; document feedback in the ATS","Write the submittal from the template \u2014 copy and paste with the correct information","Attach the dubbed resume in relevant documents","Formatting and spelling clean and professional \u2014 the submittal reflects YOU"]},{t:"note",x:"Hands-on: in the ATS Sandbox, add your candidate to the job, then move them from Source to Submit on the Kanban."},{t:"note",x:"Background checks and drug screens have their own rules \u2014 what can be asked, when, and what happens if something comes back. The Recruitment Compliance Training module in SharePoint walks the full process; it is linked in The Law step of this stage."},{t:"h",x:"Interview \u2014 schedule, prep, follow up"},{t:"list",x:["Confirm availability with both parties; coordinate the logistics (virtual link, location, time zone); double-check formats","Send the candidate a detail email: date, time, format, interviewer names and titles, company overview, prep materials","Prep the candidate to win: presentation tips, JD talking points, research the company, prepare questions \u2014 offer a mock Q&A if needed","After: ask the client for feedback and next steps; run a post-interview call with the candidate; update the ATS with everything"]},{t:"h",x:"The hiring decision"},{t:"kv",x:[["Make the call",'Be excited: "Congratulations \u2014 you got the job!" Confirm their decision and give a timeline if they need to think.'],["If they accept","Send offer details to TMX (onboarding team) \u2014 start date, compensation, special instructions. Push the offer through the ATS, attach documentation, align the candidate for onboarding."],["If they decline","Notify the Account Manager, share why (compensation, other offers, fit), document in the ATS with notes for pipeline planning. Keep it positive \u2014 declines can still become future placements."]]}],checks:["Submitted a candidate on the Kanban","I know the interview prep and follow-up sequence","I know the accept and decline paths"]},{id:"s4-sandbox",title:"The Sandbox: Run a Placement",sim:"sandbox",blocks:[{t:"p",x:"Everything you just learned, end to end \u2014 in a working replica of the ATS with training data. No trainer needed, nothing to break. Five missions: add a candidate, attach them to the live req, log a prescreen, log a reference, and walk them across the Kanban to Placement."},{t:"note",x:"The Kanban enforces the real rules: no submittal without a logged prescreen, no interview without a reference on file, no skipping stages. If you try, it tells you why \u2014 the same way your leader would."}],checks:[]},{id:"s4-service",title:"Ongoing Communication",blocks:[{t:"h",x:"Before the first day"},{t:"list",x:["Confirm start date and time with both candidate and client","Send a first-day prep email at least 2 business days out: start time, location or link, point of contact, dress code, materials, parking or check-in","Day-before check-in call: confirm they're ready, answer questions, share the excitement"]},{t:"h",x:"First-day coordination"},{t:"list",x:["Notify the client the candidate is set to arrive; share any updates","Update the ATS: mark them Started, log the check-in call"]},{t:"h",x:"First-day follow-up"},{t:"list",x:["Call or message after their first day \u2014 ask how it went","Address concerns fast; share feedback with the Account Manager if needed"]},{t:"h",x:"Ongoing communication"},{t:"kv",x:[["Check-ins","Weekly or bi-weekly. Experience, workload, concerns. Document in the ATS to flag issues early."],["Performance feedback","Share client feedback \u2014 positive AND constructive \u2014 professionally and supportively."],["Redeployment","Spot high performers nearing assignment end and proactively match them to new roles. Redeployment cuts time-to-fill and strengthens client relationships."],["Hours & pay liaison","You're the point of contact for timesheet, hours, and pay issues. Communicate with the candidate and TMX, resolve fast, log every concern and resolution in the ATS."]]}],checks:["First-day prep email template ready","My check-in cadence is set"]},{id:"s4-legal",title:"The Law: Recruiting & Terminations",sim:"legalradar",blocks:[{t:"h",x:"Go deeper: Recruitment Compliance Training"},{t:"p",x:"Spark maintains a full Recruitment Compliance Training module covering background checks and drug testing end to end \u2014 what we can ask, when we can ask it, consent and disclosure requirements, adverse action steps, and how results get handled. Work through it alongside this stage; your leader will expect you to know it before you touch a live background check."},{t:"link",href:"https://sparktalent.sharepoint.com/sites/ComplianceTraining/SitePages/Recruitment-Compliance-Training.aspx",x:"Open Recruitment Compliance Training"},{t:"p",x:"Federal law prohibits discrimination throughout recruiting, onboarding, and the workplace \u2014 enforced largely by the EEOC. Spark is an Equal Opportunity Employer."},{t:"h",x:"Protected classes (including Michigan's Elliott-Larsen additions)"},{t:"list",x:["National origin","Race","Color","Sex","Age 40+","Religion","Genetic information","Marital status","Height / weight","Arrest record","Disability"]},{t:"h",x:"Eight laws to know"},{t:"kv",x:[["Title VII, Civil Rights Act of 1964","No discrimination on race, color, religion, national origin, or sex \u2014 including pregnancy and sexual harassment."],["Equal Pay Act of 1963","No paying different wages to men and women doing essentially the same work under similar conditions."],["Civil Rights Act of 1966","No discrimination based on race or ethnic origin."],["Immigration Reform and Control Act of 1986","No discrimination on national origin or citizenship of persons authorized to work in the U.S."],["Americans with Disabilities Act","No discrimination against persons with disabilities."],["Bankruptcy Act","No discrimination against anyone who has declared bankruptcy."],["Equal Employment Opportunity Act","No discrimination against minorities based on poor credit ratings."],["ADEA","No discrimination against individuals age 40 or above."]]},{t:"h",x:"Tips to stay clean"},{t:"list",x:["Go with the natural flow of the interview and stay conversational. If an applicant mentions a protected class, don't panic \u2014 pivot and note that Spark complies with the EEOC","Keep it professional; never ask personal questions in an interview","Document legitimate, non-discriminatory reasoning for decisions; never note a protected class. Notes are facts, never opinions","Pivot back to job-related questions rather than away from uncomfortable subjects"]},{t:"h",x:"Terminations \u2014 the process"},{t:"list",x:["Get feedback from the client: the reason (performance, attendance, fit) with specific examples or documentation","Call the candidate directly \u2014 never deliver termination details in a voicemail; if no answer, leave a message asking for a callback only",'Walk through the feedback clearly and respectfully. Facts, not feelings: "The client has decided to end the assignment due to attendance concerns."',"Never communicate through family or friends","Don't apologize \u2014 stay neutral, transparent, and polite; respect their dignity","Log it in the ATS: reason, client feedback, date. Notify payroll so final pay is right. Keep records secure and confidential","Offer to help with future opportunities when appropriate"]},{t:"h",x:"Michigan specifics"},{t:"list",x:["At-will employment: termination any time, for any reason \u2014 as long as it's not illegal","Illegal reasons: discrimination (Elliott-Larsen Civil Rights Act), retaliation for whistleblowing or reporting unsafe conditions (Whistleblowers' Protection Act), breach of a written or implied contract","Always confirm no protected status or retaliation risk before proceeding","Never discuss termination details with other candidates or coworkers"]},{t:"p",x:"Radar check: six scenarios. Call each one CLEAN or LINE CROSSED."}],checks:[]},{id:"s4-charge",title:"Charge + Your 30/60/90",tool:"charge",blocks:[{t:"h",x:"How charge works"},{t:"p",x:"Charge (the bill rate) is what we invoice the client for a contractor's hour. It has to cover the contractor's pay, the burden on that pay (payroll taxes, workers' comp, insurance), and the gross profit that keeps the lights on. Charge discipline is how the PI Board numbers stay real."},{t:"note",x:"Charge now has its own tab in the top navigation \u2014 the full walkthrough, the discipline rules, and this same calculator live there. Entity-specific burden rates are in the Charge Calculation guide in Spark HQ; your leader will run it with you live."}],extra:[{t:"h",x:"30, 60 & 90-day evaluations"},{t:"p",x:"There will be 30-, 60-, and 90-day evaluations with you and your leader to make sure you're on track and fully understanding the recruiting process and daily responsibilities. Pin the eval sheet in your cubicle as a reminder to stay focused and keep developing."},{t:"list",x:["When it's eval time, your leader will notify you","You complete the self-evaluation section first","Then you review it together with your leader","It is YOUR job to get these done well \u2014 and to remind your leaders and peers when you need help hitting one of these goals"]}],checks:["I can walk the charge math out loud","Eval sheet pinned at my desk","30-day self-evaluation date known"]}]},{id:"s5",num:"05",name:"One Standard",tag:"HR & compliance. Respect, confidentiality, pay, security, EEO \u2014 signed.",celebrate:"Signed, sealed, on record. You hold the standard now.",steps:[{id:"s5-respect",title:"Respectful Workplace",attest:!0,blocks:[{t:"p",x:"Spark maintains a workplace free of harassment, discrimination, and retaliation \u2014 full stop. This applies in the office, on client sites, on calls, in Teams, and at company events."},{t:"h",x:"What crosses the line"},{t:"list",x:["Unwelcome conduct based on any protected class \u2014 verbal, physical, or visual","Sexual harassment of any kind, including unwelcome advances, comments, or messages",`Jokes, slurs, or "banter" targeting someone's identity \u2014 intent doesn't erase impact`,"Retaliation against anyone who reports a concern in good faith"]},{t:"h",x:"If you see it or experience it"},{t:"list",x:["Report it to your team leader, any leader you trust, or Operations (Allie Spegel / Mary Patrico)","Reports are handled promptly, discreetly, and without retaliation","You will never be penalized for raising a concern in good faith"]},{t:"note",x:`Leaders have a duty to act on anything they see or hear. "I didn't want to get involved" is not a Spark answer.`}],checks:[]},{id:"s5-confidential",title:"Confidentiality & Data",attest:!0,blocks:[{t:"p",x:"Every day you'll handle information people trusted us with: candidate resumes, pay details, client rates, internal numbers. Treat it like it's yours \u2014 because protecting it is."},{t:"list",x:["Candidate PII (resumes, pay, references, personal details) stays in the ATS and approved systems \u2014 never in personal accounts or group chats","Client information \u2014 rates, org charts, openings \u2014 is never shared outside the team that needs it","All files live in OneDrive or SharePoint. Nothing company-related on personal drives or USB sticks","Never share your credentials with anyone, including coworkers","Lock your screen when you step away (Windows key + L)","Termination details, investigations, and pay issues are discussed only with the people who need to know"]}],checks:[]},{id:"s5-pay",title:"Pay, PTO & Timekeeping",attest:!0,blocks:[{t:"p",x:"Greenshades is home base for everything pay: pay stubs, PTO requests, and floating holidays. GreenEmployee is the mobile app."},{t:"list",x:["Request PTO in Greenshades with as much notice as you can \u2014 your leader approves it there","Review every pay stub. If something looks off, flag it immediately to internal payroll","If your role records time, your time records must be accurate and yours alone \u2014 never punch, log, or adjust for someone else","Floating holidays are requested through Greenshades like PTO"]},{t:"note",x:"Pay problems are fixed fast when they're raised fast. Never sit on a discrepancy."}],checks:[]},{id:"s5-security",title:"Phishing & Security",sim:"phishspot",attest:!0,blocks:[{t:"p",x:"You are the last line of defense. Barracuda filters email, MFA guards your account \u2014 but a rushed click beats both."},{t:"list",x:["Report suspicious email through Barracuda \u2014 when in doubt, report it out","Never approve an MFA prompt you didn't trigger. Ever. Report it immediately","Verify unusual requests (gift cards, wire changes, urgent payroll edits) by CALLING the person on a known number","Check the actual sender address, not the display name","Hover before you click; never enter credentials from an email link","Laptop physical security: shut down before it goes in a bag, never leave it in your car"]},{t:"p",x:"Radar check number two: five messages just hit your inbox. Call each one."}],checks:[]},{id:"s5-eeo",title:"Equal Opportunity & I-9",attest:!0,blocks:[{t:"p",x:"Spark is an Equal Opportunity Employer. Employment decisions \u2014 hiring, placement, pay, promotion, termination \u2014 are made on qualifications, performance, and business need. Never on a protected class."},{t:"list",x:["The protected classes you drilled in Stage 04 apply internally too \u2014 including Michigan's Elliott-Larsen additions: marital status, height/weight, arrest record","Every new hire completes Form I-9 employment eligibility verification within the first three days of work","Reasonable accommodations: if you need one, raise it with your leader or Operations \u2014 the conversation is confidential","Concerns about discrimination follow the same reporting path as harassment: any leader you trust, or Operations"]}],checks:[]}]}],ke=[{bad:"employee",opts:["team member","staff member","worker"],right:0,why:"We're all part of one high-performance team \u2014 internally and with clients."},{bad:"boss / manager",opts:["supervisor","team leader","superior"],right:1,why:"Leaders lead teams. Titles that imply rank over people aren't how we talk."},{bad:'"No problem"',opts:['"Sure, whatever"',`"It's fine"`,'"My pleasure"'],right:2,why:'Positive phrasing, zero negative connotations. "Absolutely" works too.'},{bad:"fee / cost",opts:["investment","charge","expense"],right:0,why:`"Fee" and "cost" imply loss. "Investment in the search" frames the client's gain.`},{bad:"applicant",opts:["prospect","candidate #12","potential team member"],right:2,why:"They're not a number in a stack \u2014 they're a potential team member."},{bad:'"Happy Friday!"',opts:['"Grateful for the day"','"Almost the weekend!"','"TGIF"'],right:0,why:"Every day is a gift. Gratitude keeps us aligned with excellence, not the countdown."},{bad:"bill",opts:["statement of fees","invoice","charge sheet"],right:1,why:'"Bill" evokes losing something. "Invoice" is neutral and professional.'},{bad:"customer",opts:["account","buyer","client"],right:2,why:"Clients are partners we serve long-term \u2014 not transactions."}],Te=[{say:'"Hello? This is Jordan."',ctx:"Jordan is a CNC machinist you sourced for the Pari Robotics req. Open the call.",opts:[{x:`"Hi Jordan, I'm calling about a job. Are you looking for work right now?"`,ok:!1,why:"Too abrupt \u2014 no introduction, and a yes/no opener invites a hang-up. Introduce yourself clearly first and ask permission for their time."},{x:'"Hi Jordan \u2014 this is [you] with Spark. I came across your CNC background and wanted to connect. Is now a good time to talk for a few minutes?"',ok:!0,why:"Clear intro, why you're calling, and permission for their time. That's the standard."},{x:'"Jordan! Great news \u2014 I have the perfect job for you and I need your resume today."',ok:!1,why:"You haven't earned that yet. Pitching before rapport and permission reads as spam."}]},{say:`"Sure, I've got a few minutes. What's this about?"`,ctx:"Time to learn who Jordan actually is. Get them talking.",opts:[{x:'"Do you have 5 years of CNC experience? Yes or no. Do you know Mastercam? Fanuc controls?"',ok:!1,why:"Rapid-fire yes/no is an interrogation. TEDW \u2014 Tell, Explain, Describe, Walk me through \u2014 gets you real answers."},{x:'"Walk me through your day-to-day on the machines at your current shop \u2014 setups, materials, tolerances."',ok:!0,why:"A TEDW open-ender. Jordan talks, you listen, and the resume comes to life."},{x:'"Let me read you the job description real quick so you know the requirements."',ok:!1,why:"Candidate overview comes before the role overview. Listen first \u2014 then position the role to what you heard."}]},{say:`"Sounds interesting. What's it pay, though? I'm at $27 now and I'm not moving sideways."`,ctx:"The money question. The req's range is $28 to $32 per hour.",opts:[{x:`"Compensation depends on a lot of factors \u2014 let's cross that bridge after the client interview."`,ok:!1,why:"Dodging pay burns trust and wastes everyone's time. Be transparent \u2014 it's in our phone etiquette for a reason."},{x:'"The range on this one is $28 to $32 an hour depending on experience. Where would it need to land for you to make a move?"',ok:!0,why:"Transparent range plus a question that surfaces their real target. Now you can qualify fit honestly."},{x:'"Probably around $27, maybe $28 tops."',ok:!1,why:"Lowballing inside a $28\u201332 range kills the deal and the relationship. Share the real range."}]},{say:`"Okay, $29 or better and I'm interested. What happens next?"`,ctx:"Close the call the Spark way.",opts:[{x:`"Great \u2014 we'll be in touch at some point. Have a good one!"`,ok:!1,why:"Vague next steps lose candidates. Outline exactly what happens after the call \u2014 it's step five of the flow."},{x:`"Here's what happens next: I'll write you up for the client today and follow up by Thursday either way. One more thing \u2014 could you share a couple of professional references, like a recent supervisor?"`,ok:!0,why:"Concrete next steps with a timeline, plus the reference ask. References qualify Jordan AND open lead-gen doors."},{x:`"You're basically hired \u2014 I'll just need you to hang tight."`,ok:!1,why:"Never promise an outcome you don't control. Set honest expectations and keep momentum."}]}],Za=["Source","Submit","Interview","Pending Feedback","Offer","Onboarding","Placement"],ys=[{x:"During a prescreen, the candidate mentions their church volunteer schedule. The recruiter says Spark complies with the EEOC and pivots back to shift availability.",crossed:!1,why:"Clean. Candidates can mention protected classes \u2014 your job is to pivot back to job-related questions, exactly like this."},{x:`A recruiter's submittal note reads: "Team is young and energetic \u2014 candidate may struggle to keep up at his age."`,crossed:!0,why:"Line crossed. Age 40+ is a protected class. Never note a protected class \u2014 notes are facts about qualifications, never opinions about demographics."},{x:'In an interview the recruiter asks: "Have you ever been arrested?"',crossed:!0,why:"Line crossed. In Michigan, arrest record is a protected class under Elliott-Larsen. Convictions may be handled differently, but you never ask about arrests."},{x:'An ATS note reads: "Client reports three no-call no-shows: 6/2, 6/9, 6/12, per signed timesheets. Ending assignment for attendance."',crossed:!1,why:"Clean. Documented, legitimate, non-discriminatory facts with dates and sources \u2014 exactly how termination documentation should look."},{x:`A candidate doesn't pick up, so the recruiter leaves a voicemail: "Hey, the client ended your assignment over attendance \u2014 call me back for final pay details."`,crossed:!0,why:"Line crossed. Never deliver termination details in a voicemail. Leave a message asking for a callback only, and walk through it live."},{x:'A recruiter notes on a profile: "Has two kids \u2014 childcare will probably be an issue for 2nd shift. Passing."',crossed:!0,why:'Line crossed. Familial and marital status are protected. Ask about the actual requirement \u2014 "Can you reliably work 2nd shift?" \u2014 never assume from family details.'},{x:'In an interview the recruiter asks: "Are you a U.S. citizen?"',crossed:!0,why:"Line crossed. Citizenship and national origin are protected. The compliant question: are you authorized to work in the United States?"},{x:'The req requires lifting 50 lbs. The recruiter asks: "Can you lift 50 pounds, with or without a reasonable accommodation?"',crossed:!1,why:"Clean. A real job requirement asked the ADA-compliant way \u2014 tied to the essential function, with accommodation language built in."},{x:'A client tells the recruiter: "Send us younger candidates with fresh energy." The recruiter filters out anyone who looks over 40.',crossed:!0,why:"Line crossed. A discriminatory client request does not make discrimination legal \u2014 fulfilling it puts Spark and you on the hook. Push back and recruit on qualifications."},{x:'An ATS note reads: "Candidate requested Saturdays off for religious observance \u2014 scheduling conflict, passing."',crossed:!0,why:"Line crossed. Religion is protected and reasonable accommodation has to be considered. Evaluate whether the schedule genuinely cannot flex \u2014 never reflex-reject."},{x:'The recruiter asks: "What year did you graduate high school?"',crossed:!0,why:"Line crossed. Graduation year is an age proxy. Ask about the qualification itself \u2014 diploma or equivalent \u2014 never the year."},{x:'Reviewing a work-history gap, the recruiter says: "Walk me through what you were doing between 2022 and 2024."',crossed:!1,why:"Clean. A TEDW open-ender about work history is job-related. If the answer drifts into medical or family territory, pivot back to the role."},{x:'For a 6 AM start in Rochester Hills, the recruiter asks: "Is there anything that would prevent you from reliably getting to the site by 6 AM?"',crossed:!1,why:"Clean. Reliability for the actual shift is job-related. Asking whether they own a car is not \u2014 stick to the requirement, not the means."}],gs=["DAY ONE","MACHINE READY","PLUGGED IN","SPARK FLUENT","CRAFT CERTIFIED","CLEARED \xB7 ONE STANDARD"],vs=[{x:`From: Aaron Opalewski <aopalewski@sparkcompanies.co> \u2014 "Are you at your desk? I need 5 Apple gift cards for a client thank-you. Keep this between us, I'm heading into a meeting."`,phish:!0,why:"Phish. The domain is .co, not .com \u2014 and gift cards + urgency + secrecy is the classic executive-impersonation combo. Verify by calling on a known number."},{x:'From: Microsoft <account-security-noreply@accountprotection.microsoft.com> \u2014 "Your sign-in from a new device was blocked. If this was you, no action is needed."',phish:!1,why:"Legit pattern. Informational, no link-click demanded, no credential ask, real Microsoft security domain. When unsure, go to the account directly \u2014 never through the email."},{x:`MFA push notification at 9:42 PM: "Approve sign-in?" \u2014 you're on the couch watching TV, laptop closed.`,phish:!0,why:"Treat as an attack. You didn't trigger it, so someone with your password did. Deny it and report immediately \u2014 approving a prompt you didn't start hands over your account."},{x:'From: Priyanka Malani <pmalani@sparkcompanies.com> \u2014 "Reminder: timesheet approvals are due by noon Friday before the holiday. Approve in Greenshades as usual."',phish:!1,why:"Legit pattern. Correct internal domain, routine process, points you to the system you already use \u2014 no link demanding credentials, no urgency trap."},{x:'From: DocuSign <dse@docusign-notify.net> \u2014 "URGENT: Contract expires in 2 hours. Sign in with your Microsoft 365 password to view the document."',phish:!0,why:"Phish. Countdown urgency plus a third-party page asking for your Microsoft password \u2014 DocuSign never needs your 365 credentials. Report it through Barracuda."}],Va=[{q:'A client asks what your "fee" is. In the Spark vocabulary, you frame it as their\u2026',opts:["expense","investment","charge"],right:1},{q:"It's Friday morning on the floor. The Spark greeting is\u2026",opts:['"Happy Friday!"','"TGIF \u2014 almost there!"','"Grateful for the day."'],right:2},{q:"On the Kanban, a candidate moves from Submit directly to\u2026",opts:["Interview","Pending Feedback","Offer"],right:0},{q:"First beat of a cold call to a sourced candidate:",opts:["Read the job description so they know the requirements","Introduce yourself, say why you're calling, and ask if now is a good time","Ask if they're looking for a job \u2014 yes or no"],right:1},{q:"TEDW stands for\u2026",opts:["Tell, Explain, Describe, Walk me through","Talk, Engage, Discuss, Wrap up","Tenure, Experience, Drive, Work ethic"],right:0},{q:"The req range is $28\u201332/hr and the candidate is at $27 asking about pay. You say\u2026",opts:['"Around $27, maybe $28 tops."',`"Let's discuss compensation after the client interview."`,'"The range is $28 to $32 depending on experience \u2014 where would it need to land?"'],right:2},{q:"A candidate mentions their church mid-prescreen. You\u2026",opts:["Note it in the ATS for culture-fit context","Pivot back to job-related questions and move on","End the call to avoid legal exposure"],right:1},{q:"Which note belongs in the ATS?",opts:['"Great guy, but at his age the pace might be a problem."','"Three documented no-call no-shows: 6/2, 6/9, 6/12 per client timesheets."','"Has young kids \u2014 2nd shift childcare will be an issue."'],right:1},{q:"The candidate doesn't answer the termination call. Your voicemail says\u2026",opts:['"The client ended your assignment \u2014 call me for final pay details."','"Please give me a call back when you have a moment."',`"Unfortunately it's bad news about your assignment \u2014 call me."`],right:1},{q:"Pay $30/hr, burden 15%, charge $45/hr. Loaded cost is $34.50 \u2014 your GP per hour is\u2026",opts:["$10.50","$15.00","$4.50"],right:0},{q:"Same deal, 40-hour week. Weekly gross profit is\u2026",opts:["$600","$420","$180"],right:1},{q:"An MFA push appears that you didn't trigger. You\u2026",opts:["Approve it \u2014 it's probably Outlook re-syncing","Ignore it; prompts expire on their own","Deny it and report immediately \u2014 someone has your password"],right:2}],xp=`
