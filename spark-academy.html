tting them fall further behind before the real conversation."},{t:"Sit down for a documented coaching conversation today: \u201CHow can I help?\u201D Gap named, plan set, logged in Greenshades.",verdict:"hit",coach:"Step 1 of the ladder, done right. Desk-side mentions aren't documentation, and they don't count when you need a record later. Name it, plan it, log it."},{t:"Go straight to an opportunity letter. Three weeks is three weeks.",verdict:"miss",coach:"You skipped two rungs. The ladder exists so people get a real chance to recover, and so the process holds up when it matters."}]},{setup:"Sam, your steadiest, most team-first recruiter, has had sloppy submittal packaging two weeks in a row. Uncharacteristic.",options:[{t:"Flag it in the team huddle so everyone gets the reminder at once.",verdict:"miss",coach:"Praise in public, coach in private. Never the reverse. For a Relater like Sam, public correction lands twice as hard and costs you trust you'll want later."},{t:"One-on-one: connect first, then the specific examples, then ask what's going on. They won't volunteer it.",verdict:"hit",coach:"Same standard, right delivery. Relaters carry things quietly; something's usually underneath an uncharacteristic slip. You hold the bar and keep the person."},{t:"Email the errors with the packaging checklist attached. Efficient and documented.",verdict:"miss",coach:"Documentation without connection. An email can't tell you why your steadiest person suddenly slipped, and cold correction in writing reads like a door closing."}]},{setup:"A priority req has been open four days with zero client response. Your ARM says \u201CI'm working it. I'll try them again Monday.\u201D",options:[{t:"Trust the ARM's plan. It's their account relationship to manage.",verdict:"miss",coach:"Three days of client silence is the trigger, and it already passed. Leaving critical gaps to the team isn't empowerment. The Director standard calls it abandonment."},{t:"You call the client today. Then coach the ARM on why day three is the line.",verdict:"hit",coach:"That's the escalation trigger, verbatim: 3+ days of no client response, you inject yourself. Not your ARM. You. Then the coaching turns one save into a standard."},{t:"Escalate it to your VP so it gets executive attention.",verdict:"miss",coach:"This one is yours. Escalating what you're accountable for teaches your team that problems move up instead of getting solved."}]},{setup:"Review season. You rate a rep \u201Cbelow expectations.\u201D They're visibly blindsided: \u201CNobody ever told me this.\u201D You check Greenshades. They're right. Nothing's logged.",options:[{t:"Soften the rating to keep the relationship. You'll tighten up next cycle.",verdict:"miss",coach:"Now the record says they're fine and reality says they're not. The gap just got wider and it's still undocumented."},{t:"Hold the rating and own the miss out loud: they should have heard this months ago and that's on you. Then reset with a written plan and weekly checkpoints.",verdict:"hit",coach:"Nobody at Spark should be surprised by a review. When they are, that's a leadership failure, not a rep failure. Owning it is leading by example."},{t:"Walk them through the KPI dashboard. The numbers were always visible to them.",verdict:"miss",coach:"Visible isn't the same as coached. If dashboards did the job, they wouldn't need a leader."}]},{setup:"Your top biller, a classic Builder, is coasting: big numbers off legacy accounts, call sheet thin for a month, and visibly bored.",options:[{t:"Leave them alone. The numbers are the numbers. Don't poke the bear.",verdict:"miss",coach:"Results without activity is borrowed time; the pipeline behind that number is already thinning. And a bored Builder doesn't stay."},{t:"Reset activity expectations directly and put a mountain in front of them: an expansion account and a develop-your-replacement track.",verdict:"hit",coach:"Both halves matter. The standard applies to top billers, and Builders run on challenge. Give them one that grows the business."},{t:"Mention the ladder. Coasting is coasting, top biller or not.",verdict:"miss",coach:"Leading with the hammer on your best producer trades a coaching moment for a resentment. This is a Builder who needs a mountain, not a warning."}]}],Dh=[{setup:"Friday order desk review. Your ARM reports a priority req as \u201Ccovered.\u201D You check: zero submittals in five days.",options:[{t:"Take their word for it. They know the account better than you.",verdict:"miss",coach:"Covered means candidates in play, not a name on a spreadsheet. The standard is 80%+ of reqs with real coverage inside 48 hours, and you verify it yourself."},{t:"Reassign sourcing support today and coach the ARM on what covered actually means.",verdict:"hit",coach:"Fix the gap and reset the definition. Coverage is submittals moving, and the Friday review exists so nothing rides into the weekend on a word."},{t:"Note it and check again Monday.",verdict:"miss",coach:"That's the weekend gap the Friday review exists to close. Monday means three more lost days on a priority req."}]},{setup:"A termination comes through Tuesday morning. The recruiter says they'll \u201Cstart sourcing the backfill next week once things calm down.\u201D",options:[{t:"Reasonable. The desk is slammed and it's one headcount.",verdict:"miss",coach:"Every term without a backfill plan is a revenue leak, and you're accountable for the gap. Next week is five days of leak."},{t:"Same-day backfill plan: who's sourcing, from where, and when the client sees candidates. Today.",verdict:"hit",coach:"That's the standard verbatim: same-day backfill plan on every termination, 100% in the know. The plan takes ten minutes. The leak doesn't stop until it exists."},{t:"Handle the sourcing yourself so it's done right.",verdict:"miss",coach:"Now you're a recruiter with a Director title, and your recruiter learned nothing. Own the plan, not the tasks."}]},{setup:"A rep has missed the weekly meeting target two weeks running. Their take: \u201CThe market's dead right now. Nobody's taking meetings.\u201D",options:[{t:"They might be right. Adjust the target until the market picks up.",verdict:"miss",coach:"Rep meeting targets are enforced, not suggested. The market excuse dies the moment one teammate hits the number in the same market."},{t:"Address it directly this week: targets stand, then get in the trenches. Joint calls, list review, watch their approach.",verdict:"hit",coach:"Two weeks of missed targets is the escalation trigger. Hold the number and diagnose the real blocker side by side. That's enforcement and coaching in the same move."},{t:"Put them on the opportunity ladder. Two weeks is the trigger.",verdict:"miss",coach:"The trigger says address it directly, not skip diagnosis. If the approach is broken, coaching fixes it faster than paper. The ladder comes if it won't turn."}]},{setup:"One of your top accounts runs 12 heads but could hold 40. Your BD's read: \u201CThey never buy more. I check in monthly.\u201D",options:[{t:"Trust the read. BD owns the relationship.",verdict:"miss",coach:"Undersaturated top accounts are your expansion plays, and they get Director-led contact, minimum two per week. A monthly check-in is how 28 heads stay on the table."},{t:"Make it a Director-led play: you're in the account this week, mapping the departments we're not in.",verdict:"hit",coach:"That's exactly where your direct time goes. If it can move a needle in 30 days, it gets you. If it can't, delegate it."},{t:"Push BD to call weekly instead of monthly.",verdict:"miss",coach:"More of the same call isn't the play. Expansion at a top account is Director-led by standard, because the conversation changes when you're in the room."}]},{setup:"Wednesday of start week. One of four Monday starts is unconfirmed. The recruiter: \u201CI left a voicemail, waiting to hear back.\u201D",options:[{t:"Give it until Thursday. Voicemails take time.",verdict:"miss",coach:"Start-week fills ar
