<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark Charge Command Center — WE 8.2.26</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#030509;--bg2:#080B11;--sf:#0C1017;--sf2:#11161F;--sf3:#161C28;--bd:#181E2C;--bd2:#28324A;
--y:#FFC800;--y2:#CC9F00;--y3:#8F7000;--ybg:rgba(255,200,0,.05);--ygl:rgba(255,200,0,.12);
--grn:#00FF88;--red:#FF4466;--blu:#00BFFF;--pur:#B388FF;--org:#FF6B2B;--pnk:#FF69B4;--tea:#00FFD0;
--tx:#EDEAE0;--tx2:#B8B4A8;--dm:#6B7280;--mt:#3A4152;--ft:#1C222F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
body::after{content:'';position:fixed;inset:0;opacity:.022;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none;z-index:999}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.m{font-family:'JetBrains Mono',monospace}

/* Sidebar */
.sb{width:224px;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;z-index:10}
.sb-h{padding:20px 18px 16px;border-bottom:1px solid var(--bd)}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sb-logo span{font-size:14px;font-weight:800;letter-spacing:-.3px}
.sb-logo b{color:var(--y)}
.sb-num{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--y),var(--y2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.sb-lb{font-size:8px;color:var(--dm);text-transform:uppercase;letter-spacing:1.8px;font-weight:700;margin-bottom:3px}
.sb-nav{flex:1;overflow-y:auto;padding:10px 8px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--dm);font-size:12px;font-weight:500;transition:all .15s;border:1px solid transparent;margin-bottom:2px}
.ni:hover{color:var(--tx2);background:var(--sf)}
.ni.on{color:var(--y);background:var(--ygl);border-color:rgba(255,200,0,.12);box-shadow:0 0 16px rgba(255,200,0,.05)}
.ni svg{flex-shrink:0;opacity:.65}.ni.on svg{opacity:1}
.sb-f{padding:14px 18px;border-top:1px solid var(--bd);font-size:9px;color:var(--mt)}

/* Main */
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.mn::before{content:'';position:absolute;top:0;left:0;right:0;height:240px;background:radial-gradient(ellipse 55% 100% at 50% -30%,rgba(255,200,0,.03),transparent);pointer-events:none;z-index:0}
.tp{padding:13px 28px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:rgba(8,11,17,.9);backdrop-filter:blur(12px);flex-shrink:0;z-index:5}
.tp-t{font-size:16px;font-weight:800;letter-spacing:-.4px}
.cnt{flex:1;overflow-y:auto;padding:24px 28px;position:relative;z-index:1}
.pnl{display:none}.pnl.on{display:block;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Cards */
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:14px;position:relative;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.cd::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 15%,rgba(255,255,255,.05) 50%,transparent 85%)}
.cd:hover{border-color:var(--bd2)}
.cdh{padding:14px 20px;border-bottom:1px solid var(--bd);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}

.g{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}

/* Tables */
.tb{width:100%;border-collapse:collapse}
.tb th{text-align:left;padding:10px 14px;font-size:8px;color:var(--dm);text-transform:uppercase;letter-spacing:1.4px;font-weight:700;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--sf);z-index:2;cursor:pointer}
.tb th:hover{color:var(--y)}
.tb th.r{text-align:right}
.tb th.r,.tb td.r{padding-left:6px}
.tb td{padding:9px 14px;font-size:12px;border-bottom:1px solid rgba(24,30,44,.45)}
.tb tbody tr:nth-child(even) td{background:rgba(255,255,255,.008)}
.tb tbody tr:hover td{background:var(--ybg)}
.r{text-align:right}

/* Elements */
.bdg{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.b1{background:linear-gradient(135deg,#FFC800,#8F7000);color:#000;box-shadow:0 2px 10px rgba(255,200,0,.35)}
.b2{background:linear-gradient(135deg,#B8B8B8,#6E6E6E);color:#000}
.b3{background:linear-gradient(135deg,#CD7F32,#8B5A2B);color:#fff}
.bn{background:var(--ft);color:var(--dm)}
.pl{display:inline-flex;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:600}
.fb{padding:6px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--dm);font-size:10px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.fb:hover{border-color:var(--bd2);color:var(--tx2)}.fb.on{border-color:var(--y);color:var(--y);background:var(--ygl)}
.srch{background:var(--ft);border:1px solid var(--bd);border-radius:9px;padding:9px 15px;color:var(--tx);font-size:12px;width:300px;outline:none;font-family:inherit;transition:border-color .15s}
.srch:focus{border-color:var(--y)}
.st{font-size:19px;font-weight:800;margin-bottom:18px;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.st::before{content:'';width:3px;height:20px;background:var(--y);border-radius:2px;box-shadow:0 0 10px rgba(255,200,0,.3)}
.scr{max-height:580px;overflow:auto}

/* Hierarchy rows */
.hrow{border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--sf);transition:border-color .2s}
.hrow:hover{border-color:var(--bd2)}
.hrow.open{border-color:rgba(255,200,0,.2)}
.hhead{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;user-select:none}
.hhead:hover{background:var(--ybg)}
.chev{width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--dm);transition:transform .2s;flex-shrink:0}
.open>.hhead .chev{transform:rotate(90deg);color:var(--y)}
.hbody{display:none;border-top:1px solid var(--bd);padding:6px 14px 12px;background:var(--bg2)}
.open>.hbody{display:block}
.hsub{border:1px solid var(--bd);border-radius:10px;margin-top:8px;overflow:hidden;background:var(--sf)}
.hsub.open{border-color:rgba(255,200,0,.15)}

/* Drawer */
.dro{position:fixed;inset:0;z-index:200;display:none;justify-content:flex-end}.dro.on{display:flex}
.drb{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}
.dr{position:relative;width:580px;max-width:94vw;background:var(--bg2);border-left:1px solid var(--bd);overflow-y:auto;padding:32px;box-shadow:-14px 0 50px rgba(0,0,0,.65);animation:sIn .25s cubic-bezier(.4,0,.2,1)}
@keyframes sIn{from{transform:translateX(80px);opacity:0}to{transform:none;opacity:1}}
.drx{position:absolute;top:16px;right:16px;background:var(--ft);border:1px solid var(--bd);color:var(--dm);cursor:pointer;font-size:13px;padding:8px 12px;border-radius:8px;font-family:inherit;font-weight:600}
.drx:hover{color:var(--tx);border-color:var(--bd2)}

.cy{color:var(--y)}.cg{color:var(--grn)}.cr{color:var(--red)}.cb{color:var(--blu)}.cp{color:var(--pur)}.co{color:var(--org)}.cd2{color:var(--dm)}.cm{color:var(--mt)}.ct{color:var(--tea)}



/* Ticker */
.tik{height:34px;border-bottom:1px solid var(--bd);background:var(--bg2);overflow:hidden;position:relative;flex-shrink:0;display:flex;align-items:center}
.tik::before,.tik::after{content:'';position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.tik::before{left:0;background:linear-gradient(90deg,var(--bg2),transparent)}
.tik::after{right:0;background:linear-gradient(-90deg,var(--bg2),transparent)}
.tik-in{display:inline-flex;gap:34px;white-space:nowrap;animation:tick 55s linear infinite;padding-left:20px}
.tik:hover .tik-in{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.tik-i{display:inline-flex;align-items:center;gap:7px;font-size:11px;cursor:pointer}
.tik-i:hover .tik-n{color:var(--y)}
.tik-n{font-weight:700;color:var(--tx2);transition:color .15s}
/* Live dot */
.live{display:inline-flex;align-items:center;gap:6px;font-size:9px;color:var(--grn);font-weight:700;letter-spacing:1.5px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--grn);animation:pulse 2s ease infinite;box-shadow:0 0 8px var(--grn)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
/* Command palette */
.cp{position:fixed;inset:0;z-index:300;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.cp.on{display:flex}
.cp-bg{position:absolute;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px)}
.cp-box{position:relative;width:560px;max-width:92vw;background:var(--bg2);border:1px solid var(--bd2);border-radius:16px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 0 1px rgba(255,200,0,.06);animation:popIn .18s ease}
.cp-inp{width:100%;background:transparent;border:none;outline:none;padding:18px 22px;font-size:16px;color:var(--tx);font-family:inherit;border-bottom:1px solid var(--bd)}
.cp-res{max-height:380px;overflow-y:auto;padding:8px}
.cp-r{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;cursor:pointer;font-size:13px}
.cp-r:hover,.cp-r.sel{background:var(--ygl)}
.cp-k{font-size:8px;color:var(--dm);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;padding:10px 14px 4px}
/* TV mode */
body.tv .sb{display:none}
body.tv .tik{height:40px}
body.tv .tp{padding:16px 32px}
.tvbar{position:fixed;bottom:0;left:0;right:0;height:3px;background:var(--bd);z-index:400;display:none}
body.tv .tvbar{display:block}
.tvfill{height:100%;background:var(--y);width:0%;box-shadow:0 0 10px var(--y)}
/* Crosshair tooltip */
.xh{position:absolute;pointer-events:none;display:none;z-index:20}
.xh-l{position:absolute;top:0;bottom:24px;width:1px;background:rgba(255,200,0,.35)}
.xh-t{position:absolute;transform:translateX(-50%);background:var(--sf3);border:1px solid var(--bd2);border-radius:8px;padding:7px 12px;font-size:11px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5)}

/* Arena */
@keyframes grow{from{width:0}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.race{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .15s;animation:popIn .4s ease both}
.race:hover{background:var(--ybg)}
.race-track{flex:1;height:26px;background:var(--ft);border-radius:7px;overflow:hidden;position:relative}
.race-fill{height:100%;border-radius:7px;animation:grow .8s cubic-bezier(.25,.9,.3,1) both;position:relative;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:2px}
.race-fill::after{content:'';position:absolute;top:0;right:0;bottom:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.09))}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-family:'JetBrains Mono',monospace;flex-shrink:0;letter-spacing:-.5px}
.pod{border-radius:16px;padding:22px 20px;text-align:center;position:relative;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;animation:popIn .5s ease both}
.pod:hover{transform:translateY(-3px)}
.mv{display:inline-flex;align-items:center;gap:2px;padding:2px 7px;border-radius:5px;font-size:9px;font-weight:700;font-family:'JetBrains Mono',monospace}

@media(max-width:920px){.sb{width:60px}.sb-h,.sb-f,.ni span{display:none}.ni{justify-content:center;padding:10px}.g5,.g4{grid-template-columns:1fr 1fr}.g3,.g2{grid-template-columns:1fr}}
</style>

body.light .lvCredCard select,body.light .lvCredCard input[type=text]{background:#faf9f5!important;color:#17171b!important}

</style></head>
<body>

<div class="sb">
  <div class="sb-h">
    <div class="sb-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="filter:drop-shadow(0 0 9px rgba(255,200,0,.55))"><path d="M12 2L14.5 8.5L21 11L14.5 13.5L12 20L9.5 13.5L3 11L9.5 8.5Z" fill="#FFC800"/></svg>
      <span><b>SPARK</b> CHARGE</span>
    </div>
    <div class="sb-lb">Portfolio &middot; WE 8.2.26</div>
    <div class="sb-num" id="sb-tot"></div>
    <div style="margin-top:5px" id="sb-wow"></div>
  </div>
  <div class="sb-nav" id="nav"></div>
  <div class="sb-f"><span class="m">31 weeks &middot; 487 contractors</span></div>
</div>

<div class="mn">
  <div class="tik"><div class="tik-in" id="tik"></div></div>
  <div class="tp">
    <div style="display:flex;align-items:center;gap:14px"><div class="tp-t" id="tp-t">Pulse</div><span class="live"><i></i><span id="lvWe">WE 8.2.26</span></span></div>
    <div style="display:flex;gap:18px;align-items:center">
      <div style="text-align:right"><div style="font-size:8px;color:var(--dm);text-transform:uppercase;letter-spacing:1.5px;font-weight:700">Q3 Pace</div><div class="m" id="tp-q3" style="font-size:14px;font-weight:700"></div></div>
      <div style="width:1px;height:30px;background:var(--bd)"></div>
      <div style="text-align:right"><div style="font-size:8px;color:var(--dm);text-transform:uppercase;letter-spacing:1.5px;font-weight:700">Producing</div><div class="m" id="tp-pr" style="font-size:14px"></div></div>
      <div style="width:1px;height:30px;background:var(--bd)"></div>
      <button class="fb" onclick="cpOpen()" style="display:flex;align-items:center;gap:7px;padding:8px 14px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>Search <span class="m" style="font-size:9px;opacity:.6">&#8984;K</span></button>
      <button class="fb" onclick="tvToggle()" style="display:flex;align-items:center;gap:7px;padding:8px 14px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>TV Mode</button>
    </div>
  </div>
  <div class="cnt" id="cnt">
    <div class="pnl on" id="p-pulse"></div>
    <div class="pnl" id="p-hier"></div>
    <div class="pnl" id="p-arena"></div>
    <div class="pnl" id="p-lb"></div>
    <div class="pnl" id="p-raw"></div>
    <div class="pnl" id="p-cl"></div>
    <div class="pnl" id="p-dh"></div>
    <div class="pnl" id="p-tg"></div>
  </div>
</div>

<div class="cp" id="cp"><div class="cp-bg" onclick="cpClose()"></div><div class="cp-box"><input class="cp-inp" id="cp-i" placeholder="Search people, clients, units, tabs..." autocomplete="off"/><div class="cp-res" id="cp-r"></div></div></div>
<div class="tvbar"><div class="tvfill" id="tvfill"></div></div>

// ═══ UTILS ═══
function fmt(n){var v=Number(n)||0;return "$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function fK(n){var a=Math.abs(n||0);if(a>=1e6)return "$"+(n/1e6).toFixed(2)+"M";if(a>=1e3)return "$"+(n/1e3).toFixed(1)+"K";return "$"+Math.round(n||0)}
function dl(v,sz){sz=sz||11;return v>0?'<span class="m cg" style="font-size:'+sz+'px">&#9650; '+fK(v)+'</span>':v<0?'<span class="m cr" style="font-size:'+sz+'px">&#9660; '+fK(Math.abs(v))+'</span>':'<span class="cm" style="font-size:'+sz+'px">--</span>'}
function bdg(i){return '<div class="bdg '+(i<3?['b1','b2','b3'][i]:'bn')+'">'+(i+1)+'</div>'}
function pill(t,c){return '<span class="pl" style="background:'+c+'15;color:'+c+'">'+t+'</span>'}
function ecol(n){for(var k in EC){if(n&&n.indexOf(k.split(' ')[0])>=0)return EC[k]}return '#6B7280'}
function pC(p){return p>=100?'var(--grn)':p>=75?'var(--y)':p>=50?'var(--org)':'var(--red)'}
function esc(s){return String(s).replace(/'/g,"\\'")}

// ═══ SVG CHARTS ═══
function areaChart(id,vals,labels,opts){
  opts=opts||{};var W=opts.w||760,H=opts.h||210,P=30,PB=24;
  var mx=Math.max.apply(null,vals.map(function(v){return Math.abs(v)}))*1.1||1;
  var mn=Math.min(0,Math.min.apply(null,vals));
  var rng=mx-mn||1;
  function X(i){return P+i*(W-P*2)/Math.max(1,vals.length-1)}
  function Y(v){return (H-PB)-((v-mn)/rng)*(H-PB-18)}
  var pts=vals.map(function(v,i){return [X(i),Y(v)]});
  var path='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  for(var i=1;i<pts.length;i++){
    var cpx=((pts[i-1][0]+pts[i][0])/2).toFixed(1);
    path+=' C'+cpx+','+pts[i-1][1].toFixed(1)+' '+cpx+','+pts[i][1].toFixed(1)+' '+pts[i][0].toFixed(1)+','+pts[i][1].toFixed(1);
  }
  var area=path+' L'+pts[pts.length-1][0].toFixed(1)+','+(H-PB)+' L'+pts[0][0].toFixed(1)+','+(H-PB)+' Z';
  var col=opts.color||'#FFC800';
  var h='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  h+='<defs><linearGradient id="'+id+'g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+col+'" stop-opacity=".3"/><stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>';
  // Quarter bands (Q2 shaded, Q3 highlighted)
  if(opts.quarters!==false&&labels.length>14){
    var q2s=-1,q3s=-1;
    labels.forEach(function(l,i){var m=+l.split('/')[0];if(m>=4&&q2s<0)q2s=i;if(m>=7&&q3s<0)q3s=i});
    if(q2s>0)h+='<rect x="'+X(q2s)+'" y="10" width="'+((q3s>0?X(q3s):W-P)-X(q2s))+'" height="'+(H-PB-10)+'" fill="rgba(255,255,255,.012)"/>';
    if(q3s>0){h+='<rect x="'+X(q3s)+'" y="10" width="'+(W-P-X(q3s))+'" height="'+(H-PB-10)+'" fill="rgba(255,200,0,.025)"/>';
      h+='<text x="'+(X(q3s)+6)+'" y="20" fill="rgba(255,200,0,.4)" font-size="9" font-family="JetBrains Mono" font-weight="700">Q3</text>';}
  }
  // gridlines
  for(var g=1;g<=3;g++){var gy=(H-PB)-g*(H-PB-18)/4;
    h+='<line x1="'+P+'" y1="'+gy+'" x2="'+(W-P)+'" y2="'+gy+'" stroke="#12161F" stroke-width="1"/>';
    h+='<text x="'+(P-4)+'" y="'+(gy+3)+'" text-anchor="end" fill="#3A4152" font-size="7.5" font-family="JetBrains Mono">'+fK(mn+g*rng/4)+'</text>';}

function spark(vals,color,w,hh){

function countUp(id,target,dur){

var tvOn=false,tvTimer=null,tvProg=null,tvTabs=['pulse','arena','hier'],tvI=0;
function tvToggle(){

    if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(function(){});

function tvCycle(){
  var t0=Date.now(),dur=20000;
  if(tvProg)cancelAnimationFrame(tvProg);
  function prog(){if(!tvOn)return;var p=Math.min(1,(Date.now()-t0)/dur);
    document.getElementById('tvfill').style.width=(p*100)+'%';
    if(p<1)tvProg=requestAnimationFrame(prog)}
  prog();
  tvTimer=setTimeout(function(){if(!tvOn)return;tvI=(tvI+1)%tvTabs.length;go(tvTabs[tvI]);tvCycle()},dur);
}

var arM='wkRaw', arScope='people';
var AR_METRICS=[['wkRaw','Raw (Wk)'],['moRaw','Monthly Raw'],['qRaw','Quarterly Raw'],['cumRaw','Cumulative Raw'],['wow','WoW'],['pace','Q3 Pace']];
function initials(n){var p=n.split(' ');return (p[0][0]+(p[p.length-1][0]||'')).toUpperCase()}
function rankMove(name){
  // rank by last week vs prior week from iw
  var lastR={},prevR={};
  var arr=[],arr2=[];
  Object.keys(D.iw).forEach(function(n){var w=D.iw[n];if(w.length<2)return;
    arr.push([n,w[w.length-1].t]);arr2.push([n,w[w.length-2].t]);});
  arr.sort(function(a,b){return b[1]-a[1]});arr2.sort(function(a,b){return b[1]-a[1]});
  arr.forEach(function(x,i){lastR[x[0]]=i});arr2.forEach(function(x,i){prevR[x[0]]=i});
  if(lastR[name]===undefined||prevR[name]===undefined)return null;
  return prevR[name]-lastR[name];
}
