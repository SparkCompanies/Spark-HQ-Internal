name: Azure Static Web Apps CI/CD
on:
  push:
    branches:
      - main
jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy static file
    steps:
      - uses: actions/checkout@v4
      # ACCESS_v1: index.html is too big to edit on github.com, so the pending patch is applied to the build copy here.
      # Idempotent; prints "already applied" once index.html in the repo carries the change.
      - name: Apply pending index.html patches
        run: CI=1 node apply-access-v1.cjs || echo "patch skipped"
      - name: Stage site
        run: |
          mkdir -p site
          # Stage only the real pages. "cp *.html site/" also published every backup at the
          # repo root (index.backup-*, *.bak.html, spark-home.backup-*, index.2026-*), which
          # bloated the deploy and, worse, made those old copies fetchable on the live site.
          for f in *.html; do
            case "$f" in
              *.backup-*|*.bak.html|*.bak-*|index.2026-*) continue ;;
            esac
            cp "$f" site/
          done
          cp *.mp4 *.png *.jpg *.svg *.pdf *.webm *.mp3 site/ 2>/dev/null || true
          # PWA_v1: the installable app needs these served as real files. Without them Azure
          # falls back to index.html, the service worker is refused for bad MIME type, and
          # push notifications never register.
          cp sw.js manifest.webmanifest site/ 2>/dev/null || true
          if [ -d icons ]; then mkdir -p site/icons && cp icons/* site/icons/; fi
          # BRAND_HUB_v1: the brand page needs its script and its logo folder served as real
          # files. Root *.js is NOT staged wholesale on purpose - the repo root holds helper
          # snippets that should never be public - so name each page script explicitly.
          cp spark-brand.js site/ 2>/dev/null || true
          # MY_LINKS_v1: shell add-on (My links + Update my photo), loaded by spark-home.html
          cp my-links.js site/ 2>/dev/null || true
          # VIEW_AS_v1: super-admin "View as" picker, loaded by spark-home.html the same way.
          cp viewas.js site/ 2>/dev/null || true
          # ACCESS_v1: Admin > Access screen, loaded by spark-home.html the same way.
          cp access.js site/ 2>/dev/null || true
          if [ -d brand ]; then mkdir -p site/brand && cp brand/* site/brand/; fi
          cp staticwebapp.config.json site/staticwebapp.config.json
          echo "Staged $(ls site/*.html | wc -l) pages:"
          ls site/*.html | sed 's|site/|  |'
      - name: Deploy via SWA CLI
        run: npx -y @azure/static-web-apps-cli@latest deploy ./site --env production --deployment-token ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_DUNE_014D74810 }}
